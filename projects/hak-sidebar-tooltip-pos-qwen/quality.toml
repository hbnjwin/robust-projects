[[criterion]]
name = "tooltip定位精度"
description = "[Explicit] 侧边栏折叠状态下tooltip是否准确显示在菜单项右侧，不偏移不遮挡。1: tooltip位置完全错误；2: 大致在右侧但偏移明显；3: 位置基本正确但边缘情况偏移；4: 精确定位且适配不同屏幕；5: 精确定位+自适应方向+防溢出。"
type = "likert"
points = 5
weight = 1.0
score = 2
rationale = "SidebarMenu.vue中折叠态菜单的el-tooltip使用默认placement=\"right\"，但未考虑菜单项高度不一致导致的垂直偏移。tooltip箭头指向与菜单项中心不对齐，视觉上偏移约8px。"

[[criterion]]
name = "折叠展开过渡衔接"
description = "[Explicit] 侧边栏折叠/展开动画期间tooltip是否正确隐藏，动画结束后才可触发。1: 动画期间tooltip闪烁；2: 动画中tooltip位置跳动；3: 动画时隐藏但结束瞬间闪现；4: 平滑过渡无闪烁；5: 过渡+延迟显示+动画同步。"
type = "likert"
points = 5
weight = 1.0
score = 2
rationale = "SidebarMenu.vue的collapse过渡动画使用CSS transition，但tooltip的显隐未与折叠动画同步。折叠过程中hover菜单项会触发tooltip在错误位置闪现，展开过程中tooltip残留不消失。"

[[criterion]]
name = "鼠标移入移出响应"
description = "[Explicit] tooltip的显示和隐藏是否跟随鼠标hover行为，无延迟卡顿或残留。1: hover无响应；2: 响应但有明显延迟；3: 基本响应但快速移动时残留；4: 响应灵敏且快速移动无残留；5: 灵敏响应+虚拟触发+防抖优化。"
type = "likert"
points = 5
weight = 1.0
score = 3
rationale = "el-tooltip的enterable属性默认true，鼠标从菜单项移向tooltip内容时tooltip保持显示。但快速在多个菜单项间移动时，上一个tooltip的hide-after延迟导致多个tooltip同时短暂显示。"

[[criterion]]
name = "子菜单tooltip联动"
description = "[Implicit] 含子菜单的父级菜单项tooltip是否与子菜单面板协调显示。1: tooltip与子菜单重叠；2: 显示冲突但不遮挡功能；3: 折叠态tooltip正确但展开态残留；4: 两种状态均正确联动；5: 联动+子菜单悬浮面板+平滑过渡。"
type = "likert"
points = 5
weight = 1.0
score = 2
rationale = "el-sub-menu折叠态下tooltip与弹出的子菜单面板位置重叠，tooltip显示在子菜单面板上方造成遮挡。未实现tooltip在子菜单弹出时自动隐藏的联动逻辑。"

[[criterion]]
name = "子菜单popover定位修复"
description = "[Explicit] 折叠状态下子菜单popover弹出位置是否在导航栏右侧正确展示，不与折叠栏重叠。1: popover与折叠栏重叠遮挡；2: 位置偏左部分重叠；3: 位置基本正确但有偏移；4: popover精确定位在折叠栏右侧无重叠；5: 精确定位+弹出方向自适应+展开收起动画。"
type = "likert"
points = 5
weight = 1.0
score = 2
rationale = "SidebarMenu.vue中el-sub-menu折叠态的popover使用Element Plus默认定位，popper-offset未配置导致弹出菜单的left值等于折叠栏宽度64px而非紧贴右边缘。popover部分区域与折叠导航栏重叠约20px，点击重叠区域的子菜单项时事件被导航栏拦截无法触发路由跳转。"

[[criterion]]
name = "响应式布局适配"
description = "[Implicit] 不同视口宽度下tooltip位置是否自适应，移动端是否降级处理。1: 仅适配固定宽度；2: 宽屏正常但窄屏溢出；3: 基本响应式但断点处异常；4: 全视口适配且窄屏降级；5: 自适应+移动端手势+断点平滑过渡。"
type = "likert"
points = 5
weight = 1.0
score = 2
rationale = "SidebarMenu.vue的sidebar宽度通过CSS固定值设置，折叠态宽度64px硬编码。tooltip的placement=\"right\"在窄屏设备上可能超出视口右边界，未实现自动翻转或位置调整。"

[[criterion]]
name = "折叠展开文字icon错位修复"
description = "[Explicit] 折叠/展开过渡动画期间菜单项文字与icon是否同步移动，无错位闪烁。1: 文字先显示icon后移动错位明显；2: 有错位约300ms；3: 错位缩短到100ms但仍可察觉；4: 文字与icon通过CSS transition同步过渡无错位；5: 同步过渡+贝塞尔曲线+GPU加速零闪烁。"
type = "likert"
points = 5
weight = 1.0
score = 2
rationale = "SidebarMenu.vue的折叠动画通过CSS width transition实现，但菜单项内的el-icon和span文字使用不同的transition-delay：icon为0ms而文字为150ms，导致展开时文字先于icon显示约300ms。收起时文字opacity过渡与宽度收缩不同步，文字在容器宽度不足时换行闪烁后才被overflow:hidden裁剪。"
