[[criterion]]
name = "重复代码定位"
description = "[Explicit] 是否准确定位DocumentOcrProcessorService和DocumentsServiceImpl中processTocData和createExtractionTasks两段完全逐字复制的代码。1: 未定位到重复代码；2: 只定位到其中一段；3: 定位到两段但未确认逐字复制的程度；4: 准确定位两段代码并确认内容完全相同；5: 定位两段代码、确认逐字复制，并分析了约155行的具体重复范围。"
type = "likert"
points = 5
weight = 1.0
score = 3
rationale = "定位了两段重复代码并创建ExtractionSharedService，但对两个类中方法的逐字复制程度未做详细对比分析，直接开始提取。"

[[criterion]]
name = "共享组件提取"
description = "[Explicit] 是否将两段重复代码提取为独立的共享组件（如@Component或@Service），供两个服务类调用。1: 未提取共享组件；2: 将代码移到其中一个类由另一个调用（引入不当依赖）；3: 提取了共享类但注入方式不合理；4: 提取为Spring @Component或@Service，通过依赖注入使用；5: 提取为Spring组件，方法签名合理，两个调用方的改造最小化。"
type = "likert"
points = 5
weight = 1.0
score = 3
rationale = "创建了ExtractionSharedService作为共享服务，但注入方式上未优化方法签名（未将内部状态获取改为参数传入），可测试性提升有限。"

[[criterion]]
name = "调用方改造"
description = "[Explicit] 是否正确修改DocumentOcrProcessorService和DocumentsServiceImpl，使其调用共享组件而非保留各自的实现。1: 未修改调用方；2: 只修改了一个调用方；3: 修改了两个调用方但保留了部分重复代码；4: 两个调用方都完成改造，删除了各自的重复实现；5: 两个调用方完成改造，重复代码完全消除，且保持了各自原有的调用上下文。"
type = "likert"
points = 5
weight = 1.0
score = 5
rationale = "两个调用方都完成改造：DocumentOcrProcessorService从318行减至109行，DocumentsServiceImpl从685行减至490行，重复代码完全消除且保持了各自的调用上下文。"

[[criterion]]
name = "方法签名统一"
description = "[Implicit] 是否在提取共享方法时统一了两个类中细微不同的方法签名（如参数类型、返回值）。1: 照搬了其中一个类的签名，未考虑另一个的需求；2: 签名不统一导致一个调用方需要额外适配；3: 统一了签名但部分参数冗余；4: 合理统一了方法签名，两个调用方都能自然调用；5: 统一签名并优化了参数设计（如将内部状态获取改为参数传入），提高了可测试性。"
type = "likert"
points = 5
weight = 1.0
score = 2
rationale = "统一了方法签名但未对参数设计做优化，createExtractionTasks仍在方法内部获取SysOperator而非通过参数传入，降低了方法的可测试性和复用性。"

[[criterion]]
name = "代码行数缩减"
description = "[Explicit] 是否通过消除155行重复代码有效减少了两个服务类的总代码量。1: 总行数增加；2: 减少不到10%；3: 减少10-15%；4: 减少15-25%；5: 总行数减少25%以上（原两类合计约1003行）。"
type = "likert"
points = 5
weight = 1.0
score = 4
rationale = "总行数从1003行减至821行（含新增的ExtractionSharedService 222行），两个原始类净减少约404行，但加上新类后总行数仍有增长。实际重复消除效果良好。"

[[criterion]]
name = "Repository依赖处理"
description = "[Implicit] 是否合理处理了共享组件对DocumentsTocRepository和ExtractionTasksRepository的依赖注入。1: 共享组件缺少必要的Repository注入；2: 手动创建Repository实例而非注入；3: 通过构造器注入Repository但注入了过多依赖；4: 合理注入必要的Repository，依赖关系清晰；5: 注入必要Repository并保持了组件的单一职责，未引入不相关的依赖。"
type = "likert"
points = 5
weight = 1.0
score = 3
rationale = "ExtractionSharedService注入了必要的Repository，但在总结中未说明是否避免了引入不相关依赖。"
