[[criterion]]
name = "检查项显示异常定位"
description = "[Explicit] 是否准确识别详情弹窗中检查项有时显示暂无数据的根因。1: 未找到详情弹窗组件或误判为接口问题；2: 找到组件但未意识到字段名匹配导致数据提取失败；3: 识别出数据提取有问题但未明确是接口返回字段名不固定导致；4: 准确定位检查项数组的字段名匹配逻辑导致部分任务数据提取失败；5: 完整分析接口返回数据结构的差异并实现健壮的字段名适配方案。"
type = "likert"
points = 5
weight = 1.0
score = 4
rationale = "准确识别 task-detail-dialog.vue 中检查项数组的字段名硬编码导致部分任务数据无法正确提取，实现了多字段名适配方案。"

[[criterion]]
name = "检查项字段名适配修复"
description = "[Explicit] 是否实现对接口返回不同检查项字段名的健壮适配。1: 未修改字段名匹配逻辑；2: 修改了但仅适配一种字段名仍有遗漏；3: 适配了多种字段名但实现方式为硬编码 if-else 不够灵活；4: 实现了多字段名适配且覆盖了已知的所有变体；5: 采用自动遍历对象属性的方式适配未知字段名确保对新格式也能正确处理。"
type = "likert"
points = 5
weight = 1.0
score = 4
rationale = "通过多字段名适配逻辑覆盖了已知的检查项字段变体，确保不同任务返回的数据均能正确提取。"

[[criterion]]
name = "问题描述列显示修复"
description = "[Explicit] 是否修复问题描述列显示检查项ID编号而非实际描述文字的问题。1: 未发现问题描述列显示异常；2: 发现了但修改了错误的列渲染配置；3: 修改了列渲染但新的字段取值仍不正确；4: 将问题描述列的数据源从 ID 字段改为正确的描述文字字段；5: 修复描述列显示且处理了描述字段为空时的回退显示逻辑。"
type = "likert"
points = 5
weight = 1.0
score = 4
rationale = "直接将问题描述列的渲染逻辑从显示 checkItemId 改为读取实际描述字段，并添加了字段为空时的回退显示。"

[[criterion]]
name = "Vue编译器警告修复"
description = "[Explicit] 是否修复浏览器开发者工具中的 Vue 编译器警告信息。1: 未注意到控制台警告；2: 发现了警告但未定位到产生原因；3: 定位了警告原因但修复方式不正确；4: 准确修复了自定义组件字符串传入 h 函数导致的编译警告；5: 修复警告且验证了控制台不再产生相关警告信息。"
type = "likert"
points = 5
weight = 1.0
score = 4
rationale = "修复了 task-detail-dialog.vue 第149行 h('t-tag', ...) 将字符串改为组件引用，消除了 Vue 编译器将其当作原生 HTML 元素处理的警告。"

[[criterion]]
name = "详情弹窗数据加载健壮性"
description = "[Implicit] 是否确保详情弹窗在不同任务数据结构下都能正确加载和显示。1: 弹窗仅对特定数据格式能正常显示；2: 处理了部分数据格式差异但仍有场景显示异常；3: 大部分任务数据能正确显示但对嵌套字段的处理不够健壮；4: 通过灵活的字段适配确保不同任务数据结构都能正确显示；5: 对数据结构差异做了完整的防御性处理包括空值保护和类型检查。"
type = "likert"
points = 5
weight = 1.0
score = 4
rationale = "检查项适配逻辑覆盖了已知的数据结构差异，同时对描述字段缺失时有回退显示，整体健壮性较好。"

[[criterion]]
name = "改动范围与无关文件控制"
description = "[Implicit] 是否保持修复集中在目标组件且不生成无关的文件或代码。1: 大范围修改了多个与问题无关的组件；2: 生成了无关文件且修改范围超出必要；3: 修改集中在相关文件但过程中有多余的操作步骤；4: 仅修改 task-detail-dialog.vue 和 index.vue 两个直接相关文件；5: 改动精确且每处修改都有明确的问题对应关系。"
type = "likert"
points = 5
weight = 1.0
score = 4
rationale = "仅修改 task-detail-dialog.vue 和 index.vue 两个直接相关文件，每处改动都对应一个具体的 bug 修复。"

[[criterion]]
name = "三处Bug修复完整性"
description = "[Explicit] 是否完整修复检查项不显示、描述列显示ID和Vue编译警告三个问题。1: 仅修复一个问题；2: 修复了两个问题遗漏一个；3: 三个问题都有涉及但其中一个修复不完整；4: 三个问题均已修复且核心功能可用；5: 三个问题完整修复且通过实际运行验证了修复效果。"
type = "likert"
points = 5
weight = 1.0
score = 4
rationale = "三个 bug 均已定位并修复，检查项字段适配、描述列字段映射和 h 函数组件引用警告都得到解决。"
