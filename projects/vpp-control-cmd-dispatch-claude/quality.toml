type = "likert"
points = 5
weight = 1.0
score = 4
rationale = "ControlExecution.vue中超时回调更新status为timeout，NDataTable的rowClassName返回timeout-row类添加红色背景，同时notification.error弹出告警且暗色主题文字可见"
