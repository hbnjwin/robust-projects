[[criterion]]
name = "模块拆分质量"
description = "[Explicit] ML训练脚本模块拆分的质量。1:未拆分仍为单文件;2:仅拆为2个文件拆分不彻底;3:拆为config/model/data/train四个模块职责基本清晰;4:清晰的职责划分含模块间接口定义;5:高内聚低耦合的模块设计含__init__.py导出"
type = "likert"
points = 5
weight = 1.0
score = 3
rationale = "将train.py拆分为config.py、model.py、data.py、train.py四个文件，职责划分基本合理"

[[criterion]]
name = "模块接口设计"
description = "[Explicit] 模块间依赖方向是否单向无循环依赖。1:模块间有循环依赖;2:有import但依赖方向不清晰;3:import关系单向无循环;4:单向依赖且层级清晰如train依赖model和data和config;5:严格的单向依赖且有__init__.py控制导出范围"
type = "likert"
points = 5
weight = 1.0
score = 3
rationale = "模块间import关系清晰：train→model/data/config，无循环依赖"

[[criterion]]
name = "训练一致性验证"
description = "[Explicit] 重构后训练一致性的验证。1:未验证重构后能否正常训练;2:仅检查import无报错;3:运行了训练验证loss能收敛;4:验证loss从2.39降到0.01与原始脚本一致;5:完整的数值对比含随机种子固定和精度验证"
type = "likert"
points = 5
weight = 1.0
score = 4
rationale = "运行训练验证了loss从2.39收敛到0.01，与原始单文件脚本的训练效果一致"

[[criterion]]
name = "配置管理方案"
description = "[Explicit] 配置管理方案的合理性。1:超参硬编码散落在各文件中;2:部分提取但位置不统一;3:独立config.py集中管理超参;4:结构化的配置含默认值和类型定义;5:支持命令行覆盖和配置文件加载的配置系统"
type = "likert"
points = 5
weight = 1.0
score = 3
rationale = "创建了独立的config.py集中管理learning_rate、batch_size、epochs等超参数"

[[criterion]]
name = "代码整洁度"
description = "[Explicit] 代码整洁度和无冗余文件。1:大量冗余代码和无用文件;2:有明显多余的生成文件;3:基本整洁但包含_gen_result.py等不必要文件;4:代码整洁无冗余文件;5:代码规范整洁含适当的类型注解"
type = "likert"
points = 5
weight = 1.0
score = 3
rationale = "拆分后的代码基本整洁，但包含了_gen_result.py等自动生成的不必要文件"

[[criterion]]
name = "排查执行效率"
description = "[Explicit] 重构任务的执行效率。1:超过40次操作;2:30-40次含大量试错;3:20-30次有冗余;4:10-20次基本合理;5:10次以内高效"
type = "likert"
points = 5
weight = 1.0
score = 2
rationale = "共31次操作，在文件创建和验证之间有大量冗余操作"

[[criterion]]
name = "重构范围控制"
description = "[Explicit] 重构范围控制是否符合要求。1:大幅修改了训练逻辑和算法;2:添加了大量原需求之外的新功能;3:保持了原有功能但添加了少量额外内容;4:严格按要求拆分模块未改变训练逻辑;5:精确重构仅涉及文件结构调整零功能变更"
type = "likert"
points = 5
weight = 1.0
score = 3
rationale = "保持了原有训练逻辑不变但添加了一些额外的辅助函数"
