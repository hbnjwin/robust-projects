[[criterion]]
name = "规则库页面不可用根因"
description = "[Explicit] 是否准确识别规则库页面表格空白、按钮无响应、搜索不可用的多个根因。1: 未找到规则库页面文件或仅识别一个问题；2: 找到页面但只定位了表格空白未发现其他问题；3: 识别了2-3个问题但遗漏了版本号与备注列重复；4: 全面识别表格初始数据、按钮绑定、搜索逻辑和列配置的多处问题；5: 系统排查所有UI组件的数据绑定和事件处理并给出完整的问题清单。"
type = "likert"
points = 5
weight = 1.0
score = 3
rationale = "识别了表格初始数据 bodys:[{}] 导致空行和部分按钮无响应的问题，但对搜索区域下拉框选项异常和版本号备注列重复的定位不够全面。"

[[criterion]]
name = "表格初始数据修复"
description = "[Explicit] 是否修复表格 bodys 初始化为 [{}] 导致显示一行空白数据的问题。1: 未修改表格初始化数据；2: 修改了但设置为 null 导致表格组件报错；3: 设置为空数组 [] 但未接入实际数据源；4: 将 bodys 设置为空数组且关联了正确的数据加载逻辑；5: 初始化为空数组且在页面挂载时触发数据获取确保表格能显示实际规则数据。"
type = "likert"
points = 5
weight = 1.0
score = 3
rationale = "将 bodys:[{}] 改为空数组并添加了模拟数据，但添加的硬编码模拟数据不应出现在最终代码中，应从接口获取实际数据。"

[[criterion]]
name = "按钮事件绑定修复"
description = "[Explicit] 是否修复新建规则、编辑、复制、删除按钮点击无响应的问题。1: 未修改任何按钮的事件绑定；2: 修复了部分按钮但遗漏了编辑或删除；3: 所有按钮都绑定了事件但处理函数为空或逻辑错误；4: 所有按钮均绑定了正确的事件处理函数且核心交互可用；5: 按钮事件完整绑定且包含了操作确认弹窗和操作后的表格刷新。"
type = "likert"
points = 5
weight = 1.0
score = 3
rationale = "为新建、编辑、复制、删除按钮添加了事件绑定，但处理函数中使用了 console.log 占位且部分操作缺少完整的业务逻辑实现。"

[[criterion]]
name = "搜索区域功能修复"
description = "[Explicit] 是否修复搜索区域下拉框选项异常和输入框无响应的问题。1: 未涉及搜索区域代码；2: 修改了下拉选项但数据源仍不正确；3: 下拉选项修复但输入框的搜索触发逻辑未实现；4: 下拉框显示正确的业务选项且输入框能触发搜索过滤；5: 搜索区域所有控件功能正常且支持组合筛选条件。"
type = "likert"
points = 5
weight = 1.0
score = 3
rationale = "修复了下拉框的选项配置，但搜索功能的实际过滤逻辑实现不完整，输入关键词后的表格刷新机制未完全接通。"

[[criterion]]
name = "版本号备注列配置修复"
description = "[Explicit] 是否修复表格版本号列和备注列显示相同数据的列配置问题。1: 未发现两列数据重复的问题；2: 发现了但修改了错误的列配置项；3: 修改了 colKey 但新的字段名与实际数据结构不匹配；4: 将两列的 colKey 设置为不同的正确字段名使数据显示正确；5: colKey 修复正确且通过实际数据验证了两列分别显示版本号和备注内容。"
type = "likert"
points = 5
weight = 1.0
score = 2
rationale = "未明确识别版本号列和备注列使用相同 colKey 的配置错误，对表格列定义的排查不够细致。"

[[criterion]]
name = "改动范围与代码质量"
description = "[Implicit] 是否保持修复代码的工程质量且不引入硬编码数据或无关文件。1: 引入了大量硬编码模拟数据或重写了整个页面；2: 生成了无关文件且修复代码质量不高；3: 修复集中但包含调试代码或无关的文件变更；4: 仅修改规则库页面文件且代码质量与项目标准一致；5: 修复精准且代码结构清晰便于后续维护和扩展。"
type = "likert"
points = 5
weight = 1.0
score = 2
rationale = "修复过程中通过 Write 创建了 immutable-munching-metcalfe.md 计划文件引入无关文件，且在表格中添加了不应存在于生产代码的硬编码模拟数据。"

[[criterion]]
name = "页面整体可用性恢复"
description = "[Explicit] 是否修复后规则库页面从完全不可用恢复到核心功能可正常操作。1: 页面仍完全不可用；2: 表格能显示但按钮和搜索仍无响应；3: 大部分功能恢复但有个别按钮或筛选不正常；4: 表格显示、按钮操作和搜索过滤的核心路径均可正常使用；5: 所有功能完全恢复且页面交互流畅无控制台报错。"
type = "likert"
points = 5
weight = 1.0
score = 3
rationale = "页面核心功能基本恢复，表格能显示数据、按钮有响应，但搜索过滤和部分交互的完整性仍有不足。"
