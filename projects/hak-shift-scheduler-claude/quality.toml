[[criterion]]
name = "话务量预测转化"
description = "[Explicit] 是否分析了历史话务量预测模型如何转化为各时段的人力需求。1: 未分析预测模型；2: 提到了预测但未说明转化方式；3: 描述了基于历史数据的预测但转化公式不明确；4: 分析了预测值除以人均处理能力得出人力需求的转化公式；5: 转化分析完整且考虑了技能匹配和服务水平目标(SLA)的影响"
type = "likert"
points = 5
weight = 1.0
score = 4
rationale = "分析了predict_demand方法的预测流程——取近4周同星期同时段的平均话务量乘以1.2缓冲系数，再除以人均每小时处理12通电话得出所需人数，向上取整后作为该时段的最低排班人数"

[[criterion]]
name = "约束条件编码方式"
description = "[Explicit] 是否分析了劳动法合规约束（连续工作天数、班次间隔等）的编码和检查机制。1: 未分析约束编码；2: 列出了约束但未分析编码方式；3: 分析了部分约束的检查逻辑但不全面；4: 分析了硬约束和软约束的区分及检查机制；5: 约束编码分析完整且解释了约束违反时的优先级处理"
type = "likert"
points = 5
weight = 1.0
score = 4
rationale = "分析了约束分为硬约束（必须满足如每天≤8小时、连续≤5天）和软约束（尽量满足如导师在岗偏好），硬约束通过validate_schedule方法在排班后逐一检查，软约束通过打分函数score_assignment影响排班优先级"

[[criterion]]
name = "求解算法分析"
description = "[Explicit] 是否分析了排班算法的求解策略（贪心还是回溯还是整数规划）。1: 未分析求解策略；2: 提到了算法类型但未分析实现；3: 正确识别了算法类型但未分析其优劣；4: 分析了算法的实现逻辑和时间复杂度；5: 对比了当前算法与其他方案（如CP-SAT）的适用性"
type = "likert"
points = 5
weight = 1.0
score = 4
rationale = "分析了scheduler.py采用两阶段求解——第一阶段贪心分配满足硬约束的最低人力，第二阶段启发式优化调整排班平衡员工工时公平性。指出了贪心策略在员工数紧张时可能导致后续时段无法满足约束的局限性"

[[criterion]]
name = "排班错误根因"
description = "[Explicit] 是否准确定位了连上7天班和实习生独立夜班两个排班错误的根因。1: 未分析错误；2: 只分析了一个；3: 两个都分析了但根因不准确；4: 两个错误根因分析准确；5: 根因分析精确且给出了修复方案和回归测试建议"
type = "likert"
points = 5
weight = 1.0
score = 4
rationale = "定位了两个根因——连续7天班是因为check_consecutive_days方法用range(day-4, day)少算了当天（应为range(day-5, day+1)），实习生独立夜班是因为导师约束只检查了同班次ID相同而夜班因为跨日被拆成了两个不同的shift_id导致匹配失败"

[[criterion]]
name = "排班结果评估"
description = "[Implicit] 是否对排班结果的公平性和覆盖率进行了评估。1: 未评估结果；2: 只看了是否满足约束；3: 分析了约束满足率但未评估公平性；4: 分析了员工工时均衡性和时段覆盖率；5: 评估完整含公平性指标、满意度预测和改进建议"
type = "likert"
points = 5
weight = 1.0
score = 4
rationale = "对排班结果分析了两个维度——工时公平性（员工间最大最小工时差应<4小时）和高峰覆盖率（9-11时和14-17时的实际排班人数vs需求人数比例），指出了贪心算法倾向于优先分配排名靠前的员工导致工时分配不均"
