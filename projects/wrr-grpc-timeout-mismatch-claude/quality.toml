[[criterion]]
name = "超时根因分析"
description = "[Explicit] gRPC超时问题的根因定位。1:未找到超时原因;2:知道超时但归因到网络延迟;3:找到了clientCtx的deadline未传递到下游;4:准确定位context.WithTimeout创建的deadline未在gRPC调用链中传播;5:精准定位并分析了gRPC的deadline propagation机制和metadata携带"
type = "likert"
points = 5
weight = 1.0
score = 4
rationale = "准确定位service.go中handler函数收到的ctx含deadline但调用下游时用了新的context.Background()丢失了deadline"

[[criterion]]
name = "Deadline传播修复"
description = "[Explicit] gRPC deadline传播链的修复质量。1:未修复传播问题;2:修复了但context传递方式错误;3:修复了clientCtx传递但未处理级联超时场景;4:正确使用ctx传递deadline并处理了上下游超时链;5:完善的deadline传播含metadata携带剩余时间和超时预算分配"
type = "likert"
points = 5
weight = 1.0
score = 4
rationale = "在service.go的handler中将接收到的ctx直接传递给下游client.Call()，确保deadline在整个调用链中传播"

[[criterion]]
name = "错误处理改进"
description = "[Explicit] gRPC错误处理的改进质量。1:错误被静默吞掉;2:有日志但未返回正确的gRPC status;3:修复了grpc.Dial连接错误的处理;4:完整的错误处理含status.Error返回和日志记录;5:分层错误处理含重试策略和优雅降级"
type = "likert"
points = 5
weight = 1.0
score = 4
rationale = "在client.go中grpc.Dial错误正确返回status.Internal，handler中deadline超时返回status.DeadlineExceeded"

