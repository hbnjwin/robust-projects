[[criterion]]
name = "editor实例生命周期"
description = "[Explicit] keep-alive场景下WangEditor实例正确管理，不重复创建。1:每次activated都新建;2:有销毁但时机不对;3:activated复用/deactivated暂停;4:完整生命周期管理;5:生命周期+切换报告时内容更新"
type = "likert"
points = 5
weight = 1.0
score = 4
rationale = "ReportEditor.vue中onActivated检查editor实例是否存在，存在则通过setHtml(props.content)更新内容而非销毁重建，onDeactivated中不销毁只暂停事件处理，onUnmounted中确保完全销毁"

