[[criterion]]
name = "懒加载触发机制"
description = "[Explicit] 图片懒加载是否正确使用IntersectionObserver或scroll事件实现。1: 无懒加载；2: scroll事件无节流；3: scroll+throttle基本可用；4: IntersectionObserver正确实现；5: IO+rootMargin预加载+优先级队列。"
type = "likert"
points = 5
weight = 1.0
score = 2
rationale = "ReportImageList.vue中图片通过v-for渲染el-image组件，lazy属性虽设置为true但Element Plus的默认懒加载基于scroll事件监听。未配置IntersectionObserver，高频scroll事件在100张图片列表下造成明显卡顿。"

[[criterion]]
name = "滚动跳动修复"
description = "[Explicit] 懒加载图片加载完成后是否保持滚动位置稳定，避免内容跳动。1: 加载后页面严重跳动；2: 有占位但尺寸不匹配；3: 固定占位高度但宽高比不一致；4: aspect-ratio占位+加载后平滑替换；5: 占位+骨架屏+LQIP渐进加载。"
type = "likert"
points = 5
weight = 1.0
score = 2
rationale = "el-image未设置固定宽高，图片加载前容器高度为0。加载完成后图片撑开容器，下方所有内容被推移，滚动位置跳动。用户正在阅读下方内容时被突然推到不同位置。"

[[criterion]]
name = "加载状态展示"
description = "[Explicit] 图片加载过程中是否展示loading状态，加载失败是否有错误提示。1: 无任何加载提示；2: 仅有loading文字；3: loading动画但无失败处理；4: loading骨架屏+失败重试；5: 骨架屏+渐进加载+失败重试+降级图。"
type = "likert"
points = 5
weight = 1.0
score = 2
rationale = "el-image配置了lazy但未设置loading和error的slot内容，加载过程中显示空白区域。加载失败时显示Element Plus默认的破损图片图标，无重试按钮或错误说明文字。"

[[criterion]]
name = "虚拟滚动支持"
description = "[Implicit] 大量图片列表是否实现虚拟滚动，仅渲染可视区域内的DOM节点。1: 全量渲染所有图片；2: 有分页但无虚拟滚动；3: 基本虚拟滚动但高度计算不准确；4: 完整虚拟滚动+动态高度；5: 虚拟滚动+预渲染+滚动恢复。"
type = "likert"
points = 5
weight = 1.0
score = 2
rationale = "ReportImageList.vue通过v-for遍历全部图片数据一次性渲染所有el-image节点，100张图片生成100个DOM元素。虽然lazy属性延迟了图片请求，但DOM节点全部存在造成首屏渲染缓慢和内存占用。"

[[criterion]]
name = "图片缓存策略"
description = "[Implicit] 已加载的图片是否有缓存机制，返回滚动时避免重复请求。1: 无缓存每次重新请求；2: 浏览器缓存但无主动管理；3: 内存缓存但无淘汰策略；4: LRU缓存+preload预热；5: 多级缓存+Service Worker+离线支持。"
type = "likert"
points = 5
weight = 1.0
score = 2
rationale = "el-image依赖浏览器HTTP缓存机制，未主动实现图片缓存管理。当虚拟滚动回收DOM后再次滚动到该位置时，img标签重新创建触发请求。若服务器返回no-cache头则每次都重新加载。"

[[criterion]]
name = "内存泄漏防护"
description = "[Implicit] IntersectionObserver和事件监听是否在组件卸载时正确断开和清理。1: 未清理导致内存泄漏；2: 部分清理有遗漏；3: observer.disconnect但回调引用未释放；4: 完整清理+WeakRef防泄漏；5: 清理+监控+自动GC触发。"
type = "likert"
points = 5
weight = 1.0
score = 2
rationale = "el-image的lazy实现依赖Element Plus内部的scroll监听器，组件销毁时虽调用了removeEventListener但IntersectionObserver实例未disconnect。多次切换路由后观察器实例累积导致内存占用持续增长。"

[[criterion]]
name = "移动端触摸适配"
description = "[Implicit] 触摸设备上快速滑动时懒加载是否正常触发，惯性滚动是否处理。1: 触摸滑动不触发加载；2: 触发但惯性滚动期间遗漏；3: 基本适配但性能差；4: 被动事件监听+惯性滚动适配；5: 适配+手势缩放+触觉反馈。"
type = "likert"
points = 5
weight = 1.0
score = 2
rationale = "scroll事件监听未使用passive选项，触摸设备上滑动时浏览器等待事件处理完毕才更新画面造成卡顿。惯性滚动阶段（momentum scrolling）图片加载时机延迟，快速滑动后停下需等待约500ms图片才开始加载。"

[[criterion]]
name = "SEO与首屏优化"
description = "[Implicit] 首屏可见图片是否优先加载而非懒加载，是否影响搜索引擎爬取。1: 所有图片均懒加载含首屏；2: 首屏懒加载但有noscript降级；3: 首屏直接加载其余懒加载；4: 首屏eager+其余lazy+loading属性；5: SSR预渲染+CDN+WebP自适应。"
type = "likert"
points = 5
weight = 1.0
score = 2
rationale = "ReportImageList.vue对所有图片统一设置lazy属性，首屏可见的前3-4张图片也需等待IntersectionObserver触发后才加载。用户打开页面后首屏图片区域短暂显示空白或骨架屏，增加了首屏可交互时间。"
