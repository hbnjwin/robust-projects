[[criterion]]
name = "慢查询诊断"
description = "[Explicit] MongoDB慢查询的诊断能力。1:未识别慢查询原因;2:知道查询慢但未关联到索引缺失;3:识别了user_id字段缺少索引;4:准确诊断user_id+created_at复合索引缺失导致全集合扫描;5:完整的explain分析含执行计划和扫描行数对比"
type = "likert"
points = 5
weight = 1.0
score = 3
rationale = "识别了user_id字段缺少索引导致慢查询的问题，定位到查询未走索引的根因"

[[criterion]]
name = "索引设计质量"
description = "[Explicit] 索引设计的合理性。1:未创建索引;2:创建了user_id单字段索引不覆盖排序;3:复合索引{user_id:1,created_at:1}基本合理;4:正确的复合索引设计符合ESR原则;5:含覆盖索引和分析对写入性能影响的最优设计"
type = "likert"
points = 5
weight = 1.0
score = 3
rationale = "创建了{user_id:1,created_at:-1}复合索引，字段选择合理"

[[criterion]]
name = "缓存一致性方案"
description = "[Explicit] 缓存与数据库一致性的解决方案质量。1:未处理缓存不一致;2:仅设置ReadPreference.PRIMARY绕过从节点延迟;3:有缓存失效策略但过于简单;4:正确的cache-aside模式含写入时失效;5:完善的一致性方案含TTL+事件驱动失效+读写分离"
type = "likert"
points = 5
weight = 1.0
score = 2
rationale = "设置ReadPreference.PRIMARY强制主节点读取，绕过了从节点延迟但未真正解决缓存一致性"

[[criterion]]
name = "查询结果控制"
description = "[Explicit] 查询结果集大小的控制。1:无限制返回全部数据;2:设了limit但值不合理;3:设置了默认limit=100合理限制;4:limit+skip分页参数化;5:游标分页+结果集大小监控"
type = "likert"
points = 5
weight = 1.0
score = 3
rationale = "在查询中添加了.limit(100)默认限制，防止大结果集返回"

[[criterion]]
name = "索引写入影响评估"
description = "[Implicit] 是否评估了新建索引对写入性能的影响并采取缓解措施。1:未考虑写入影响;2:提及了写入影响但未采取措施;3:设置background建索引但未分析写入放大;4:background建索引且分析了写入放大影响;5:完整评估含写入放大分析和索引维护策略"
type = "likert"
points = 5
weight = 1.0
score = 2
rationale = "未评估新建索引对写入性能的影响，仅关注读优化"

[[criterion]]
name = "排查执行效率"
description = "[Explicit] 排查路径效率。1:超过20次操作;2:15-20次含大量Bash;3:10-15次有冗余但方向正确;4:5-10次路径清晰;5:5次以内精准直达"
type = "likert"
points = 5
weight = 1.0
score = 3
rationale = "共9次操作，部分读取操作有冗余但整体方向正确"

[[criterion]]
name = "代码可维护性"
description = "[Explicit] 修复代码的可维护性。1:硬编码散乱难以维护;2:有基本组织但命名不规范;3:代码基本规范索引创建幂等;4:代码清晰修改幂等含createIndex的if_not_exists;5:模块化设计含配置外置和文档注释"
type = "likert"
points = 5
weight = 1.0
score = 3
rationale = "使用createIndex创建索引，操作幂等可重复执行"
