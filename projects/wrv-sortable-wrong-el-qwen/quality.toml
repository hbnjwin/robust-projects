[[criterion]]
name = "根因定位"
description = "[Explicit] 准确定位列拖拽排序绑定到错误表格的原因：document.querySelector全局选择器选中了先渲染的数据表格而非抽屉内的配置表格。1: 未定位；2: 只发现拖拽不对但不知原因；3: 找到querySelector但未分析多表格并存的选择器优先级；4: 准确定位全局选择器在多表格场景下选中首个匹配元素的问题；5: 定位根因并分析了DOM渲染顺序对querySelector的影响"
type = "likert"
points = 5
weight = 1.0
score = 3
rationale = "通过Read读取custom-header/index.vue两次，找到registerSort函数中的document.querySelector('.el-table__body-wrapper tbody')，识别出全局选择器在多表格场景下的错误选中问题"

[[criterion]]
name = "ref引用修复"
description = "[Explicit] 将全局document.querySelector替换为Vue ref引用或限定作用域的选择器。1: 未修复；2: 修了但语法错误；3: 用ref但引用方式不对；4: 正确添加ref并通过$el限定作用域查询；5: ref引用加nextTick确保DOM挂载后操作"
type = "likert"
points = 5
weight = 1.0
score = 3
rationale = "添加const dragTable = ref(null)声明模板ref，将querySelector改为dragTable.value.$el.querySelector('.el-table__body-wrapper tbody')限定在ref组件内查询"

[[criterion]]
name = "拖拽功能恢复"
description = "[Implicit] 修复后Sortable正确绑定到抽屉内的列配置表格，拖拽操作不影响底层数据表格。1: 拖拽仍错误；2: 能拖但有异常；3: 基本正确但边界情况有问题；4: 拖拽功能完全恢复正常；5: 拖拽正常且处理了抽屉关闭时的cleanup"
type = "likert"
points = 5
weight = 1.0
score = 3
rationale = "修复后Sortable绑定到dragTable.value.$el的tbody，理论上拖拽配置列表正常，但未验证抽屉多次开关后ref是否正确更新"

[[criterion]]
name = "DOM查询安全性"
description = "[Implicit] 修复方案是否避免了querySelector的全局副作用，是否考虑了DOM未就绪的情况。1: 仍用全局选择器；2: 改了但未考虑null safety；3: 有null判断但不完善；4: 完整的ref引用加null safety；5: 完善的null safety加DOM ready保证"
type = "likert"
points = 5
weight = 1.0
score = 3
rationale = "改用dragTable.value.$el.querySelector限定作用域，但未添加dragTable.value的null判断，如果ref未绑定时调用registerSort会抛TypeError"

[[criterion]]
name = "代码精准度"
