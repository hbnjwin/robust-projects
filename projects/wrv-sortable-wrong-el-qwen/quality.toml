type = "likert"
points = 5
weight = 1.0
score = 3
rationale = "4次工具调用（2次Read+2次Edit），第一次Read浏览全文后第二次Read确认具体行号，2次Edit分别添加ref和修改querySelector，路径清晰但有一次重复读取"
