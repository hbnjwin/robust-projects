[[criterion]]
name = "根因定位"
description = "[Explicit] 准确定位debounce包装后this丢失和参数变undefined的原因：wrapper内部直接调用func()未用apply/call转发执行上下文和参数。1: 未定位；2: 只看到报错但不知原因；3: 找到func()但未分析apply/call的必要性；4: 准确定位func()调用缺少apply(this, arguments)导致上下文和参数丢失；5: 定位根因并分析了JavaScript严格模式下this绑定规则"
type = "likert"
points = 5
weight = 1.0
score = 4
rationale = "1次Read定位common-function.js中debounce实现，分析wrapper作为对象方法调用时this指向该对象但func()内部this变为undefined（严格模式），arguments同样未传递"

[[criterion]]
name = "apply/call修复"
description = "[Explicit] 将func()改为func.apply(this, arguments)或func.call(this, ...args)转发执行上下文和参数。1: 未修复；2: 只加了apply但参数不对；3: apply正确但只改了一处；4: 两处func()都改为func.apply(this, arguments)；5: 使用rest params(...args)替代arguments并处理箭头函数场景"
type = "likert"
points = 5
weight = 1.0
score = 5
rationale = "wrapper函数中保存const args = arguments，两处func()改为func.apply(this, args)正确转发上下文和参数，使用普通function保证this绑定"

[[criterion]]
name = "参数传递完整性"
description = "[Implicit] 修复后debounce包装的函数能否正确接收到调用时传入的所有参数。1: 参数仍丢失；2: 只传第一个参数；3: 传了但有时序问题；4: 完整传递所有参数；5: 完整传递且在连续调用时参数不混淆"
type = "likert"
points = 5
weight = 1.0
score = 4
rationale = "通过const args = arguments在wrapper调用时立即捕获参数引用，setTimeout回调中使用args而非重新获取arguments，确保延迟调用时参数不丢失"

[[criterion]]
name = "immediate分支处理"
description = "[Implicit] debounce的immediate模式（首次立即执行）在修复后是否正确工作。1: immediate模式失效；2: 立即执行但后续不防抖；3: 基本正确但连续触发有问题；4: immediate模式正确工作；5: immediate模式正确且有完善的取消/重置机制"
type = "likert"
points = 5
weight = 1.0
score = 4
rationale = "func.apply(this, args)在immediate分支中也正确转发，immediate模式在timer为null时立即执行，逻辑完整"

[[criterion]]
name = "代码精准度"
description = "[Implicit] 修改精准度和工具调用效率。1: 大量无关修改；2: 有冗余操作；3: 修改正确但有额外步骤；4: 精准高效完成修复；5: 最小改动完成修复"
type = "likert"
points = 5
weight = 1.0
score = 5
rationale = "2次工具调用（1次Read+1次Edit），直接读取common-function.js并精准修改func()为func.apply(this, args)，最小改动量"
