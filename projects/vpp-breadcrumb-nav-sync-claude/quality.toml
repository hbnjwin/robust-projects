[[criterion]]
name = "面包屑层级累加"
description = "[Explicit] 是否修复面包屑只显示首页和当前页而丢失中间层级的问题。1: 面包屑仍丢失中间层级; 2: 手动拼接部分层级但不完整; 3: 基于页面层级关系表构建完整路径但配置有遗漏; 4: 建立页面层级关系映射，导航时根据当前页面递归查找父级生成完整面包屑路径; 5: 层级关系映射完整且支持动态页面如资源详情的参数化面包屑"
type = "likert"
points = 5
weight = 1.0
score = 4
rationale = "vpp.ts中定义pageHierarchy映射每个页面到其父级，navigateTo方法递归构建从根到当前页面的完整面包屑路径"

[[criterion]]
name = "面包屑点击导航"
description = "[Explicit] 是否修复点击面包屑中间层级不跳转页面的问题，将router.push改为activeMenu状态切换。1: 点击面包屑仍无反应; 2: 绑定了click但跳转方式不对; 3: NBreadcrumbItem的click事件改为修改activeMenu但未更新面包屑自身; 4: 点击面包屑项时同时更新activeMenu和面包屑路径，页面正确切换; 5: 导航切换加面包屑高亮加过渡动画"
type = "likert"
points = 5
weight = 1.0
score = 4
rationale = "App.vue中NBreadcrumbItem的click回调调用navigateTo方法，同时更新activeMenu和重新生成面包屑路径，页面和面包屑联动正确"

[[criterion]]
name = "页面标题同步"
description = "[Explicit] 是否修复document.title与当前页面不同步的问题。1: 标题仍不随页面切换更新; 2: 手动设置title但遗漏部分页面; 3: watch activeMenu变化时更新title但格式不统一; 4: 导航函数中根据页面名称统一设置document.title为\"虚拟电厂 - 页面名\"; 5: title同步加浏览器标签页favicon联动"
type = "likert"
points = 5
weight = 1.0
score = 4
rationale = "navigateTo方法中同步设置document.title为\"虚拟电厂 - \"加当前面包屑末级的中文标签，所有页面标题显示一致"

[[criterion]]
name = "导航状态管理架构"
description = "[Implicit] 是否将面包屑和导航状态合理组织在store或composable中而非分散在组件内。1: 所有逻辑内联在App.vue模板中; 2: 提取了部分逻辑但状态分散; 3: 创建了导航相关的store或composable集中管理; 4: store中统一管理activeMenu和breadcrumbs和pageTitle的联动; 5: 导航store加TypeScript类型约束加组合式API封装"
type = "likert"
points = 5
weight = 1.0
score = 4
rationale = "vpp.ts store中统一管理activeMenu和breadcrumbs状态，navigateTo action同时处理页面切换和面包屑更新和标题同步"

[[criterion]]
name = "构建验证"
description = "[Implicit] 是否确保修改后TypeScript类型检查和Vite构建通过。1: 存在类型错误或构建失败; 2: 构建通过但有类型警告; 3: 构建通过无错误; 4: vue-tsc和vite build都通过无错误; 5: 构建通过且生产包体积合理"
type = "likert"
points = 5
weight = 1.0
score = 4
rationale = "TypeScript类型检查和Vite构建通过，所有新增类型定义正确"
