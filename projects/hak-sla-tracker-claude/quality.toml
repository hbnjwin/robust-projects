type = "likert"
points = 5
weight = 1.0
score = 4
rationale = "分析了双层通知策略——剩余时间≤30%时发first_warning给处理人，超时后每小时发escalation通知给上级（通过escalation_chain配置的升级路径依次通知组长→经理→总监）。通知去重通过last_notified_at字段确保同一级别通知间隔≥1小时"
