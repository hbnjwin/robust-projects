type = "likert"
points = 5
weight = 1.0
score = 4
rationale = "Claude实现MarketDataFactory.create_ohlcv方法生成长格式OHLCV DataFrame，价格逻辑符合金融常识（open在prev_close附近跳空、high/low包含open和close），支持随机种子和自定义参数"

