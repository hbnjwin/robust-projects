[[criterion]]
name = "倒计时定时器清理"
description = "[Explicit] 是否在组件卸载时清除所有指令的倒计时setInterval防止后台泄漏和负数显示。1: 未保存interval引用无法清除; 2: 仅清除当前可见指令的定时器; 3: onUnmounted中清除主定时器但个别指令定时器遗漏; 4: 维护timerId映射表在卸载时遍历清除所有定时器且倒计时到零后停止; 5: 封装useCountdown composable统一管理多个倒计时的创建销毁和归零停止"
type = "likert"
points = 5
weight = 1.0
score = 3
rationale = "ControlExecution.vue中用timerId变量保存interval返回值，onUnmounted中调用clearInterval，但对多条指令各自的倒计时未采用映射表方式管理，倒计时到零后停止逻辑不够严谨可能出现短暂负数"

[[criterion]]
name = "分解后表格刷新"
description = "[Explicit] 是否修复点击一键分解后指令状态从待分解变为已分解但表格未刷新的问题。1: 表格仍不刷新需手动F5; 2: 刷新了但有明显延迟或闪烁; 3: 分解操作后重新拉取列表数据但表格有短暂空白; 4: 分解成功回调中直接更新reactive数组中对应指令的status字段触发响应式表格刷新; 5: 乐观更新加失败回滚加加载状态提示"
type = "likert"
points = 5
weight = 1.0
score = 2
rationale = "ControlExecution.vue中点击一键分解后调用API成功但未在回调中更新表格数据源的指令状态字段，用户需手动刷新页面才能看到状态变化"

[[criterion]]
name = "暗色主题通知可见性"
description = "[Explicit] 是否修复Naive UI notification组件在暗色主题下文字颜色与背景颜色几乎相同导致看不清的问题。1: 暗色主题下通知仍然看不清; 2: 改了颜色但不符合暗色主题设计规范; 3: 通过覆写notification的CSS变量修复文字可见性; 4: 使用NConfigProvider的themeOverrides为notification组件配置暗色主题下的对比色方案; 5: 主题适配加告警级别不同颜色区分加动画过渡"
type = "likert"
points = 5
weight = 1.0
score = 3
rationale = "ControlExecution.vue中超时告警使用notification.error()弹出，但未针对暗色主题下notification组件的文字颜色做CSS覆写，依赖NaiveUI默认暗色主题样式配置"

[[criterion]]
name = "批量下发串行执行"
description = "[Explicit] 是否修复批量选择多条指令后点批量下发只处理第一条的问题，即forEach中await未串行等待。1: 仍只处理第一条其余无反应; 2: 改为Promise.all但部分失败导致全部回滚; 3: 改为for...of循环串行await处理每条指令; 4: for...of串行await加单条失败不影响后续加成功/失败计数反馈; 5: 串行处理加进度提示加失败重试加最终汇总报告"
type = "likert"
points = 5
weight = 1.0
score = 3
rationale = "ControlExecution.vue的批量下发逻辑将forEach替换为for...of循环配合await串行执行每条指令的下发API调用，但未对单条失败的情况做独立捕获可能导致后续指令被跳过"

[[criterion]]
name = "指令超时自动标红"
description = "[Explicit] 是否在指令超时后自动将该行标红并弹出告警通知。1: 超时后无任何视觉变化; 2: 标红了但通知未弹出; 3: 倒计时归零时触发超时回调修改状态并弹出notification; 4: 超时回调中更新指令status为超时加行样式rowClassName条件标红加notification.warning弹出告警; 5: 标红加告警通知加声音提示加自动滚动到超时行"
type = "likert"
points = 5
weight = 1.0
score = 3
rationale = "ControlExecution.vue中倒计时到零时修改指令状态为超时，NDataTable通过row-class-name根据状态添加红色背景样式，但notification弹出在暗色主题下可见性问题影响了告警效果"
