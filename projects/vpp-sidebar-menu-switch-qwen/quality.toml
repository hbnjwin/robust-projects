[[criterion]]
name = "keep-alive状态保持"
description = "[Explicit] 是否用keep-alive包裹动态组件替代v-if保持切换页面时表单状态不丢失。1: 仍用v-if切换页面状态全丢; 2: 用keep-alive但include配置错误导致部分页面未缓存; 3: keep-alive加component :is基本可用但max未设置可能缓存过多; 4: keep-alive含include白名单仅缓存需要保持状态的页面; 5: keep-alive加activated/deactivated钩子处理缓存页面的重新激活逻辑"
type = "likert"
points = 5
weight = 1.0
score = 4
rationale = "App.vue中用keep-alive包裹component :is替代v-if，通过viewMap和computed动态切换当前组件，表单状态在切换时保持不丢失"

[[criterion]]
name = "侧边栏折叠样式修复"
description = "[Explicit] 是否修复侧边栏收起时NaiveUI菜单图标和文字重叠的问题。1: 折叠后图标和文字仍重叠; 2: 文字隐藏但图标位置偏移或过渡动画缺失; 3: 折叠时文字正确隐藏图标居中但动画不流畅; 4: NMenu的collapsed属性绑定正确且CSS过渡平滑无闪烁; 5: 折叠动画加tooltip在折叠态显示菜单名称加展开过渡"
type = "likert"
points = 5
weight = 1.0
score = 2
rationale = "NaiveUI NMenu组件设置collapsed属性绑定到ref，但折叠时CSS过渡效果缺失，NMenu的collapsed-width和collapsed-icon-size未配置导致图标和文字的布局切换不流畅出现短暂重叠"

[[criterion]]
name = "刷新后菜单选中持久化"
description = "[Explicit] 是否修复刷新页面后当前选中的菜单项丢失默认回到Dashboard的问题。1: 刷新后仍默认显示Dashboard选中项丢失; 2: 用sessionStorage但存取时机不对; 3: localStorage或sessionStorage保存当前菜单key但页面加载时恢复不完整; 4: watch监听activeMenu变化时存入localStorage且onMounted时读取恢复选中状态和对应页面; 5: 持久化加URL hash同步加浏览器前进后退支持"
type = "likert"
points = 5
weight = 1.0
score = 2
rationale = "App.vue中菜单选中状态仅保存在内存ref中，刷新页面后ref重置为默认值Dashboard，未使用localStorage或sessionStorage做持久化，用户刷新后不知道之前在哪个页面"

[[criterion]]
name = "动态组件类型安全"
description = "[Implicit] 是否为viewMap和currentView提供TypeScript类型定义确保组件映射类型安全。1: viewMap使用any或Record<string, any>; 2: 有类型但组件类型不精确; 3: Record<string, Component>基本类型定义; 4: 精确的联合类型key加DefineComponent值类型; 5: 类型定义加shallowRef优化加动态导入lazy loading"
type = "likert"
points = 5
weight = 1.0
score = 3
rationale = "viewMap定义为Record结构映射菜单key到组件，但key类型使用string而非联合类型字面量组件值类型不够精确"

[[criterion]]
name = "构建验证通过"
description = "[Implicit] 是否确保所有修改后TypeScript类型检查和Vite构建均通过无错误。1: 存在未解决的类型错误或构建失败; 2: 类型检查通过但构建有警告; 3: 构建通过但有非关键警告未处理; 4: tsc --noEmit和vite build都通过无错误无警告; 5: 构建通过加生产模式bundle分析加性能基准"
type = "likert"
points = 5
weight = 1.0
score = 4
rationale = "vite build构建通过无错误，最终确认所有文件修改后项目可正常构建"
