description = "批推理场景下的显存清理策略设计是否合理,清理时机和层级是否恰当。1:未处理批推理清理;2:清理逻辑存在但时机或层级有误;3:在外层添加清理可用但架构冗余;4:清理逻辑层级合理,单次推理内部完成清理;5:清理策略最优,兼顾性能和显存回收效率"
type = "likert"
points = 5
weight = 1.0
score = 4
rationale = "在generate内部完成清理，batch自然受益，架构更合理"

[[criterion]]
