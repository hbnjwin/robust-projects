[[criterion]]
name = "gpu_memory_leak_root_cause_analysis"
description = "显存泄漏根因定位能力,能否准确识别导致GPU显存无法释放的核心原因。1:完全未定位到泄漏点;2:发现表面问题但根因错误;3:找到部分泄漏原因但遗漏关键根因;4:定位到主要泄漏原因并给出合理解释;5:精准定位所有泄漏根因(如view引用链/缓存未清理等)并给出完整分析"
type = "likert"
points = 5
weight = 1.0
score = 5
rationale = "精准定位outputs[0]是view，持有整个outputs张量引用导致底层显存无法释放"

[[criterion]]
name = "cuda_memory_management_understanding"
description = "对CUDA内存管理机制的理解深度,包括PyTorch CUDA分配器缓存、张量引用计数、显式释放等。1:不了解CUDA内存机制;2:仅知道基本API但理解有误;3:了解empty_cache等基本操作但理解较浅;4:理解分配器缓存机制和引用链原理;5:深入理解CUDA内存生命周期并能据此设计最优释放策略"
type = "likert"
points = 5
weight = 1.0
score = 4
rationale = "理解CUDA分配器缓存机制和view引用链，修复有理论依据"

[[criterion]]
name = "fix_precision_and_scope"
description = "修复方案的精准度与改动范围是否合理,是否聚焦于泄漏问题本身。1:修改无效或引入新问题;2:修复有效但混入大量无关改动;3:大部分修改相关但仍有冗余;4:修改精准，全部针对泄漏问题;5:修改最小化且每处都精确对应一个泄漏根因"
type = "likert"
points = 5
weight = 1.0
score = 4
rationale = "精确3处修改全部针对泄漏根因，无多余改动"

