[[criterion]]
name = "Order和Trade类型注解"
description = "[Explicit] 是否给core/oms.py的Order和Trade dataclass加完整字段类型注解，包括Optional和Enum。1: 未修改oms.py；2: 仅添加了部分字段类型；3: 大部分字段有类型但缺少Optional标注；4: 全部字段完整类型注解，包含Optional和Enum，添加了from __future__ import annotations；5: 额外为to_dict等方法添加了返回值类型。"
type = "likert"
points = 5
weight = 1.0
score = 3
rationale = "给Order和Trade的大部分字段添加了类型注解，添加了from __future__ import annotations，但raw_signal等复杂字段仅标注为dict未给出泛型参数。"

