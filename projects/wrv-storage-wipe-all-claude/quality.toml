[[criterion]]
name = "根因定位"
description = "[Explicit] 准确定位退出登录后表格列配置丢失的根本原因：signOut和oauth2.remove()中两次localStorage.clear()清除了pinia持久化数据。1: 未定位；2: 只发现配置丢失但不知原因；3: 找到localStorage.clear()但未分析调用链；4: 完整定位两处localStorage.clear()及其对pinia persist的影响；5: 定位根因并分析了oauth2.remove()和signOut的职责边界问题"
type = "likert"
points = 5
weight = 1.0
score = 4
rationale = "3次Read直接读取nav-bar/index.vue、oauth2.js和table.js三个关键文件，快速定位signOut调用oauth2.remove()内含localStorage.clear()加上signOut自身又调一次localStorage.clear()的双重清除问题"

[[criterion]]
name = "清除策略修复"
description = "[Explicit] 将localStorage.clear()全量清除改为精确清除认证相关数据，保护pinia持久化的业务数据。1: 未修复；2: 只删一处clear；3: 删了两处但替代方案不完善；4: 两处都正确修改为只清除认证相关key；5: 精确清除且考虑了其他store的安全性"
type = "likert"
points = 5
weight = 1.0
score = 4
rationale = "oauth2.remove()中移除了localStorage.clear()只保留Cookies.remove(KEY)清除认证cookie，signOut中将全量clear改为removeItem('userinfo')精确清除，保护了table store持久化数据"

[[criterion]]
name = "pinia持久化保护"
description = "[Implicit] 修复后useTableStore的persist:true持久化数据在退出登录后是否完整保留。1: 仍被清除；2: 部分保留；3: 保留但有竞态风险；4: 完整保留且退出-重新登录后配置恢复；5: 完整保留并验证了多store共存的安全性"
type = "likert"
points = 5
weight = 1.0
score = 4
rationale = "修复后localStorage.clear()不再被调用，useTableStore的persist数据安全保留，通过Read读取table.js确认了其使用persist:true配置"

[[criterion]]
name = "重复清除消除"
description = "[Explicit] 消除oauth2.remove()和signOut中对localStorage.clear()的重复调用。1: 两处都保留；2: 只消除一处；3: 消除了但引入新的重复；4: 完全消除重复调用，职责清晰；5: 消除重复且重构了退出流程的调用层次"
type = "likert"
points = 5
weight = 1.0
score = 4
rationale = "oauth2.remove()只负责清除cookie，signOut负责清除特定localStorage key，职责分离清晰，完全消除了重复的全量清除"

