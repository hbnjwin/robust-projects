[[criterion]]
name = "引用计数机制"
description = "[Explicit] WebSocket单例的引用计数实现，多组件共享连接时只在最后一个组件断开时才真正关闭。1:未实现;2:简单计数但无减少逻辑;3:增减计数但边界条件有问题;4:完整refCount增减+归零断开;5:引用计数+WeakRef+自动清理"
type = "likert"
points = 5
weight = 1.0
score = 3
rationale = "websocket-manager.js中添加refCount属性，connect()递增，新增release()方法递减并在归零时断开，但release()方法命名与原有disconnect()不一致需要调用方配合修改"

[[criterion]]
name = "监听器清理"
description = "[Explicit] 组件卸载时正确移除WebSocket事件监听器，避免匿名函数无法off的问题。1:未处理;2:调了off但匿名函数匹配不上;3:具名函数但部分遗漏;4:所有监听器都用具名函数+完整off;5:具名+自动清理注册表"
type = "likert"
points = 5
weight = 1.0
score = 3
rationale = "将ai-report-review/index.vue和task-progress/index.vue中的监听器改为具名函数，但部分事件处理函数的提取不够彻底"

[[criterion]]
name = "心跳管理"
description = "[Explicit] 引用计数归零时心跳定时器的停止和重连逻辑的清理。1:未处理心跳;2:断开但心跳继续;3:停止心跳但重连定时器残留;4:心跳+重连+所有定时器全部清理;5:清理+状态机+优雅关闭"
type = "likert"
points = 5
weight = 1.0
score = 2
rationale = "release()归零后调用原有disconnect逻辑关闭连接，但未显式处理heartbeat定时器的清理，依赖disconnect内部实现"

[[criterion]]
