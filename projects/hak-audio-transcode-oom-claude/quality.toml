[[criterion]]
name = "动态行高计算"
description = "[Explicit] 虚拟滚动组件需根据每行实际高度动态计算而非固定行高。1:固定行高未修改;2:尝试动态但计算错误;3:动态计算基本正确但缓存机制有问题;4:动态计算+缓存+ResizeObserver;5:完整方案含骨架屏和平滑过渡"
type = "likert"
points = 5
weight = 1.0
score = 4
rationale = "ReportList.vue使用DynamicScroller替代RecycleScroller，自动测量每个item的实际高度，内部维护高度缓存，ReportItem.vue提供min-height保证初始估算不会太离谱"

[[criterion]]
name = "筛选后缓存重置"
description = "[Explicit] 筛选条件变化后虚拟滚动的高度缓存和滚动位置需完全重置。1:未处理筛选;2:重置了数据但缓存残留;3:缓存重置但滚动位置未归零;4:缓存+滚动位置都重置;5:完整重置+过渡动画无闪烁"
type = "likert"
points = 5
weight = 1.0
score = 4
rationale = "watch筛选条件变化时先清空数据列表（触发DynamicScroller内部缓存清空），nextTick后重新加载数据并scrollTo(0)，避免旧数据残影"

[[criterion]]
name = "快速滚动视觉优化"
description = "[Implicit] 快速滚动时消除行间白色间隙闪烁。1:明显白色闪烁;2:闪烁减少但仍可见;3:大部分消除偶有闪烁;4:基本无闪烁;5:完全无闪烁含骨架屏占位"
type = "likert"
points = 5
weight = 1.0
score = 3
rationale = "通过设置item-size为预估最小高度减少估算误差，但未实现骨架屏(skeleton)占位方案，快速滚动时偶尔仍有短暂闪烁"

[[criterion]]
name = "工程化质量"
description = "[Implicit] 测试覆盖和代码质量。1:无测试无类型;2:有TS类型但无测试;3:有基本测试;4:测试覆盖主要场景;5:完整测试+性能benchmark"
type = "likert"
points = 5
weight = 1.0
score = 2
rationale = "无测试文件，仅实现了组件代码，ReportItem.vue和ReportList.vue的TypeScript类型定义也不完整（部分props用any类型）"
