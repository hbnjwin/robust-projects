[[criterion]]
name = "策略匹配算法"
description = "[Explicit] 是否解读了ABAC策略引擎的策略匹配方式（贪婪匹配还是短路匹配）。1: 未分析匹配方式；2: 描述了匹配但未区分贪婪和短路；3: 识别了匹配方式但未分析其对性能的影响；4: 准确识别了匹配方式并分析了性能影响和安全影响；5: 匹配方式分析完整且对比了贪婪和短路两种策略的安全权衡"
type = "likert"
points = 5
weight = 1.0
score = 4
rationale = "在policy_engine.py分析中准确识别了evaluate方法遍历所有策略的贪婪匹配方式（非短路），指出了100+策略时每次请求需要O(n)遍历的性能开销，建议增加策略索引按resource_type预分组"

[[criterion]]
name = "冲突合并规则"
description = "[Explicit] 是否分析了多条策略命中时的冲突合并规则。1: 未分析冲突处理；2: 提到了冲突但未分析合并规则；3: 识别了deny-override或allow-override但未分析实现；4: 准确分析了合并规则的实现代码并举例说明；5: 合并规则分析完整且指出了当前规则可能导致的安全漏洞"
type = "likert"
points = 5
weight = 1.0
score = 5
rationale = "在evaluate方法分析中确认了deny-override合并规则：先收集所有匹配策略的结果，有任何DENY则最终DENY，全部ALLOW才放行。指出了一个安全漏洞：如果没有任何策略匹配（策略覆盖不全），默认结果是DENY而非报错，可能导致合法请求被静默拒绝且难以排查"

[[criterion]]
name = "跨部门越权根因"
description = "[Explicit] 是否准确定位了技术部主管策略被其他部门主管命中的根因。1: 未分析越权；2: 提到了越权但未定位代码；3: 定位到策略配置但根因分析不准确；4: 准确定位到属性匹配条件中department字段的匹配逻辑错误；5: 根因定位精确且给出了策略修复方案和回归测试建议"
type = "likert"
points = 5
weight = 1.0
score = 5
rationale = "在policy_engine.py的match_condition方法中定位到属性比较运算符配置错误——策略中department条件用的是IN运算符检查主管列表，但列表中只写了role='主管'没有限定department='技术部'，导致所有部门的主管都能通过策略匹配。创建了test_cross_department_escalation.py复现了该漏洞"

[[criterion]]
name = "属性条件运算符"
description = "[Explicit] 是否解读了策略条件中支持的比较运算符及其实现。1: 未分析运算符；2: 只列出了部分运算符；3: 列出了主要运算符但未分析实现；4: 完整列出运算符并分析了match_condition的实现逻辑；5: 运算符分析完整且指出了缺少的运算符类型和扩展方案"
type = "likert"
points = 5
weight = 1.0
score = 4
rationale = "在match_condition方法中解读了运算符的if-elif dispatch实现，列出了eq/ne/in/not_in/contains/gt/gte/lt/lte/regex共10种运算符，指出了缺少range（范围）和time_between（时间区间）运算符用于环境属性条件"

[[criterion]]
name = "策略数量性能影响"
description = "[Implicit] 是否评估了策略数量增长对判定延迟的影响并给出优化建议。1: 未评估性能；2: 提到了性能但未量化；3: 给出了O(n)复杂度分析但未提供优化方案；4: 分析了性能瓶颈并建议索引或缓存优化；5: 性能评估完整含基准测试建议和缓存失效策略"
type = "likert"
points = 5
weight = 1.0
score = 4
rationale = "分析了当前O(n)遍历在策略数达到1000条时每次判定约需50ms（基于JSON条件解析和匹配计算），建议按resource_type建立策略索引将匹配范围缩小到相关策略子集，同时用LRU缓存热点用户的判定结果"
