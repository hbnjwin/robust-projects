[[criterion]]
name = "根因定位"
description = "[Explicit] 准确定位debounce包装后this丢失和参数变undefined的原因：wrapper内部直接调用func()未用apply/call转发执行上下文和参数。1: 未定位；2: 只看到报错但不知原因；3: 找到func()但未分析apply/call的必要性；4: 准确定位func()调用缺少apply(this, arguments)导致上下文和参数丢失；5: 定位根因并分析了JavaScript严格模式下this绑定规则"
type = "likert"
points = 5
weight = 1.0
score = 3
rationale = "1次Read读取common-function.js，直接定位debounce函数第62-76行wrapper内部func()调用未用apply转发this和arguments"

[[criterion]]
