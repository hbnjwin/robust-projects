[[criterion]]
name = "hash变化处理"
description = "[Explicit] Dialog组件触发路由hash变化导致菜单高亮丢失的修复。1:未修复;2:禁用hash变化;3:过滤hash变化事件;4:监听hash忽略非路由级变化;5:完整路由变化分级处理策略"
type = "likert"
points = 5
weight = 1.0
score = 4
rationale = "在路由watch中区分path级变化和hash级变化，仅在path变化时更新菜单active状态"

[[criterion]]
name = "前进后退同步"
description = "[Explicit] 浏览器前进后退按钮操作时菜单高亮的同步更新。1:未处理;2:popstate但不稳定;3:watch route.path更新;4:watch+nextTick确保DOM同步;5:完整历史导航+过渡动画"
type = "likert"
points = 5
weight = 1.0
score = 4
rationale = "watch route.path使用immediate:true确保首次加载和前进后退都正确更新active状态"

[[criterion]]
name = "弹窗兼容"
description = "[Explicit] 弹窗操作不影响菜单高亮状态的隔离性。1:弹窗仍影响;2:部分隔离;3:弹窗期间冻结active;4:基于路由path而非fullPath判断active;5:完整的UI状态隔离策略"
