type = "likert"
points = 5
weight = 1.0
score = 4
rationale = "修复后的请求拦截器在token为undefined或空时跳过Authorization头设置，未登录用户发出的API请求不携带认证信息，后端根据缺少token正确响应401 Unauthorized"

