[[criterion]]
name = "根因定位"
description = "[Explicit] 准确定位Bearer undefined的根本原因：getOauth()解析cookie失败返回空字符串，getAccessToken()取空字符串的access_token属性得到undefined。1: 未定位；2: 只看到Bearer拼接问题；3: 找到拦截器但未追溯getOauth；4: 完整追溯cookie解析→getAccessToken→拦截器的调用链；5: 完整追溯并分析了所有相关的认证状态"
type = "likert"
points = 5
weight = 1.0
score = 4
rationale = "通过Read读取app-request.js第17-26行请求拦截器和oauth2.js的getOauth()方法，准确追溯到getOauth()在cookie不存在时catch返回空字符串''，''.access_token为undefined，拼接后变成'Bearer undefined'，服务端视为格式合法但无效的token返回400"

[[criterion]]
name = "token空值防护"
description = "[Explicit] 在拼接Authorization头之前检查token是否有效，无效时不添加该头。1: 仍无条件拼接；2: 检查了但判断条件不全面；3: if(token)判断但未处理空字符串；4: 完整判断token存在且非空后才添加Authorization头；5: 判断有效性加token格式校验"
type = "likert"
points = 5
weight = 1.0
score = 4
rationale = "app-request.js第17-26行重构请求拦截器：先调用getAccessToken()取值，用if(token)判断非null/undefined/空字符串后才设置config.headers.Authorization = 'Bearer ' + token，无效token时完全不添加该头"

