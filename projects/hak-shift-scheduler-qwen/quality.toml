[[criterion]]
name = "话务量预测转化"
description = "[Explicit] 是否分析了历史话务量预测模型如何转化为各时段的人力需求。1: 未分析预测模型；2: 提到了预测但未说明转化方式；3: 描述了基于历史数据的预测但转化公式不明确；4: 分析了预测值除以人均处理能力得出人力需求的转化公式；5: 转化分析完整且考虑了技能匹配和服务水平目标(SLA)的影响"
type = "likert"
points = 5
weight = 1.0
score = 3
rationale = "描述了基于历史话务量的时间序列预测和每个时段除以人均处理量得到最低人数的转化逻辑，但对服务水平目标（如80%的来电在20秒内接听）对人力需求的放大系数未分析"

[[criterion]]
name = "约束条件编码方式"
description = "[Explicit] 是否分析了劳动法合规约束（连续工作天数、班次间隔等）的编码和检查机制。1: 未分析约束编码；2: 列出了约束但未分析编码方式；3: 分析了部分约束的检查逻辑但不全面；4: 分析了硬约束和软约束的区分及检查机制；5: 约束编码分析完整且解释了约束违反时的优先级处理"
type = "likert"
points = 5
weight = 1.0
score = 2
rationale = "列出了各项约束条件但对这些约束在scheduler.py中的具体编码方式（是用布尔函数检查还是约束满足求解器CSP）分析不足"

[[criterion]]
name = "求解算法分析"
description = "[Explicit] 是否分析了排班算法的求解策略（贪心还是回溯还是整数规划）。1: 未分析求解策略；2: 提到了算法类型但未分析实现；3: 正确识别了算法类型但未分析其优劣；4: 分析了算法的实现逻辑和时间复杂度；5: 对比了当前算法与其他方案（如CP-SAT）的适用性"
type = "likert"
points = 5
weight = 1.0
score = 3
rationale = "识别了当前使用贪心算法（按时段优先级依次分配最合适的空闲员工）的求解方式，但对贪心策略无法保证全局最优的局限性分析不够深入"

[[criterion]]
name = "排班错误根因"
description = "[Explicit] 是否准确定位了连上7天班和实习生独立夜班两个排班错误的根因。1: 未分析错误；2: 只分析了一个；3: 两个都分析了但根因不准确；4: 两个错误根因分析准确；5: 根因分析精确且给出了修复方案和回归测试建议"
type = "likert"
points = 5
weight = 1.0
score = 2
rationale = "分析了连续7天班的可能原因是约束检查的时间窗口计算有误（只看前5天不包含当天），但对实习生独立夜班的根因分析缺失"

[[criterion]]
name = "排班结果评估"
description = "[Implicit] 是否对排班结果的公平性和覆盖率进行了评估。1: 未评估结果；2: 只看了是否满足约束；3: 分析了约束满足率但未评估公平性；4: 分析了员工工时均衡性和时段覆盖率；5: 评估完整含公平性指标、满意度预测和改进建议"
type = "likert"
points = 5
weight = 1.0
score = 2
rationale = "只检查了排班是否满足约束条件，未对员工之间的工时分配公平性和高峰时段的覆盖率做量化评估"
