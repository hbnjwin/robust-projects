[[criterion]]
name = "权限注解根因定位"
description = "[Explicit] 是否准确定位权限注解不生效的根因（如@EnableGlobalMethodSecurity缺失、PermissionEvaluator未注册、@Service导入错误等）。1: 未尝试排查或完全误判根因；2: 找到部分相关代码但根因判断错误；3: 正确识别根因但定位过程有路径错误或冗余重试；4: 准确定位根因且过程较高效；5: 精准定位根因，零错误零冗余，代码证据充分"
type = "likert"
points = 5
weight = 1.0
score = 5
rationale = "精准Read 3个文件即定位PermissionEvaluator未注册和注解配置缺失，零错误零冗余"

[[criterion]]
name = "权限注解修复正确性"
description = "[Explicit] 权限注解不生效问题的修复是否正确完整（注解生效、PermissionEvaluator正确注册、Spring Security配置链路完整）。1: 未修复或修复方向错误；2: 部分修复但关键链路断裂；3: 修复了主要问题但方案不完整或有副作用；4: 修复正确且链路完整；5: 修复精准完整，@PreAuthorize→PermissionEvaluator→RbacService链路全部打通，零副作用"
type = "likert"
points = 5
weight = 1.0
score = 5
rationale = "创建SecurityConfig注册PermissionEvaluator，@PreAuthorize→PermissionEvaluator→RbacService链路完整打通，精准最小改动"

[[criterion]]
name = "角色继承层级分析"
description = "[Explicit] 是否准确分析角色继承关系错乱的原因（子角色权限大于父角色），并理解继承链的正确语义（子角色应继承父角色所有权限）。1: 未分析继承关系；2: 仅发现问题但未理解继承语义；3: 理解继承语义但分析过程冗长或有偏差；4: 正确分析继承链并理解递归继承需求；5: 深入分析继承链，识别递归继承缺陷，额外考虑循环继承等边界情况"
type = "likert"
points = 5
weight = 1.0
score = 5
rationale = "快速识别递归继承缺陷，额外考虑循环继承防护（visited集合），理解深度优秀"

[[criterion]]
name = "角色继承修复正确性"
description = "[Explicit] 角色继承关系修复是否正确——子角色权限应沿层级向上递归继承父角色权限，且不会出现子角色权限大于父角色的情况。1: 未修复或逻辑错误；2: 修复了但继承方向或递归逻辑有误；3: 递归继承实现正确但缺少边界保护（如循环继承）；4: 递归继承正确且有基本边界保护；5: 递归继承正确，包含循环检测、visited集合等完整边界保护"
type = "likert"
points = 5
weight = 1.0
score = 5
rationale = "正确实现递归继承+循环检测visited集合，覆盖边界场景"

[[criterion]]
name = "缓存一致性实现"
description = "[Explicit] 权限缓存一致性处理是否完整——需要实现权限数据缓存并在权限/角色变更时保证缓存与数据库一致。1: 未实现缓存；2: 有缓存但无失效机制；3: 有缓存和失效机制但未验证可用性或框架选型简陋；4: 缓存实现完整，失效机制合理，基本可用；5: 缓存框架成熟（如Caffeine/Redis），多级粒度失效（角色/用户/全局），线程安全，经过验证"
type = "likert"
points = 5
weight = 1.0
score = 3
rationale = "ConcurrentHashMap简单实现缓存，线程安全有保障，但非完整缓存框架，缺少TTL和容量控制"

