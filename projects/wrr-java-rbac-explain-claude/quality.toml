[[criterion]]
name = "instruction_compliance_and_constraint_adherence"
description = "How well does the model follow multiple constraints and maintain them throughout? 1: completely ignores complex constraints, outputs according to own defaults, enters dead loops or argues during manual correction, severely damages original structure; 2: after 2 corrections, still cannot satisfy multiple constraints simultaneously (fixes one but forgets another), final output does not meet requirements; 3: initial output ignores key constraints (e.g., modifies files it should not), can barely adjust to meet all constraints after 2 explicit warnings; 4: initial output misses 1-2 non-core constraints (e.g., variable naming), corrects all immediately after 1 user prompt; 5: perfectly adheres to all multiple constraints, never breaks prior requirements during fixes, additions, or debugging, does not forget restrictions or expand scope arbitrarily"
type = "likert"
points = 5
weight = 1.0
score = 5
rationale = "仅修改2个核心文件，精准最小改动，未超出任务边界"

[[criterion]]
