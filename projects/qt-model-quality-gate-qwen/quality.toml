[[criterion]]
name = "质量门指标验证"
description = "[Explicit] 是否在ModelQualityGate中实现IC大于0.02、ICIR大于0.5、时间衰减检测和特征集中度检测四项验证。1:未创建质量门;2:仅实现1到2项检查;3:实现3项检查;4:四项检查均实现且阈值可配置;5:四项检查含统计显著性测试和自适应阈值"
type = "likert"
points = 5
weight = 1.0
score = 3
rationale = "evaluator.py中创建了ModelQualityGate类实现IC>0.02和ICIR>0.5两项指标验证，时间衰减使用线性回归斜率检测，但特征集中度检查的top1占比阈值未严格实现"

[[criterion]]
name = "未来数据检测"
description = "[Explicit] 是否实现了未来数据泄露检测通过检查训练窗口边界验证特征矩阵不含未来信息。1:未实现泄露检测;2:仅文档提及未提供实现;3:基本的时间戳检查;4:检查特征矩阵中t日特征是否包含t+1数据并输出违规详情;5:泄露检测含自相关分析和前瞻性特征识别"
type = "likert"
points = 5
weight = 1.0
score = 3
rationale = "evaluator.py中实现了基本的训练窗口边界检查，验证特征矩阵的日期范围不超出训练截止日，但未做细粒度的逐特征检测"

[[criterion]]
name = "模型卡片生成"
description = "[Explicit] 是否在质量门通过后生成model_card.json记录训练日期、数据范围、检查项结果和评估指标。1:未生成模型卡片;2:生成了但字段不完整;3:model_card.json含训练日期和指标;4:完整model_card含训练日期、数据范围、全部检查项结果和指标;5:模型卡片含版本号和可追溯的实验ID"
type = "likert"
points = 5
weight = 1.0
score = 3
rationale = "evaluator.py中在质量门通过后生成model_card.json，包含训练日期和IC/ICIR指标，但检查项的逐条pass/fail结果记录不够详细"

[[criterion]]
name = "部署阻断机制"
description = "[Explicit] 是否在质量门失败时阻止模型文件保存并输出详细的失败原因报告。1:失败时仍保存模型;2:失败时warning但不阻止;3:失败时抛出异常阻止保存;4:阻止保存并输出每项检查的失败原因;5:阻断含失败模型归档和人工审批流程"
type = "likert"
points = 5
weight = 1.0
score = 3
rationale = "evaluator.py中质量门失败时通过raise ValueError阻止后续的模型保存流程，输出了失败原因但格式较简略"

[[criterion]]
name = "训练流程集成"
description = "[Implicit] 是否将ModelQualityGate正确集成到现有的训练流程中在模型保存前自动执行检查。1:质量门独立未集成;2:集成但调用位置不正确;3:在trainer.py的模型保存前调用质量门;4:在trainer.py和ml_model_retrain.py中均在保存前调用;5:质量门集成含配置开关和跳过选项"
type = "likert"
points = 5
weight = 1.0
score = 3
rationale = "evaluator.py和trainer.py中集成了ModelQualityGate调用，但ml_model_retrain.py中的集成仅为import声明未在实际保存路径前调用check方法"
