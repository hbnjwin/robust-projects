[[criterion]]
name = "累计预扣预缴算法"
description = "[Explicit] 是否完整解读了个税累计预扣预缴的计算公式和预扣税率表。1: 未分析累计预扣；2: 只描述了公式但未解释累计的含义；3: 公式正确但税率表跳档的影响未分析；4: 完整解读了累计应纳税所得额×税率-速算扣除数-累计已预扣的公式和7级税率表；5: 算法分析完整且用具体月薪示例演示了逐月累计的税率跳档过程"
type = "likert"
points = 5
weight = 1.0
score = 5
rationale = "完整解读了累计预扣预缴公式并用月薪3万的示例演示了1-12月的逐月计算过程——1月累计36000-60000在第一档3%预扣900元，到第X月累计超过36000进入第二档10%时税率跳档，当月应扣税额明显增加"

[[criterion]]
name = "专项附加扣除处理"
description = "[Explicit] 是否分析了七项专项附加扣除的分月处理逻辑。1: 未分析附加扣除；2: 列出了扣除项但未分析分月逻辑；3: 分析了部分扣除项但大病医疗的年度汇算特殊处理遗漏；4: 分析了六项按月扣除和大病医疗按年汇算的差异；5: 附加扣除分析完整含扣除金额标准和适用条件校验"
type = "likert"
points = 5
weight = 1.0
score = 4
rationale = "在get_deductions方法中分析了七项附加扣除的处理逻辑——前六项按月定额扣除累加到monthly_deductions，大病医疗单独标记deduction_type='annual'不参与月度预扣只在年度汇算calculate_annual方法中扣除"

[[criterion]]
name = "年终奖计税方式选择"
description = "[Explicit] 是否分析了年终奖单独计税和并入综合所得两种方式的比较逻辑。1: 未分析年终奖；2: 只描述了一种方式；3: 描述了两种方式但最优选择逻辑不清楚；4: 分析了两种方式的税额计算和自动选择最优的比较逻辑；5: 分析完整且指出了年终奖断档陷阱的检测"
type = "likert"
points = 5
weight = 1.0
score = 4
rationale = "在calculate_bonus_tax方法中分析了两种方式的计算——单独计税（年终奖÷12找月度税率表适用税率）和并入综合（年终奖加入annual_income重新按年度税率表计算），比较两者税额取较低者"

[[criterion]]
name = "累进税率跳档bug根因"
description = "[Explicit] 是否定位了1月和2月个税一样多的根因——累进效果未体现。1: 未分析该bug；2: 提到了bug但未定位代码；3: 分析了可能原因但不精确；4: 准确定位到使用monthly_taxable而非cumulative_taxable的代码错误；5: 定位精确且用具体数值还原了错误计算过程"
type = "likert"
points = 5
weight = 1.0
score = 5
rationale = "精确定位了bug在calculate_cumulative_tax方法中用monthly_taxable替代了cumulative_taxable查税率表——月薪3万两个月累计应纳税所得约5.2万应在第二档10%，但代码用月度2.6万找到第一档3%，两个月税额相同（均为780元）而非第二月应为2600元"

[[criterion]]
name = "年终奖断档陷阱"
description = "[Explicit] 是否分析了年终奖在临界点多发1元导致到手少几千元的断档问题。1: 未分析断档；2: 提到了断档概念但未具体分析；3: 列出了断档临界点但未分析系统是否有检测；4: 分析了断档临界点和系统缺少断档检测的问题；5: 断档分析完整含所有6个临界点和自动避税建议方案"
type = "likert"
points = 5
weight = 1.0
score = 4
rationale = "分析了年终奖的6个断档临界点（36000/144000/300000/420000/660000/960000），以36001为例——36000按3%税1080元到手34920元，36001按10%税3390.1元到手32610.9元，多发1元少到手2309.1元。指出了calculate_bonus_tax方法缺少断档检测，建议增加proximity_warning当年终奖接近临界点时提醒HR"
