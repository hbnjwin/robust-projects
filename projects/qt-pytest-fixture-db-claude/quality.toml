[[criterion]]
name = "conftest与db_connection fixture设计"
description = "[Explicit] 是否创建conftest.py并提供可复用的db_connection session-scoped fixture，通过环境变量控制PG连接参数。1: 未创建conftest.py；2: 创建了conftest但fixture缺少环境变量参数化；3: fixture读取环境变量但scope或teardown处理不当；4: fixture完整实现环境变量读取、session-scope、连接失败自动skip；5: fixture额外处理了连接池复用和fixture间依赖注入。"
type = "likert"
points = 5
weight = 1.0
score = 4
rationale = "conftest.py中db_connection使用session-scope，从PG_HOST/PG_USER/PG_PASSWORD/PG_DBNAME/PG_PORT环境变量读取参数，psycopg未安装或连接失败时自动pytest.skip，实现完整。"

