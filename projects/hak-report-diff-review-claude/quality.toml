[[criterion]]
name = "中文字符级Diff精度"
description = "[Explicit] 中文diff标注需要达到单字级别精度，'桨'→'浆'只标一个字不标整词。1:整段标红;2:按词标红;3:按字标红但有误标;4:单字精度偶有边界问题;5:单字精度且正确处理标点和数字混排"
type = "likert"
points = 5
weight = 1.0
score = 4
rationale = "diff.ts用Myers diff算法逐字符对比，中文单字差异精确，英文按word boundary分词，数字连续字符作为整体token处理"

[[criterion]]
name = "表格结构保持"
description = "[Explicit] diff不能打散表格结构，差异应在表格单元格内标注。1:表格被打散为文本碎片;2:表格结构部分保留;3:表格结构保留但跨行合并单元格有问题;4:表格结构完整保留差异在单元格内标注;5:完整保留含合并单元格和嵌套表格"
type = "likert"
points = 5
weight = 1.0
score = 4
rationale = "DiffViewer.vue中将表格作为结构化对象对比（而非拆成文本），单元格级别标注差异，但对嵌套表格（表格内嵌表格）的递归diff未实现"

[[criterion]]
name = "差异跳转定位"
description = "[Explicit] 点击上/下箭头跳转差异位置时scrollIntoView需考虑fixed header偏移。1:跳转不工作;2:能跳转但被header遮挡;3:跳转正确但动画卡顿;4:跳转正确含smooth scroll;5:跳转精确+键盘快捷键+当前差异高亮指示"
type = "likert"
points = 5
weight = 1.0
score = 5
rationale = "useDiffNavigator.ts实现了完整的导航逻辑：scrollIntoView配合scrollMarginTop:80px避开header，N/P快捷键切换，当前差异项border高亮标识"

[[criterion]]
name = "接受拒绝状态更新"
description = "[Explicit] 点击接受/拒绝按钮后差异项视觉状态需更新（变灰/消失）。1:点击无反应;2:状态更新但视觉无变化;3:视觉更新但数据未同步;4:视觉+数据同步更新;5:完整的状态管理含撤销和批量操作"
type = "likert"
points = 5
weight = 1.0
score = 4
rationale = "DiffViewer.vue中接受/拒绝操作后通过v-bind:class动态切换样式（accepted类添加opacity:0.4和删除线），同时更新统计计数（已处理X/共Y处）"

[[criterion]]
name = "大文档性能"
description = "[Implicit] 200页+大报告的diff计算和渲染性能。1:大文档直接卡死;2:diff计算超过10秒;3:diff计算可接受但渲染卡顿;4:虚拟滚动优化基本流畅;5:虚拟滚动+增量diff+Web Worker"
type = "likert"
points = 5
weight = 1.0
score = 4
rationale = "diff计算可在Web Worker中执行（虽然当前实现仍在主线程），渲染使用了虚拟滚动RecycleScroller只显示可见区域的diff结果"
