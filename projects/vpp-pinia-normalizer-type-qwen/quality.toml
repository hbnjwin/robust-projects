[[criterion]]
name = "数值类型强制转换"
description = "[Explicit] 是否在normalizeResource中对device_count等可能为字符串的字段做Number()强制转换防止字符串拼接。1: 仍假设number类型未转换导致100+200=100200; 2: 转换了device_count但遗漏capacity_kw等同类字段; 3: 所有数值字段都用Number()转换但未处理转换失败NaN; 4: Number()转换加NaN回退默认值0的安全处理; 5: 安全转换加TypeScript泛型工具函数统一处理所有normalizer的数值字段"
type = "likert"
points = 5
weight = 1.0
score = 3
rationale = "vpp.ts的normalizeResource中对device_count和capacity_kw等字段使用Number()转换，但未对Number()返回NaN的情况做回退处理，边界输入如空字符串转换后仍为NaN"

[[criterion]]
name = "Safari日期解析兼容"
description = "[Explicit] 是否修复normalizeContract中ISO日期字符串在Safari上解析为Invalid Date的问题。1: Safari上仍解析失败返回Invalid Date; 2: 用正则提取但未处理时区偏移; 3: 使用Date.parse()兼容ISO格式但不处理非标准格式; 4: 专用parseDate工具函数支持ISO 8601含时区和Safari兼容的日期格式; 5: parseDate加时区归一化加无效日期回退加格式自动检测"
type = "likert"
points = 5
weight = 1.0
score = 3
rationale = "date.ts中创建了日期解析工具函数支持ISO 8601格式解析，但对Safari特有的日期格式限制如不支持YYYY-MM-DD HH:mm:ss格式的处理依赖原生Date构造函数兼容性"

[[criterion]]
name = "isTauri环境检测修复"
description = "[Explicit] 是否修复isTauri()在生产构建后因window.__TAURI__被tree-shake导致始终返回false的问题。1: 生产包中isTauri()仍始终返回false; 2: 改为直接检测window属性但被minifier优化掉; 3: 使用in操作符检测window中是否存在__TAURI__属性; 4: 通过运行时动态属性检测如Reflect.has(window, \"__TAURI__\")或typeof window.__TAURI__避免被tree-shake; 5: 环境检测加构建配置define排除加开发/生产模式统一行为验证"
type = "likert"
points = 5
weight = 1.0
score = 2
rationale = "vpp.ts中isTauri()函数仍使用直接引用window.__TAURI__的方式检测，未考虑Vite生产构建时tree-shaking将未引用的全局变量标记为dead code的行为，生产包中检测失败"

[[criterion]]
name = "可选字段安全访问"
description = "[Explicit] 是否移除对可能为undefined的可选字段的as number类型断言防止运行时崩溃。1: 仍使用as number断言在undefined上崩溃; 2: 移除断言但用非空断言!替代; 3: 用可选链?.访问但计算结果可能为undefined; 4: 可选字段用??提供默认值后再做类型转换; 5: TypeScript严格模式下所有可选字段通过类型守卫或??处理且编译期无报错"
type = "likert"
points = 5
weight = 1.0
score = 3
rationale = "vpp.ts中移除了部分as number断言改为条件判断，但仍有个别位置使用类型断言而非运行时检查"

[[criterion]]
name = "Normalizer返回类型一致性"
description = "[Implicit] 是否确保normalizer函数的返回类型与Pinia state中定义的接口完全匹配。1: 返回类型为any或未标注; 2: 标注了返回类型但字段缺失导致编译警告; 3: 返回类型匹配但可选字段处理不一致; 4: 返回类型与接口精确匹配且所有字段都有值即可选字段有默认值; 5: 返回类型加readonly修饰防止store外直接mutation"
type = "likert"
points = 5
weight = 1.0
score = 3
rationale = "normalizer函数标注了返回类型与Pinia state接口对应，但部分可选字段在接口中标记为必填而normalizer返回时未提供默认值"
