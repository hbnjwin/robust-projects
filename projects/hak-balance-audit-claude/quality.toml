[[criterion]]
name = "流水链式校验机制"
description = "[Explicit] 是否解读了余额变动流水的链式校验规则（前一条的变动后余额等于后一条的变动前余额）。1: 未分析链式校验；2: 描述了流水记录但未分析链式校验；3: 分析了链式校验规则但中断检测机制不清楚；4: 完整分析了链式校验的实现和断链检测的定时对账方式；5: 链式校验分析完整且包含断链修复方案和审计日志"
type = "likert"
points = 5
weight = 1.0
score = 4
rationale = "分析了verify_chain方法的链式校验逻辑——按created_at排序取所有流水，逐条检查record[i].balance_before == record[i-1].balance_after，不等则标记为chain_broken并记录断链位置。对账任务每小时遍历所有活跃账户执行链式校验"

[[criterion]]
name = "并发余额变动竞态"
description = "[Explicit] 是否分析了并发充值和消费同时发生时两条流水变动前余额相同导致链式断裂的根因。1: 未分析并发问题；2: 提到了并发但未分析时序；3: 分析了竞态但未给出修复方案；4: 用时序图说明了两条流水同时读取相同快照的竞态过程；5: 并发分析完整且给出了SELECT FOR UPDATE或事务序列化等修复方案"
type = "likert"
points = 5
weight = 1.0
score = 5
rationale = "用具体时序分析了并发竞态：T1充值读balance=100→T2消费读balance=100→T1写balance_after=120→T2写balance_after=80→最终余额80而非100。根因是create_transaction方法读取和写入之间没有行级锁。给出了修复方案：SELECT balance FROM accounts WHERE user_id=? FOR UPDATE获取排他锁保证串行化"

[[criterion]]
name = "冻结余额处理"
description = "[Explicit] 是否分析了冻结操作只记录流水但未减少可用余额导致被冻结金额仍可消费的bug根因。1: 未分析冻结bug；2: 提到了冻结但未分析根因；3: 分析了冻结逻辑但根因不精确；4: 准确定位到冻结只写了流水但未更新accounts表可用余额的代码缺陷；5: 根因定位精确且给出了双余额（total_balance和available_balance）设计方案"
type = "likert"
points = 5
weight = 1.0
score = 5
rationale = "在freeze_balance方法中精确定位了bug——该方法INSERT了一条freeze类型的流水记录但只更新了frozen_amount字段（用于展示），没有从available_balance中扣除冻结金额。消费时check_balance方法检查的是available_balance而非available_balance-frozen_amount，导致冻结资金仍可消费。建议改为available_balance = total_balance - frozen_amount的双余额模型"

[[criterion]]
name = "对账重算一致性"
description = "[Explicit] 是否分析了定时对账任务从流水重算余额与current_balance比对的逻辑。1: 未分析对账；2: 描述了对账概念但未分析重算方式；3: 分析了重算逻辑但SUM和链式重算的差异未区分；4: 分析了SUM(amount)重算和逐条链式重算两种方式的区别；5: 对账分析完整且指出了两种方式在异常数据下的不同结果"
type = "likert"
points = 5
weight = 1.0
score = 4
rationale = "分析了对账的两步策略——第一步用SUM快速校验（SUM(all amounts)应等于current_balance），第二步对不一致的账户做逐条链式重算定位断链位置。指出了SUM方式在并发写入场景下可能因为读到中间状态而产生误报"

[[criterion]]
name = "审计日志防篡改"
description = "[Implicit] 是否分析了流水记录的防篡改机制（如哈希链或数字签名）。1: 未分析防篡改；2: 提到了需要防篡改但未分析实现；3: 分析了可能的方案但当前代码未实现；4: 分析了当前缺少防篡改机制的风险并给出了哈希链方案；5: 防篡改分析完整含HMAC签名方案和篡改检测审计"
type = "likert"
points = 5
weight = 1.0
score = 4
rationale = "分析了当前流水记录没有任何防篡改机制——直接存储在普通数据库表中，有数据库权限的人可以修改任意记录。建议增加record_hash字段存储每条记录的HMAC签名（key由KMS管理），签名内容包含前一条记录的hash形成哈希链，对账时校验完整性"
