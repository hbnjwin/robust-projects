[[criterion]]
name = "Teleport组件暗色适配"
description = "[Explicit] Element Plus弹窗类组件（MessageBox/Notification/DatePicker）在暗色模式下是否正确应用暗色样式。1:仍为亮色;2:部分组件适配;3:主色适配但细节颜色不对;4:通过html.dark类+Element暗色CSS变量完整适配;5:适配+自定义暗色配色+无缝切换。"
type = "likert"
points = 5
weight = 1.0
score = 4
rationale = "useTheme.ts通过document.documentElement.classList.toggle('dark')切换html元素的dark类。main.ts导入element-plus/theme-chalk/dark/css-vars.css激活官方暗色变量。dark-overrides.css中针对el-message-box、el-notification、el-date-picker的teleport容器补充了背景色、边框色、文字色等细节CSS变量覆盖，所有弹窗组件完整适配暗色。"

[[criterion]]
name = "ECharts图表主题联动"
description = "[Explicit] 暗色模式下ECharts图表的坐标轴文字、图例、背景色等是否跟随主题变化。1:图表颜色不变;2:背景变了但文字没变;3:手动设置颜色但硬编码;4:useChartTheme动态生成主题配置;5:动态主题+过渡动画+实时切换。"
type = "likert"
points = 5
weight = 1.0
score = 4
rationale = "useEChartsTheme.ts根据当前主题动态计算axisLabel.color、legend.textStyle.color、backgroundColor等配置。watch(isDark)变化时调用chart.setOption(themeOptions)更新图表颜色，无需销毁重建实例。ReportChart.vue通过useEChartsTheme获取响应式主题配置，option中通过computed合并主题色值，暗色下文字切换为浅色系。"

[[criterion]]
name = "已渲染组件主题刷新"
description = "[Explicit] 切换主题时已经渲染过的组件（如富文本编辑器工具栏）是否立即更新颜色。1:不更新需刷新页面;2:部分组件更新;3:CSS变量类组件更新但JS渲染类不更新;4:watch主题变化强制刷新非响应式组件;5:全部实时更新+过渡动画。"
type = "likert"
points = 5
weight = 1.0
score = 4
rationale = "useTheme.ts导出isDark响应式变量和onThemeChange回调注册函数。RichEditor.vue中watch(isDark)检测到主题变化后调用editor.setTheme(isDark ? 'dark' : 'light')更新编辑器内部主题。Dashboard.vue和其他包含非CSS变量控制颜色的组件均订阅isDark变化并执行对应的刷新逻辑。"

[[criterion]]
name = "切换过渡动画"
description = "[Explicit] 主题切换时是否有平滑的颜色过渡效果，避免突兀闪烁。1:瞬间切换有闪烁;2:部分元素有过渡;3:CSS transition但有闪白;4:全局transition+prefers-color-scheme预加载;5:View Transition API丝滑切换。"
type = "likert"
points = 5
weight = 1.0
score = 4
rationale = "variables.css中body和:root的background-color、color均设置transition: color 0.2s, background-color 0.2s。useTheme.ts在切换前先添加一个transition类到html元素，切换完成后移除，确保过渡期间所有CSS变量变化都有动画。配合prefers-color-scheme媒体查询在页面加载时预设主题，避免初始化闪烁。"

[[criterion]]
name = "CSS变量体系"
description = "[Implicit] 是否建立了系统化的CSS自定义属性体系来统一管理主题色。1:无CSS变量;2:少量变量;3:主要颜色变量化;4:完整的语义化CSS变量体系;5:变量+设计Token+自动生成。"
type = "likert"
points = 5
weight = 1.0
score = 4
rationale = "variables.css采用语义化命名体系：--color-bg-primary/secondary/tertiary、--color-text-primary/secondary/muted、--color-border-default/light等分层命名。:root定义亮色值，html.dark覆盖暗色值。所有组件样式通过var()引用CSS变量，消除硬编码色值，主题切换时自动生效。"

[[criterion]]
name = "主题持久化与初始化"
description = "[Implicit] 用户选择的主题偏好是否持久化保存，刷新后是否正确恢复。1:刷新后重置;2:localStorage存但有闪烁;3:持久化+prefers-color-scheme;4:持久化+预加载脚本消除闪烁;5:完整的主题系统含跟随系统选项。"
type = "likert"
points = 5
weight = 1.0
score = 4
rationale = "useTheme.ts使用localStorage持久化主题选择。index.html的<head>中添加内联<script>在DOM解析前读取localStorage并立即设置html.dark类，消除FOUC闪烁。支持'light'/'dark'/'system'三种模式，system模式跟随window.matchMedia('(prefers-color-scheme: dark)')并监听变化自动切换。"

[[criterion]]
name = "useTheme composable质量"
description = "[Implicit] useTheme composable的API设计、响应式集成和可扩展性。1:简单的class toggle;2:基本composable;3:isDark+toggle功能;4:isDark+toggle+onThemeChange+模式选择;5:完整的主题管理系统含插件机制。"
type = "likert"
points = 5
weight = 1.0
score = 4
rationale = "useTheme.ts导出isDark只读ref、themeMode('light'|'dark'|'system')、setTheme函数和onThemeChange回调注册。内部使用watchEffect自动同步document.documentElement.classList。ThemeSwitch.vue支持三态切换（亮色/暗色/跟随系统），图标根据当前模式动态展示。composable通过provide/inject在组件树中共享，避免多实例状态不同步。"

[[criterion]]
name = "第三方组件暗色适配"
description = "[Implicit] 除Element Plus外的第三方组件（富文本编辑器、图表库等）的暗色适配覆盖度。1:未处理;2:仅Element Plus;3:Element Plus+一个第三方;4:覆盖主要第三方组件;5:全部第三方+自定义组件统一暗色。"
type = "likert"
points = 5
weight = 1.0
score = 3
rationale = "dark-overrides.css覆盖了Element Plus全套暗色样式。useEChartsTheme.ts为ECharts提供动态主题配置。RichEditor.vue中watch(isDark)切换编辑器主题。但对于可能存在的其他第三方组件（如日期选择器的第三方增强、文件上传组件等）未做统一的暗色适配检查。"
