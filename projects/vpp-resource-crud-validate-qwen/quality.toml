[[criterion]]
name = "编辑模式数据回填"
description = "[Explicit] 是否修复编辑已有资源时表单弹窗不回填数据导致用户需重新输入的问题。1: 编辑弹窗打开后所有字段仍为空; 2: 部分字段回填但类型字段select未正确选中; 3: 基本字段回填正确但数值字段有类型转换问题; 4: 所有字段含NSelect下拉框正确回填且类型匹配不丢失精度; 5: 回填后表单dirty状态正确追踪且修改指示器显示哪些字段被改动"
type = "likert"
points = 5
weight = 1.0
score = 3
rationale = "ResourceModel.vue中编辑时通过Object.assign将已有资源数据赋值给formData响应式对象，基本字段回填正确但NSelect组件的value匹配依赖字符串精确相等，资源类型下拉框可能未正确选中"

[[criterion]]
name = "类型切换字段清除"
description = "[Explicit] 是否在资源类型从光伏切换到储能时清空不属于新类型的字段值防止提交脏数据。1: 切换类型后旧字段值仍保留并被提交; 2: 清除了部分字段但遗漏了某些类型特有字段; 3: watch监听类型变化时重置额外字段但有时序问题; 4: watch handler中根据新类型定义的字段集合重置所有不属于该类型的字段为null; 5: 类型切换加字段重置加用户确认提示防止误操作"
type = "likert"
points = 5
weight = 1.0
score = 2
rationale = "ResourceModel.vue中资源类型NSelect切换后未添加watch监听器来清空不属于新类型的条件字段，从光伏切到储能时装机容量字段的值被保留并随表单提交"

[[criterion]]
name = "额定功率正数校验"
description = "[Explicit] 是否对额定功率字段添加正数校验拒绝负数和零值输入。1: 无数值范围校验接受任意值包括负数; 2: 有NInputNumber的min属性但未阻止手动输入负数; 3: 自定义validator拒绝负数和零但错误提示不明确; 4: validator含正数检查加NInputNumber的min属性双重保护加明确错误提示; 5: 双重校验加合理上限限制加输入时实时反馈错误状态"
type = "likert"
points = 5
weight = 1.0
score = 3
rationale = "额定功率字段添加了自定义validator检查value大于0的条件，但仅依赖validator未设置NInputNumber组件的min属性做原生保护，手动输入负数时仅在提交时才报错"

[[criterion]]
name = "条件字段动态显隐"
description = "[Implicit] 是否根据资源类型正确控制额外字段（如充放电功率、电池容量、装机容量）的动态显示和隐藏。1: 所有类型显示相同字段; 2: v-if条件判断但字段配置硬编码且不完整; 3: 根据类型显示对应额外字段但切换时有闪烁; 4: 通过computed或map配置根据当前类型动态渲染对应的表单字段组; 5: 动态字段加过渡动画加字段说明提示加类型间字段差异可视化"
type = "likert"
points = 5
weight = 1.0
score = 3
rationale = "ResourceModel.vue中通过v-if根据resourceType判断显示不同的额外字段，但字段与类型的映射关系硬编码在模板中而非通过配置驱动，新增类型时需改模板"

[[criterion]]
name = "表单提交数据完整性"
description = "[Implicit] 是否确保表单提交的数据仅包含当前类型的有效字段且格式正确。1: 提交数据包含其他类型的字段值; 2: 字段过滤了但数值类型转换有问题; 3: 提交前过滤无关字段但对数值精度处理不完整; 4: handleSubmit中根据当前类型筛选有效字段组装提交数据且数值字段类型正确; 5: 数据组装加字段校验加提交前二次确认加提交后表单重置"
type = "likert"
points = 5
weight = 1.0
score = 2
rationale = "ResourceModel.vue的handleSubmit中直接提交formData全量字段未根据当前资源类型过滤，导致储能类型的提交数据中可能包含光伏类型的装机容量字段"
