[[criterion]]
name = "全屏API兼容处理"
description = "[Explicit] 是否正确处理Fullscreen API的浏览器前缀差异和兼容性检测。1: 仅使用标准API无兼容处理；2: 处理了webkit前缀但遗漏moz/ms；3: 主流前缀覆盖但检测逻辑有缺陷；4: 完整前缀覆盖+能力检测；5: 完整兼容+polyfill回退+优雅降级。"
type = "likert"
points = 5
weight = 1.0
score = 4
rationale = "useFullscreen.ts中定义requestFullscreenCompat方法，按优先级依次检测requestFullscreen、webkitRequestFullscreen、mozRequestFullScreen、msRequestFullscreen。exitFullscreen同样实现四种前缀覆盖，并通过document.fullscreenEnabled进行能力预检测。"

[[criterion]]
name = "全屏状态同步"
description = "[Explicit] 全屏状态变化（进入/退出/ESC退出）是否与组件状态实时同步。1: 状态不同步；2: 进入同步但退出不同步；3: 手动触发同步但ESC退出未捕获；4: fullscreenchange事件完整监听；5: 事件监听+状态校验+错误恢复。"
type = "likert"
points = 5
weight = 1.0
score = 4
rationale = "useFullscreen.ts通过addEventListener(\"fullscreenchange\")监听所有全屏状态变化，包括ESC退出。回调中通过document.fullscreenElement判断实际状态并同步isFullscreen变量，确保UI图标与浏览器状态一致。"

[[criterion]]
name = "Dialog全屏模式集成"
description = "[Explicit] el-dialog的fullscreen属性是否与浏览器Fullscreen API正确联动。1: 仅使用CSS模拟全屏；2: Dialog全屏但未使用浏览器API；3: 两者独立使用未联动；4: Dialog全屏+浏览器API联动；5: 联动+过渡动画+状态持久化。"
type = "likert"
points = 5
weight = 1.0
score = 4
rationale = "toggleFullscreen方法先调用requestFullscreenCompat将Dialog容器送入浏览器全屏，再设置el-dialog的:fullscreen为true。退出时先exitFullscreen再恢复Dialog尺寸，两个全屏机制同步联动。"

[[criterion]]
name = "全屏按钮交互设计"
description = "[Implicit] 全屏切换按钮的位置、图标和交互反馈是否符合用户直觉。1: 无全屏按钮；2: 有按钮但位置隐蔽；3: 位置合理但图标/提示缺失；4: 位置醒目+图标切换+tooltip提示；5: 完整交互+快捷键+双击触发。"
type = "likert"
points = 5
weight = 1.0
score = 4
rationale = "Dialog标题栏通过slot=\"header\"自定义header，全屏按钮使用:icon=\"isFullscreen ? Minimize : FullScreen\"动态切换图标。配合el-tooltip content=\"全屏/退出全屏\"提供文字提示，按钮hover时有背景色变化反馈。"

[[criterion]]
name = "键盘快捷键支持"
description = "[Implicit] 是否支持F11或其他快捷键触发全屏，与浏览器默认行为是否冲突。1: 无快捷键支持；2: 有但与浏览器冲突；3: 自定义快捷键但未阻止默认行为；4: 快捷键+preventDefault+状态同步；5: 可配置快捷键+冲突检测+用户提示。"
type = "likert"
points = 5
weight = 1.0
score = 3
rationale = "useFullscreen.ts中通过document.addEventListener(\"keydown\")监听F11键，在Dialog打开时preventDefault阻止浏览器默认全屏行为并改为触发Dialog全屏。但未在Dialog关闭时移除监听器，可能影响其他页面的F11行为。"

[[criterion]]
name = "全屏内容适配"
description = "[Implicit] 全屏模式下Dialog内部表单和表格内容是否自适应填充可用空间。1: 内容尺寸不变留大量空白；2: 宽度适配但高度固定；3: 宽高适配但布局比例失调；4: 内容完整适配且布局协调；5: 自适应+响应式断点+打印适配。"
type = "likert"
points = 5
weight = 1.0
score = 4
rationale = "Dialog全屏时通过CSS类.is-fullscreen切换el-form的width为100%，el-table的height绑定计算属性tableHeight根据window.innerHeight动态计算。表单布局从单列切换为两列以利用横向空间。"

[[criterion]]
name = "生命周期清理"
description = "[Implicit] 全屏相关的事件监听和状态是否在组件卸载时正确清理。1: 未清理事件监听；2: 部分清理但有遗漏；3: onUnmounted清理但全屏状态未恢复；4: 完整清理+状态恢复；5: 清理+异常保护+内存泄漏检测。"
type = "likert"
points = 5
weight = 1.0
score = 4
rationale = "useFullscreen.ts在onMounted中注册事件监听并保存引用，onUnmounted中调用removeEventListener移除所有监听器。若组件卸载时仍处于全屏状态，自动调用exitFullscreen恢复正常显示。"
