[[criterion]]
name = "cache_key_generation"
description = "[Explicit] 缓存key生成逻辑是否正确修复,能否根据分支名+依赖哈希生成唯一key确保缓存精准命中。1:未修改key生成逻辑;2:key格式不合理或缺少关键因子;3:基本可用但缺少部分因子(如target);4:key包含分支+依赖哈希,逻辑完整;5:key设计精准,支持多种lock文件,命中率最优"
type = "likert"
points = 5
weight = 1.0
score = 4
rationale = "cache key用branch-depHash-target三段式,支持多种lock文件哈希,逻辑完整"

[[criterion]]
name = "branch_cache_isolation"
description = "[Explicit] 不同分支的缓存是否通过独立目录实现物理隔离——仅评估分支间隔离能力,不涉及同分支并行锁。1:所有分支共用一个缓存目录;2:仅靠key前缀区分,无目录隔离;3:有分支命名空间但未做目录级隔离;4:分支独立缓存目录,物理隔离完整;5:独立目录+缓存大小监控+自动清理过期分支缓存"
type = "likert"
points = 5
weight = 1.0
score = 4
rationale = "通过分支命名空间隔离缓存目录,不同分支缓存物理隔离"

[[criterion]]
name = "parallel_build_protection"
description = "[Explicit] 同一分支并行构建时是否有锁机制防止缓存读写冲突——仅评估并行构建的互斥保护,不涉及分支间隔离。1:无任何锁或并行控制机制;2:仅文档提及需注意并行但无实现;3:有基本锁但不完善(如仅锁写不锁读);4:flock文件锁或CI级disableConcurrentBuilds二选一;5:flock文件锁+CI disableConcurrentBuilds双重保护"
type = "likert"
points = 5
weight = 1.0
score = 1
rationale = "无flock文件锁也无CI级并行控制,同一分支并行构建时缓存可能互相覆盖"

[[criterion]]
name = "mirror_source_config"
description = "[Explicit] 是否正确配置国内镜像源替代默认源解决下载超时——仅评估镜像源配置和主备切换,不涉及重试退避。1:未配置任何镜像源;2:配置了镜像但格式或地址有误;3:配置正确但无备用源fallback;4:.npmrc配置镜像+有主备源切换机制;5:主备源+可达性探测+自动切换+配置持久化"
type = "likert"
points = 5
weight = 1.0
score = 4
rationale = ".npmrc配置npmmirror镜像+build.sh有主备源自动切换机制"

[[criterion]]
name = "retry_resilience"
description = "[Explicit] 依赖安装失败时是否有重试退避机制——仅评估npm install层面的重试和退避策略,不涉及镜像源配置。1:失败后直接报错退出;2:简单循环重试无退避;3:有固定间隔重试;4:指数退避重试(如5s-10s-20s);5:指数退避+最大重试次数+超时配置+失败日志"
type = "likert"
points = 5
weight = 1.0
score = 4
rationale = "build.sh中有指数退避重试(5s-10s-20s),npm install失败后重试3次"

[[criterion]]
name = "cache_hit_rate_improvement"
description = "[Explicit] 修复后缓存命中率能否从零有效提升——题目核心问题是缓存命中率为零,需要验证修复后的缓存存储恢复机制和生命周期管理是否能确保后续构建命中缓存。1:未解决命中率问题;2:key逻辑修复但缺少缓存生命周期管理;3:key正确+存储恢复机制但无过期策略;4:key正确+存储恢复+过期清理机制;5:完整的缓存命中保障含key+存储+恢复+过期清理+命中率校验"
type = "likert"
points = 5
weight = 1.0
score = 2
rationale = "key生成逻辑修复后理论上可命中缓存,但缺少缓存过期清理和生命周期管理机制"

[[criterion]]
name = "jenkinsfile_integration"
description = "[Explicit] Jenkinsfile流水线集成质量,构建脚本是否能在CI环境中实际可用且一次写出无返工。1:未修改Jenkinsfile;2:Jenkinsfile有语法错误或逻辑缺陷;3:可用但有返工或冗余;4:一次写出合理pipeline,有timeout等保护;5:pipeline结构清晰,缓存/构建/报告分阶段,有完善的异常处理"
type = "likert"
points = 5
weight = 1.0
score = 3
rationale = "写了两版Jenkinsfile(先复杂后简化),有返工;最终版直接调用build.sh较合理"
