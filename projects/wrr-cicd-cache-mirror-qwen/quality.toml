[[criterion]]
name = "cache_key_generation"
description = "[Explicit] 缓存key生成逻辑是否正确修复,能否根据分支名+依赖哈希生成唯一key确保缓存精准命中。1:未修改key生成逻辑;2:key格式不合理或缺少关键因子;3:基本可用但缺少部分因子(如target);4:key包含分支+依赖哈希,逻辑完整;5:key设计精准,支持多种lock文件,命中率最优"
type = "likert"
points = 5
weight = 1.0
score = 4
rationale = "cache key用branch-depHash-target三段式,支持多种lock文件哈希,逻辑完整"

[[criterion]]
name = "branch_isolation_and_parallel_protection"
description = "[Explicit] 多分支和同分支并行构建时缓存隔离与冲突保护的综合能力——不同分支缓存是否互不干扰,同一分支并行构建时是否有锁保护防止缓存覆盖。1:无隔离无保护;2:仅靠key前缀区分,无目录隔离无锁;3:分支独立目录隔离,但同分支并行构建无锁保护;4:分支隔离+文件锁或CI级并行控制二选一;5:分支独立目录+flock文件锁+CI disableConcurrentBuilds三层保护"
type = "likert"
points = 5
weight = 1.0
score = 3
rationale = "通过分支命名空间隔离缓存目录,但同一分支并行构建无flock锁保护,可能互相覆盖"

[[criterion]]
name = "mirror_source_and_retry"
description = "[Explicit] 镜像源配置和依赖安装失败重试的综合容错能力——是否配置国内镜像解决下载超时,是否有备用源fallback和重试退避机制。1:未配置镜像源无重试;2:仅配置镜像或仅有简单重试;3:镜像源+fallback但缺少retry参数或退避策略;4:镜像源+retry参数+指数退避重试+主备切换;5:完整的镜像+retry+退避+主备切换+超时配置全覆盖"
type = "likert"
points = 5
weight = 1.0
score = 4
rationale = ".npmrc配置npmmirror+retry参数(retries=3,timeout),build.sh有主备源自动切换+指数退避重试(5s-10s-20s)"

[[criterion]]
name = "cache_hit_rate_improvement"
description = "[Explicit] 修复后缓存命中率能否从零有效提升——题目核心问题是缓存命中率为零,需要验证修复后的缓存存储/恢复机制和生命周期管理是否能确保后续构建命中缓存。1:未解决命中率问题;2:key逻辑修复但缺少缓存生命周期管理(无过期清理);3:key正确+存储恢复机制但无过期策略;4:key正确+存储恢复+过期清理机制;5:完整的缓存命中保障含key+存储+恢复+过期清理+命中率校验"
type = "likert"
points = 5
weight = 1.0
score = 2
rationale = "key生成逻辑修复后理论上可命中缓存,但缺少缓存过期清理和生命周期管理机制"

[[criterion]]
name = "jenkinsfile_integration"
description = "[Implicit] Jenkinsfile流水线集成质量,是否能在CI环境中实际可用。1:未修改Jenkinsfile;2:Jenkinsfile有语法错误或逻辑缺陷;3:可用但有返工或冗余;4:一次写出合理pipeline,有timeout等保护;5:pipeline结构清晰,缓存/构建/报告分阶段,有完善的异常处理"
type = "likert"
points = 5
weight = 1.0
score = 3
rationale = "写了两版Jenkinsfile(先复杂后简化),有返工;最终版直接调用build.sh较合理"
