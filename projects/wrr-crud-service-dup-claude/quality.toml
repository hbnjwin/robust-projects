[[criterion]]
name = "createOrUpdate模板提取"
description = "[Explicit] 是否将6个服务类共享的createOrUpdate模式（判空区分新增修改、BeanUtils拷贝、save、子表先删后增）提取为可复用模板。1: 未提取模板；2: 提取了部分逻辑但核心模式仍需每个类自行实现；3: 提取了基类但新增和修改分支的公共逻辑不完整；4: 通过泛型基类或模板方法完整封装了createOrUpdate的骨架逻辑；5: 泛型基类覆盖id判空、属性拷贝、save、子表处理全流程，子类只需实现钩子方法。"
type = "likert"
points = 5
weight = 1.0
score = 5
rationale = "创建了AbstractCrudServiceImpl泛型基类，完整封装createOrUpdate的模板逻辑，提供beforeCreate、beforeUpdate、getUpdateExcludeProperties、getChildTableHandlers四个钩子方法，子类只需实现差异化钩子即可。"

