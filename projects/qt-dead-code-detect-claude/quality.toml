[[criterion]]
name = "vulture全项目扫描"
description = "[Explicit] 是否用vulture扫描全项目生成未使用函数/类/变量的报告。1: 未运行vulture；2: 运行了但仅扫描了部分目录；3: 扫描了全项目但未保存报告；4: vulture扫描全项目并保存raw报告文件，列出未使用代码数量；5: 报告含代码行数估算和模块分布统计。"
type = "likert"
points = 5
weight = 1.0
score = 4
rationale = "vulture --min-confidence 60扫描全项目，发现519条raw findings，保存为vulture_raw_report.txt文件。"

[[criterion]]
name = "白名单误报筛选"
description = "[Explicit] 是否手动筛选vulture结果中的误报，生成.vulture_whitelist.py文件。1: 未创建白名单；2: 创建了但误报筛选不充分（白名单条目少于20）；3: 筛选了主要误报但遗漏了pytest动态调用的函数；4: .vulture_whitelist.py覆盖pytest fixture、PyTorch forward、Ptrade生命周期钩子等动态调用的误报；5: 白名单附带注释说明每类误报的原因。"
type = "likert"
points = 5
weight = 1.0
score = 4
rationale = ".vulture_whitelist.py识别并过滤229条误报，覆盖PyTorch forward()、Ptrade生命周期钩子（initialize/handle_data）、FastAPI路由、pytest fixture等动态调用场景。"

[[criterion]]
name = "engine目录import依赖分析"
description = "[Explicit] 是否对engine/目录做import依赖分析确认无其他模块import它。1: 未做依赖分析；2: 仅用grep搜索了import语句；3: 用ast模块分析了import但未覆盖动态import；4: 用grep -r和ast双重验证无其他模块import engine/下的类或函数；5: 额外生成了依赖图可视化。"
type = "likert"
points = 5
weight = 1.0
score = 4
rationale = "先vulture扫描再用grep -r确认engine/下的类和函数在项目其他目录无引用，双重验证无外部依赖。"

[[criterion]]
name = "engine目录deprecation标记"
description = "[Explicit] 是否在engine/每个文件头部加deprecation warning并在__init__.py标记__all__=[]。1: 未添加任何标记；2: 仅修改了__init__.py；3: __init__.py设__all__=[]但未在其他文件加warning；4: engine/__init__.py设__all__=[]，每个.py文件头部加warnings.warn(DeprecationWarning)；5: 额外在模块docstring中说明了废弃原因和替代方案。"
type = "likert"
points = 5
weight = 1.0
score = 4
rationale = "engine/__init__.py设__all__=[]，backtest.py、broker.py、datafeed.py、portfolio.py每个文件头部添加warnings.warn(DeprecationWarning)。"

[[criterion]]
name = "清理报告生成"
description = "[Explicit] 是否输出清理报告列出可安全删除的文件和需保留但标记deprecated的文件，附确认方法。1: 未生成报告；2: 报告仅列出文件名无确认方法；3: 列出了文件名和grep命令但分类不清；4: 报告分为\"可安全删除\"和\"标记deprecated\"两类，每个文件附grep -r确认无外部引用的命令；5: 报告额外包含预计节省的代码行数和后续清理建议。"
type = "likert"
points = 5
weight = 1.0
score = 4
rationale = "CLEANUP_REPORT.md分为可安全删除（14个文件~990行）和需标记deprecated（engine/目录）两类，每个文件附grep -r确认零引用的验证。"

[[criterion]]
name = "generate_cleanup_report脚本"
description = "[Implicit] 是否提供可重复执行的报告生成脚本用于后续维护。1: 未提供脚本；2: 脚本不可独立运行；3: 脚本可运行但依赖硬编码路径；4: 提供了generate_cleanup_report.py可重复运行生成更新报告；5: 脚本支持参数化（指定扫描目录、输出路径）。"
type = "likert"
points = 5
weight = 1.0
score = 4
rationale = "提供generate_cleanup_report.py可重复执行，结合vulture和grep自动生成结构化清理报告。"
