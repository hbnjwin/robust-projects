[[criterion]]
name = "表单验证规则触发"
description = "[Explicit] 是否修复点击提交按钮时NaiveUI表单验证规则不生效的问题。1: 提交时仍无验证直接提交; 2: 部分字段验证触发但必填项遗漏; 3: 所有必填项验证触发但异步校验缺失; 4: formRef.validate()在handleSubmit中正确调用且阻止无效提交; 5: validate返回Promise链式处理且验证失败时定位到首个错误字段"
type = "likert"
points = 5
weight = 1.0
score = 4
rationale = "handleSubmit中调用formRef.value.validate()并在Promise.catch中阻止提交，验证规则对所有必填字段生效且错误提示正确显示"

[[criterion]]
name = "编辑模式数据回填"
description = "[Explicit] 是否在编辑资源时将已有数据正确填充到表单各字段中。1: 编辑弹窗打开后所有字段为空; 2: 部分字段回填但类型转换错误如数字变字符串; 3: 基本字段回填正确但枚举类型select未选中; 4: 所有字段含select下拉框正确回填且类型匹配; 5: 回填后表单状态为pristine且修改后dirty状态正确追踪"
type = "likert"
points = 5
weight = 1.0
score = 4
rationale = "编辑模式下watch监听editId变化，从资源列表中查找对应数据并逐字段赋值给formData，select组件通过value-field配置确保枚举值正确回填"

[[criterion]]
name = "额定功率数值校验"
description = "[Explicit] 是否对额定功率字段添加正数校验，拒绝负数和零值输入。1: 无数值范围校验接受任意值; 2: 有min属性但未阻止手动输入负数; 3: 自定义validator拒绝负数和零但错误提示不明确; 4: validator含正数检查加NInputNumber的min属性双重保护加明确错误提示; 5: 双重校验加单位提示加合理上限限制加输入时实时反馈"
type = "likert"
points = 5
weight = 1.0
score = 4
rationale = "NInputNumber组件设置min=0.01阻止零和负值，同时自定义validator函数检查typeof为number且大于0，双重校验配合明确的错误提示"

[[criterion]]
name = "资源名称重复检查"
description = "[Implicit] 是否在提交前检查资源名称是否与已有资源重复（编辑时排除自身）。1: 无重复检查允许同名资源; 2: 前端检查但未排除编辑模式下的自身记录; 3: 正确排除自身的前端去重检查; 4: 前端即时检查加提交时再验证的双重保护; 5: 异步validator实时检查加防抖加编辑排除自身加后端校验"
type = "likert"
points = 5
weight = 1.0
score = 3
rationale = "自定义validator中通过遍历现有资源列表检查名称是否重复，但未处理编辑模式下排除当前资源自身的逻辑"

[[criterion]]
name = "表单重置与弹窗关闭"
description = "[Implicit] 是否在弹窗关闭或切换新增/编辑模式时正确重置表单状态和验证错误。1: 关闭弹窗后再打开仍保留上次数据和错误; 2: 数据重置但验证错误提示残留; 3: 数据和错误都重置但编辑切新增时有残留; 4: handleClose中formRef.restoreValidation()清除错误加重置formData; 5: 完整重置含动画过渡后执行防止闪烁"
type = "likert"
points = 5
weight = 1.0
score = 4
rationale = "弹窗关闭和模式切换时调用formRef.value.restoreValidation()清除错误状态，并将formData重置为初始默认值对象"

[[criterion]]
name = "类型约束与接口定义"
description = "[Implicit] 是否为资源表单数据定义TypeScript接口确保字段类型与NaiveUI组件props匹配。1: 使用any或无类型定义; 2: 有interface但字段类型与组件不匹配; 3: 基本类型定义正确但枚举值用string未用联合类型; 4: 完整interface含联合类型枚举加nullable字段加组件props类型对齐; 5: 类型定义含zod或valibot运行时校验联动"
type = "likert"
points = 5
weight = 1.0
score = 4
rationale = "定义了ResourceType联合类型字面量和ResourceFormData接口，字段类型与NaiveUI表单组件的props精确匹配"
