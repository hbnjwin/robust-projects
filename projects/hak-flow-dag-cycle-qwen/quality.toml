[[criterion]]
name = "响应式状态同步"
description = "[Explicit] WebSocket接收消息后Vue3响应式状态正确更新触发视图刷新。1:消息收到但视图不更新;2:部分字段更新;3:基本更新但深层嵌套属性有遗漏;4:所有字段正确更新;5:完整更新含nextTick确保DOM同步"
type = "likert"
points = 5
weight = 1.0
score = 3
rationale = "useReviewWebSocket.ts中将reactive()改为ref()包裹整个状态对象，onmessage中通过.value赋值触发更新，但对数组类型的批注列表用push()追加时偶尔不触发视图刷新"

[[criterion]]
name = "断线检测与重连"
description = "[Explicit] WebSocket断开后自动检测并重连（指数退避），含UI状态提示。1:断线后无反应;2:有重连但无UI提示;3:重连+UI提示但策略不合理;4:指数退避重连+状态栏提示;5:完整重连+状态提示+操作队列重放"
type = "likert"
points = 5
weight = 1.0
score = 3
rationale = "websocket.py和useReviewWebSocket.ts实现了onclose后自动重连（固定3秒间隔），前端有'连接已断开'提示，但无指数退避，弱网时3秒重试可能加重服务端负担"

[[criterion]]
name = "离线操作缓存"
description = "[Implicit] 断线期间用户操作的本地缓存和重连后重放。1:操作直接丢失;2:有缓存但重连后不重放;3:缓存+重放但有重复;4:幂等重放无重复;5:完整方案含冲突检测"
type = "likert"
points = 5
weight = 1.0
score = 1
rationale = "断线期间用户的标注操作直接通过WebSocket发送失败后被静默丢弃，没有任何本地缓存机制，用户不知道操作没生效"

[[criterion]]
name = "并发编辑冲突"
description = "[Explicit] 两人同时修改同一批注的冲突检测和解决。1:后者直接覆盖无提示;2:检测到冲突但处理不当;3:冲突提示但无选择机制;4:冲突弹窗含双方内容对比+选择;5:OT/CRDT级实时协作"
type = "likert"
points = 5
weight = 1.0
score = 2
rationale = "websocket.py的save_annotation只做了简单的UPDATE覆盖，没有版本号或时间戳校验，后写入的直接覆盖先写入的"

[[criterion]]
name = "心跳机制"
description = "[Implicit] WebSocket心跳检测静默断线。1:无心跳;2:有心跳但间隔不合理;3:心跳检测+超时处理;4:心跳+超时+自动重连联动;5:完整心跳含服务端配合"
type = "likert"
points = 5
weight = 1.0
score = 2
rationale = "useReviewWebSocket.ts没有实现ping/pong心跳，仅依赖浏览器原生的WebSocket关闭事件，NAT超时导致的静默断线无法检测"
