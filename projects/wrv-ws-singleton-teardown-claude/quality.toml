[[criterion]]
name = "引用计数机制"
description = "[Explicit] WebSocket单例的引用计数实现，多组件共享连接时只在最后一个组件断开时才真正关闭。1:未实现;2:简单计数但无减少逻辑;3:增减计数但边界条件有问题;4:完整refCount增减+归零断开;5:引用计数+WeakRef+自动清理"
type = "likert"
points = 5
weight = 1.0
score = 4
rationale = "websocket-manager.js新增refCount属性，connect()递增复用已有连接，disconnect()递减并仅当计数归零时才真正关闭连接和停止心跳/重连"

