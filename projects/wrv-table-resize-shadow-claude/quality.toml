[[criterion]]
name = "列宽自适应"
description = "[Explicit] 浏览器窗口缩放或F11全屏后表格列宽的重新计算。1:未处理;2:监听了resize但未触发重算;3:强制重挂载整表解决;4:局部refreshTable触发列宽重算;5:局部刷新+列宽缓存+平滑过渡"
type = "likert"
points = 5
weight = 1.0
score = 4
rationale = "expert-database/index.vue的handleResize中新增refreshTableLayout()调用，通过refreshTable()在nextTick后触发表格局部重新计算列宽布局，无需整表重挂载"

[[criterion]]
name = "阴影恢复"
description = "[Explicit] 固定列阴影在表格数据刷新后的恢复机制。1:未处理;2:手动滚动才恢复;3:数据刷新后延迟触发但不稳定;4:watch数据变化+dispatch scroll事件触发阴影重算;5:MutationObserver持续监听+自动恢复"
type = "likert"
points = 5
weight = 1.0
score = 4
rationale = "新增watch(tableData)监听数据变化，在nextTick后调用refreshTable()并向.t-table__content容器dispatch scroll事件，触发TDesign重新计算固定列阴影位置"

[[criterion]]
name = "debounce优化"
description = "[Explicit] resize事件debounce时间从500ms降低以减少窗口拖拽时的布局跳动。1:未修改;2:改了但值不合理;3:降到合理范围但未考虑性能;4:降到150-200ms兼顾响应和性能;5:自适应debounce+requestAnimationFrame"
type = "likert"
points = 5
weight = 1.0
score = 4
rationale = "debounce从500ms精准降到150ms，窗口拖拽缩放时响应更平滑，避免明显的布局跳动同时不会过度触发重算"

[[criterion]]
name = "渲染性能"
description = "[Implicit] 修复方案对表格渲染性能的影响。1:严重性能退化;2:整表重新渲染;3:局部刷新但有多余DOM操作;4:最小化DOM操作的局部刷新;5:虚拟滚动+增量更新"
type = "likert"
points = 5
weight = 1.0
score = 4
rationale = "refreshTable()仅触发TDesign内部的列宽重算逻辑，不会导致表格DOM完全重建，保留用户滚动位置和选中状态"

[[criterion]]
