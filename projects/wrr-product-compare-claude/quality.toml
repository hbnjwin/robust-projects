[[criterion]]
name = "参数对齐与差异高亮"
description = "[Explicit] 是否实现产品参数自动对齐和差异高亮——选中产品后对比页自动合并相同参数横向对齐且数值不同的参数高亮标记。1:未实现对齐或高亮;2:仅简单列表无对齐;3:有对齐但高亮缺失或不准确;4:对齐加高亮功能完整;5:对齐算法加差异检测有独立模块和测试验证"
type = "likert"
points = 5
weight = 1.0
score = 5
rationale = "compare.js独立模块实现对齐算法加差异检测，有配套单元测试验证正确性"

[[criterion]]
name = "折叠搜索筛选"
description = "[Explicit] 参数过多时是否支持折叠分组和搜索过滤——几十项参数需要按类别折叠支持关键词搜索快速定位。1:无折叠无搜索;2:有折叠但无搜索;3:折叠加搜索基本可用;4:折叠加搜索加仅差异模式功能全面;5:独立模块实现有测试覆盖工程质量高"
type = "likert"
points = 5
weight = 1.0
score = 5
rationale = "filter.js独立模块，折叠搜索仅差异模式，有测试覆盖，工程质量高"

[[criterion]]
name = "移动端响应式设计"
description = "[Explicit] 移动端是否可用——对比表格在小屏幕上需要横向滚动或其他适配方案且参数列需要固定可见。1:无移动端适配;2:有viewport但布局错乱;3:基本可用但CSS内嵌难维护;4:独立样式文件响应式布局加sticky列;5:完整移动端适配经过多尺寸测试验证"
type = "likert"
points = 5
weight = 1.0
score = 4
rationale = "独立styles.css完整响应式布局，sticky列，可维护可测试"

[[criterion]]
name = "多品类产品支持"
description = "[Explicit] 是否支持不同产品类别的不同参数——题目要求不同类别参数不一样需要类别筛选和参数动态适配。1:无类别区分;2:仅一个类别的产品数据;3:多类别但参数未区分;4:多类别加不同参数加类别筛选;5:多类别多产品每类30项以上参数完整类别筛选"
type = "likert"
points = 5
weight = 1.0
score = 4
rationale = "2个类别乘5个产品，每类30项以上参数，类别筛选完整实现"

[[criterion]]
name = "项目文件组织"
