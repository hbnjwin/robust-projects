[[criterion]]
name = "参数对齐与差异高亮"
description = "[Explicit] 是否实现产品参数自动对齐和差异高亮——选中产品后对比页自动合并相同参数横向对齐,数值不同的参数高亮标记。1:未实现对齐或高亮;2:仅简单列表无对齐;3:有对齐但高亮缺失或不准确;4:对齐+高亮功能完整;5:对齐算法+差异检测有独立模块和测试验证"
type = "likert"
points = 5
weight = 1.0
score = 5
rationale = "compare.js独立模块实现对齐算法+差异检测,有配套单元测试验证正确性"

[[criterion]]
name = "折叠搜索筛选"
description = "[Explicit] 参数过多时是否支持折叠分组和搜索过滤——几十项参数需要按类别折叠,支持关键词搜索快速定位。1:无折叠无搜索;2:有折叠但无搜索;3:折叠+搜索基本可用;4:折叠+搜索+仅差异模式功能全面;5:独立模块实现,有测试覆盖,工程质量高"
type = "likert"
points = 5
weight = 1.0
score = 5
rationale = "filter.js独立模块,折叠/搜索/仅差异模式,有测试覆盖,工程质量高"

[[criterion]]
name = "移动端响应式设计"
description = "[Explicit] 移动端是否可用——对比表格在小屏幕上需要横向滚动或其他适配方案,参数列需要固定可见。1:无移动端适配;2:有viewport但布局错乱;3:基本可用但CSS内嵌难维护;4:独立样式文件,响应式布局+sticky列;5:完整移动端适配,经过多尺寸测试验证"
type = "likert"
points = 5
weight = 1.0
score = 4
rationale = "独立styles.css完整响应式布局,sticky列,可维护可测试"

[[criterion]]
name = "多品类产品支持"
description = "[Explicit] 是否支持不同产品类别的不同参数——题目要求不同类别参数不一样,需要类别筛选和参数动态适配。1:无类别区分;2:仅一个类别的产品数据;3:多类别但参数未区分;4:多类别+不同参数+类别筛选;5:多类别多产品,每类30+参数,完整类别筛选"
type = "likert"
points = 5
weight = 1.0
score = 4
rationale = "2个类别x5个产品,每类30+项参数,类别筛选完整实现"

[[criterion]]
name = "项目工程结构"
description = "[Implicit] 项目结构和工程化质量——是否采用模块化结构,文件是否放在正确的项目目录,代码是否可维护。1:单文件且放错位置(如桌面);2:单文件但在正确目录;3:基本分离但结构不清晰;4:模块化HTML+CSS+JS分离;5:完整工程化结构含package.json+测试+文档"
type = "likert"
points = 5
weight = 1.0
score = 5
rationale = "模块化HTML+CSS+6个JS文件+test+package.json,清晰的MVC分离"

[[criterion]]
name = "测试验证"
description = "[Implicit] 是否有测试验证功能正确性——对齐算法、差异检测、搜索过滤等核心逻辑是否有自动化测试。1:无任何测试;2:有手动验证但无自动测试;3:少量测试覆盖主干;4:测试覆盖核心逻辑;5:完整单元测试(20+用例)覆盖所有核心模块"
type = "likert"
points = 5
weight = 1.0
score = 5
rationale = "26个单元测试全部通过,覆盖对齐算法/差异检测/搜索/URL同步等核心逻辑"

[[criterion]]
name = "任务规划执行"
description = "[Implicit] 任务规划和执行质量——是否有合理的开发流程(规划→实现→测试→验证),工具使用是否有序。1:无规划直接输出;2:极少工具调用草率完成;3:有基本流程但不完整;4:有规划+任务跟踪+有序执行;5:完整的规划→分步实现→测试→验证闭环"
type = "likert"
points = 5
weight = 1.0
score = 4
rationale = "EnterPlanMode先规划,TaskCreate跟踪7项任务,有序执行59个工具调用"
