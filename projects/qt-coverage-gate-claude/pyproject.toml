[project]
name = "qt-coverage-gate"
version = "0.1.0"
description = "Quantitative trading platform"
requires-python = ">=3.9"

[tool.pytest.ini_options]
testpaths = ["testing"]
addopts = [
    "--cov=core",
    "--cov=analytics",
    "--cov=live",
    "--cov-report=html",
    "--cov-report=term",
    "--cov-fail-under=40",
]
