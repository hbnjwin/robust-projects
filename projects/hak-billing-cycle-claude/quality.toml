[[criterion]]
name = "三种计费模式周期管理"
description = "[Explicit] 是否完整解读了按月/按年/按量三种计费模式的周期计算和续费逻辑。1: 只描述了一种；2: 描述了三种但周期计算不准确；3: 三种模式的周期计算基本正确但续费逻辑不完整；4: 完整分析了三种模式的周期起止日期计算和自动续费触发条件；5: 周期管理分析完整且处理了自然月天数差异和闰年场景"
type = "likert"
points = 5
weight = 1.0
score = 3
rationale = "描述了三种计费模式的基本概念和周期划分规则，但对具体的周期计算代码（如1月31日按月续费后下一周期是2月28日还是3月2日）未做深入分析"

[[criterion]]
name = "升降级折算规则"
description = "[Explicit] 是否分析了月中升级套餐时的按天折算差价计算方式。1: 未分析升降级；2: 提到了折算但公式错误；3: 分析了升级折算但降级延迟生效的规则不完整；4: 升级折算和降级延迟的规则都分析清晰并指出了客户投诉的根因；5: 折算分析完整且处理了跨月升级和套餐价格变更的边界场景"
type = "likert"
points = 5
weight = 1.0
score = 4
rationale = "分析了升级折算的标准算法（剩余天数/总天数×单价差额），指出了降级延迟生效的设计考虑（防止用户频繁升降级套利），并对月中升级多收费的投诉给出了合理的根因推断——折算天数用固定30天而非实际天数导致2月份多算了2天"

[[criterion]]
name = "阶梯定价累计重置"
description = "[Explicit] 是否分析了按量计费的阶梯价格累计计数器和重置机制。1: 未分析阶梯定价；2: 列出了阶梯但未分析累计方式；3: 分析了阶梯计费但重置时间点分析不准确；4: 分析了累计计数器的存储和重置条件并定位了客户投诉的根因；5: 阶梯分析完整且处理了跨月计数和中途变更阶梯规则的场景"
type = "likert"
points = 5
weight = 1.0
score = 3
rationale = "描述了阶梯定价的基本结构和累计重置规则，分析了15号重置投诉的可能原因是计费周期起算日按合同签订日而非自然月"

[[criterion]]
name = "试用期转正衔接"
description = "[Explicit] 是否分析了试用期到正式订阅的衔接逻辑包含补费计算。1: 未分析试用期；2: 提到了试用期但未分析转正流程；3: 分析了转正触发但补费计算不完整；4: 完整分析了试用期→正式的衔接流程含超出免费额度的补费计算；5: 衔接分析完整且处理了试用期延长和多次试用的边界场景"
type = "likert"
points = 5
weight = 1.0
score = 4
rationale = "分析了试用期转正的完整衔接流程：14天试用到期自动触发convert_to_paid方法，计算试用期间实际使用量超出免费额度的部分按正式版阶梯价补收费用，补费金额加入首月账单合并收取"

[[criterion]]
name = "投诉根因分析"
description = "[Implicit] 是否针对月中升级多收费和阶梯重置时间错误两个投诉给出了准确的根因。1: 未分析投诉；2: 只分析了一个；3: 两个都分析了但根因不准确；4: 两个投诉根因分析准确；5: 根因分析精确且给出了修复方案和补偿建议"
type = "likert"
points = 5
weight = 1.0
score = 3
rationale = "同样给出了两个投诉的可能根因分析，方向基本正确，但由于缺少实际代码无法给出精确定位"
