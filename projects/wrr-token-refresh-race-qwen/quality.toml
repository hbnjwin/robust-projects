[[criterion]]
name = "concurrent_refresh_guard"
description = "Token并发刷新的重入保护机制。1:未识别并发刷新问题;2:识别了但锁机制实现错误;3:实现了isRefreshing标志但存在竞态窗口;4:正确实现了基于Promise的单次刷新+排队机制;5:完善的重入保护含超时兜底"
type = "likert"
points = 5
weight = 1.0
score = 3
rationale = "request.ts中识别了isRefreshing标志的作用，但对refreshToken函数内部Promise排队的竞态时序分析不深入"

[[criterion]]
name = "pending_request_traversal"
description = "pendingRequests数组遍历期间的修改安全性。1:未注意遍历问题;2:注意到但未修复;3:改用了安全遍历但逻辑有瑕疵;4:正确使用splice+while替代forEach避免遍历竞态;5:完美解决含并发安全性证明"
type = "likert"
points = 5
weight = 1.0
score = 2
rationale = "在request.ts中使用forEach遍历pendingRequests并resolve，未意识到遍历期间新请求push进来导致的竞态"

[[criterion]]
name = "refresh_failure_propagation"
description = "刷新Token失败时排队请求的错误传播。1:刷新失败后排队请求永久挂起;2:刷新失败但只reject了部分请求;3:reject了所有排队请求但未清理状态;4:正确reject所有排队请求并重置isRefreshing;5:完善的错误传播含重试策略和用户提示"
type = "likert"
points = 5
weight = 1.0
score = 2
rationale = "request.ts中refreshToken失败时catch块只重置了isRefreshing，pendingRequests中的请求未reject导致泄漏"

[[criterion]]
name = "axios_interceptor_design"
description = "Axios响应拦截器中401处理的设计质量。1:拦截器逻辑混乱或死循环;2:基本能拦截401但多次触发刷新;3:正确拦截401并触发单次刷新;4:完整的拦截→刷新→重试流程;5:拦截器设计优雅含白名单和最大重试次数"
type = "likert"
points = 5
weight = 1.0
score = 3
rationale = "response interceptor中401处理基本正确，但对拦截器自身请求（refreshToken请求本身401）的递归问题未充分考虑"

[[criterion]]
name = "auth_module_structure"
description = "auth.ts模块中Token管理的代码组织。1:Token管理代码散乱无结构;2:有基本结构但职责不清;3:getToken/setToken/refreshToken职责分明;4:模块结构清晰含类型定义;5:模块设计优秀含单一职责和可测试性"
type = "likert"
points = 5
weight = 1.0
score = 3
rationale = "auth.ts中getToken/setToken/refreshToken基本分离，但refreshToken的Promise返回值类型不够严格"

[[criterion]]
name = "investigation_path_efficiency"
description = "排查路径是否高效精准。1:超过20次工具调用大量试错;2:15-20次调用含多次无效搜索;3:10-15次调用有冗余但方向正确;4:5-10次调用路径清晰;5:5次以内精准直达"
type = "likert"
points = 5
weight = 1.0
score = 2
rationale = "共17次工具调用包含多次Bash和Glob搜索，在request.ts和auth.ts之间反复跳转"

[[criterion]]
name = "type_safety_and_error_handling"
description = "TypeScript类型安全和异步错误处理的规范性。1:无类型注解且Promise未处理reject;2:部分类型注解但async/await错误处理不完整;3:类型基本正确但catch块处理不够;4:类型安全且async/await错误链完整;5:严格类型安全含泛型和完整的错误边界"
type = "likert"
points = 5
weight = 1.0
score = 2
rationale = "异步错误处理不完善，refreshToken失败时pending请求的Promise泄漏未处理"
