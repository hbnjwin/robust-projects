[[criterion]]
name = "死路由识别"
description = "[Explicit] 准确识别Auth.Send路由未注册导致401跳转失败的问题。1: 未识别；2: 只看到跳转失败但不知原因；3: 知道路由不存在但未找到auth-center.js模块文件；4: 准确定位auth-center.js存在但未在router/index.js中import和注册；5: 定位根因并验证了模块文件内容和路由命名的匹配关系"
type = "likert"
points = 5
weight = 1.0
score = 4
rationale = "通过Read读取router/index.js确认routes数组中缺少AuthCenterRoute，再Read auth-center.js确认模块文件存在且导出了name:'Auth.Send'的路由配置，准确定位到router/index.js未导入该模块"

[[criterion]]
name = "路由注册修复"
description = "[Explicit] 在router/index.js中正确导入并注册AuthCenterRoute模块。1: 未注册；2: import了但未加入routes数组；3: 加入了但位置或展开方式不对；4: 正确import并在routes数组中展开AuthCenterRoute；5: 注册并验证路由可达性"
type = "likert"
points = 5
weight = 1.0
score = 4
rationale = "router/index.js第7行添加import AuthCenterRoute from './modules/auth-center'，第14行在routes数组中用...AuthCenterRoute展开，路由模块正确注册到应用路由表"

[[criterion]]
name = "401跳转链路"
description = "[Explicit] 修复后app-request.js响应拦截器中的router.push({name:'Auth.Send'})能成功跳转到登录页。1: 仍无法跳转；2: 跳转但显示空白页；3: 跳转到了但组件未正确渲染；4: 完整链路打通，401→拦截器→Auth.Send路由→登录组件；5: 链路打通并包含重登录后回原页面的逻辑"
type = "likert"
points = 5
weight = 1.0
score = 4
rationale = "Auth.Send路由注册后，app-request.js响应拦截器中的router.push({name:'Auth.Send'})能正确匹配到auth-center.js定义的/auth-center/send路径，完成401到登录页的跳转链路"

[[criterion]]
name = "路由模块完整性"
description = "[Implicit] 检查auth-center.js模块中引用的子组件文件是否存在。1: 引用了不存在的组件；2: 部分组件存在；3: 主要组件存在但部分子路由组件缺失；4: 所有引用的组件文件都存在；5: 组件存在且import路径和命名规范正确"
type = "likert"
points = 5
weight = 1.0
score = 4
rationale = "通过Read检查auth-center.js模块确认send和receive两个子路由的组件引用，验证了路由配置的component字段指向正确的懒加载路径"

[[criterion]]
name = "代码精准度"
description = "[Implicit] 修改范围是否精准聚焦于路由注册修复。1: 大量无关修改；2: 修改了不必要的文件；3: 修改集中但有冗余编辑操作；4: 精准修改目标文件；5: 最小改动完成修复"
type = "likert"
points = 5
weight = 1.0
score = 4
rationale = "7次工具调用中2次Edit精准修改router/index.js的import语句和routes数组两处位置，无多余文件变更"
