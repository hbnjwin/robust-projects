[[criterion]]
name = "新字段检测"
description = "[Explicit] 后端新增字段在localStorage缓存中缺失的检测与补充。1:未处理;2:简单覆盖缓存;3:对比后端字段与缓存差集并补充;4:差集补充+保持用户排序;5:差集补充+默认位置可配+版本号校验"
type = "likert"
points = 5
weight = 1.0
score = 4
rationale = "在initColumns方法中对比后端返回字段与缓存字段，缺失的新字段按后端默认顺序插入到对应位置"

[[criterion]]
name = "旧字段清理"
description = "[Explicit] 后端删除的字段从localStorage缓存中清理。1:未处理;2:删除但顺序错乱;3:正确过滤已删除字段;4:过滤+保持现有排序不变;5:过滤+排序+用户提示字段变更"
type = "likert"
points = 5
weight = 1.0
score = 4
rationale = "使用Set结构高效过滤已删除字段，保持剩余字段的用户自定义排序不变"

[[criterion]]
name = "版本同步"
description = "[Explicit] 缓存配置与后端字段定义的版本一致性机制。1:无版本概念;2:每次覆盖缓存;3:启动时对比同步;4:hash比较+增量更新;5:版本号+增量+变更日志"
type = "likert"
points = 5
weight = 1.0
score = 4
rationale = "通过计算后端columns的hash值与缓存hash比较，仅在变化时执行同步逻辑"

