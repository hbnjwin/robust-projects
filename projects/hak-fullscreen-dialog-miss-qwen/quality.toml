[[criterion]]
name = "全屏API兼容处理"
description = "[Explicit] 是否正确处理Fullscreen API的浏览器前缀差异和兼容性检测。1: 仅使用标准API无兼容处理；2: 处理了webkit前缀但遗漏moz/ms；3: 主流前缀覆盖但检测逻辑有缺陷；4: 完整前缀覆盖+能力检测；5: 完整兼容+polyfill回退+优雅降级。"
type = "likert"
points = 5
weight = 1.0
score = 2
rationale = "useFullscreen.ts中仅调用document.documentElement.requestFullscreen()标准方法，未处理webkitRequestFullscreen和mozRequestFullScreen等前缀API。Safari旧版本下全屏功能完全失效，未做能力检测和降级。"

[[criterion]]
name = "全屏状态同步"
description = "[Explicit] 全屏状态变化（进入/退出/ESC退出）是否与组件状态实时同步。1: 状态不同步；2: 进入同步但退出不同步；3: 手动触发同步但ESC退出未捕获；4: fullscreenchange事件完整监听；5: 事件监听+状态校验+错误恢复。"
type = "likert"
points = 5
weight = 1.0
score = 2
rationale = "ReportAuditForm.vue中通过isFullscreen变量控制全屏状态，但仅在按钮点击时切换。用户按ESC退出浏览器全屏后isFullscreen仍为true，界面显示全屏图标与实际状态不一致，后续点击需要两次才能正常切换。"

[[criterion]]
name = "Dialog全屏模式集成"
description = "[Explicit] el-dialog的fullscreen属性是否与浏览器Fullscreen API正确联动。1: 仅使用CSS模拟全屏；2: Dialog全屏但未使用浏览器API；3: 两者独立使用未联动；4: Dialog全屏+浏览器API联动；5: 联动+过渡动画+状态持久化。"
type = "likert"
points = 5
weight = 1.0
score = 2
rationale = "el-dialog仅使用:fullscreen=\"isFullscreen\"切换CSS全屏样式（width:100vw+height:100vh），未调用浏览器Fullscreen API。Dialog在CSS全屏下仍可见浏览器地址栏和标签栏，非真正全屏体验。"

[[criterion]]
name = "全屏按钮交互设计"
description = "[Implicit] 全屏切换按钮的位置、图标和交互反馈是否符合用户直觉。1: 无全屏按钮；2: 有按钮但位置隐蔽；3: 位置合理但图标/提示缺失；4: 位置醒目+图标切换+tooltip提示；5: 完整交互+快捷键+双击触发。"
type = "likert"
points = 5
weight = 1.0
score = 3
rationale = "Dialog标题栏右侧放置了全屏按钮使用el-icon，但图标在全屏和非全屏状态下未切换（始终显示FullScreen图标）。按钮无el-tooltip提示文字，用户需要试点才知道功能。"

[[criterion]]
name = "键盘快捷键支持"
description = "[Implicit] 是否支持F11或其他快捷键触发全屏，与浏览器默认行为是否冲突。1: 无快捷键支持；2: 有但与浏览器冲突；3: 自定义快捷键但未阻止默认行为；4: 快捷键+preventDefault+状态同步；5: 可配置快捷键+冲突检测+用户提示。"
type = "likert"
points = 5
weight = 1.0
score = 1
rationale = "ReportAuditForm.vue中未监听任何键盘事件，用户只能通过点击按钮触发全屏。按F11触发的是浏览器原生全屏而非Dialog全屏，两种全屏状态相互独立导致混乱。"

[[criterion]]
name = "全屏内容适配"
description = "[Implicit] 全屏模式下Dialog内部表单和表格内容是否自适应填充可用空间。1: 内容尺寸不变留大量空白；2: 宽度适配但高度固定；3: 宽高适配但布局比例失调；4: 内容完整适配且布局协调；5: 自适应+响应式断点+打印适配。"
type = "likert"
points = 5
weight = 1.0
score = 2
rationale = "Dialog全屏后内部el-form的宽度仍使用固定像素值（width:600px），表单在全屏模式下居中显示两侧大量空白。el-table的height未动态调整，表格区域未利用新增的垂直空间。"

[[criterion]]
name = "生命周期清理"
description = "[Implicit] 全屏相关的事件监听和状态是否在组件卸载时正确清理。1: 未清理事件监听；2: 部分清理但有遗漏；3: onUnmounted清理但全屏状态未恢复；4: 完整清理+状态恢复；5: 清理+异常保护+内存泄漏检测。"
type = "likert"
points = 5
weight = 1.0
score = 2
rationale = "useFullscreen.ts中addEventListener注册的fullscreenchange监听器未在onUnmounted中removeEventListener。组件销毁后全屏状态变化仍触发已卸载组件的回调，造成内存泄漏和潜在的Vue警告。"
