[[criterion]]
name = "基准路径定义"
description = "[Explicit] 是否在config.py中用pathlib.Path定义PROJECT_ROOT、DATA_DIR、LOG_DIR、MODEL_DIR等基准路径。1:未使用pathlib;2:仅定义了PROJECT_ROOT;3:定义了PROJECT_ROOT和DATA_DIR但缺少其他目录;4:PROJECT_ROOT从__file__推导并定义DATA_DIR、LOG_DIR、MODEL_DIR;5:完整路径定义含自动创建目录和权限检查"
type = "likert"
points = 5
weight = 1.0
score = 4
rationale = "config.py中通过Path(__file__).resolve().parent定义PROJECT_ROOT，派生DATA_DIR、LOG_DIR、MODEL_DIR等路径常量"

[[criterion]]
name = "硬编码路径替换"
description = "[Explicit] 是否全项目搜索替换了/home/tulin/quant和E:\quant_data等硬编码路径为config引用。1:未替换硬编码路径;2:替换了少于5处;3:替换了主要文件中的硬编码路径;4:系统性替换覆盖大部分文件;5:全项目无遗留硬编码路径"
type = "likert"
points = 5
weight = 1.0
score = 4
rationale = "通过53次Edit系统性替换了config.py、logger.py、scheduler.py等文件中的硬编码路径，使用Grep定位后逐文件修改"

[[criterion]]
name = "测试路径注入修复"
description = "[Explicit] 是否将testing/目录中的sys.path.insert全部去掉改为正确的项目安装方式。1:sys.path.insert仍保留;2:去掉了部分但不完整;3:全部去掉并添加了pyproject.toml配置;4:去掉sys.path.insert并配置了正确的包发现规则;5:完整修复含conftest.py路径配置和CI验证"
type = "likert"
points = 5
weight = 1.0
score = 3
rationale = "testing/目录中的sys.path.insert被替换为pyproject.toml的包发现配置，但部分测试文件的相对导入路径需要调整"

[[criterion]]
name = "自定义目录支持"
description = "[Explicit] 是否通过QUANT_DATA_DIR环境变量支持用户自定义数据目录覆盖默认路径。1:不支持自定义;2:有环境变量但未正确回退到默认值;3:os.environ.get实现含正确的默认值回退;4:环境变量覆盖含路径存在性检查;5:自定义目录支持含自动创建和磁盘空间检查"
type = "likert"
points = 5
weight = 1.0
score = 4
rationale = "config.py中QUANT_DATA_DIR通过os.environ.get读取并回退到PROJECT_ROOT/data，路径使用pathlib.Path确保跨平台兼容"

