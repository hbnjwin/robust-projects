[[criterion]]
name = "节点去重机制"
description = "[Explicit] 展开收起再展开时是否正确防止子节点重复加载追加。1:完全未处理;2:有去重但仍偶发重复;3:resolve前清空旧节点;4:基于loaded标志+节点ID Map去重;5:去重+增量更新+动画过渡。"
type = "likert"
points = 5
weight = 1.0
score = 3
rationale = "DepartmentTree.vue的loadNode回调中在resolve前先执行node.childNodes=[]清空旧数据，避免追加重复。但这种暴力清空方式会导致子节点的展开状态也被重置，且每次展开都重新请求API增加服务端压力。"

[[criterion]]
name = "勾选状态持久化"
description = "[Explicit] 展开的节点收起再展开后勾选状态是否保持。1:勾选全部丢失;2:部分保持;3:通过外部数组记忆但不完整;4:checkedKeys缓存+展开后恢复;5:完整持久化含半选状态。"
type = "likert"
points = 5
weight = 1.0
score = 2
rationale = "DepartmentTree.vue中收起节点后childNodes被清空，勾选信息随DOM销毁丢失。未在组件层面维护checkedKeys缓存数组，也未利用el-tree的default-checked-keys属性在重新加载后恢复选中状态。用户每次展开都需要重新勾选。"

[[criterion]]
name = "搜索过滤展开"
description = "[Explicit] 搜索过滤后匹配节点的父节点链路是否自动展开。1:过滤后父节点不展开;2:仅展开一级父节点;3:递归展开但有延迟;4:完整递归展开路径+高亮匹配;5:展开+高亮+滚动定位。"
type = "likert"
points = 5
weight = 1.0
score = 2
rationale = "DepartmentTree.vue的filter-node-method仅返回节点是否匹配，未处理匹配节点的祖先链展开。el-tree的lazy模式下filter不会自动展开未加载的父节点，导致匹配的深层节点被折叠的父节点隐藏，用户看不到搜索结果。"

[[criterion]]
name = "懒加载缓存策略"
description = "[Implicit] 已加载过的节点是否缓存避免重复请求，以及缓存失效机制。1:每次展开都请求;2:缓存但无失效;3:loaded标志+手动刷新;4:TTL缓存+主动刷新按钮;5:增量同步+WebSocket推送更新。"
type = "likert"
points = 5
weight = 1.0
score = 2
rationale = "DepartmentTree.vue中每次展开节点都调用loadNode发起API请求，无论之前是否已成功加载过。收起再展开同一节点会产生重复请求，在部门树节点较多时造成不必要的网络开销和加载等待。"

[[criterion]]
name = "composable抽取"
description = "[Implicit] 树形操作逻辑是否从组件中抽取为独立composable。1:所有逻辑在模板组件中;2:部分抽取;3:抽取了但接口不清晰;4:完整的useDepartmentTree composable;5:通用useTreeLazy composable。"
type = "likert"
points = 5
weight = 1.0
score = 3
rationale = "department.ts定义了API函数和类型，DepartmentTree.vue作为主组件包含loadNode、check-change等事件处理逻辑。核心树操作逻辑与组件模板耦合，未抽取为独立的composable，复用性受限。"

[[criterion]]
name = "性能优化"
description = "[Implicit] 大数据量下的虚拟化、节流、防抖等性能措施。1:无优化;2:搜索防抖;3:防抖+懒加载;4:虚拟滚动+防抖+懒加载;5:完整性能方案含骨架屏。"
type = "likert"
points = 5
weight = 1.0
score = 2
rationale = "DepartmentTree.vue的搜索框input事件直接触发filter调用，无防抖处理。部门树节点超过500个时搜索会产生明显卡顿。未使用el-tree-v2虚拟化组件，全量渲染节点DOM。"

[[criterion]]
name = "交互反馈"
description = "[Implicit] 展开加载、搜索中、操作完成等状态的用户反馈。1:无反馈;2:仅控制台日志;3:loading状态展示;4:loading+空状态+错误提示;5:完整的交互反馈体系。"
type = "likert"
points = 5
weight = 1.0
score = 2
rationale = "DepartmentTree.vue中节点展开加载期间无loading指示器，用户无法判断是在加载还是该节点确实没有子项。搜索过滤期间无加载动画，空结果时无\"未找到匹配项\"的友好提示。"
