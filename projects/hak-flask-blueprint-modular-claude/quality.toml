[[criterion]]
name = "请求去重防抖"
description = "[Explicit] 快速滚动触发多次IntersectionObserver回调时是否防止重复loadMore请求。1:每次回调都请求;2:loading标志但有竞态;3:loading互斥锁;4:loading锁+requestId双重防护;5:锁+防抖+节流+取消队列。"
type = "likert"
points = 5
weight = 1.0
score = 4
rationale = "useInfiniteScroll.ts中loadMore使用loading互斥锁+currentRequestId版本号双重防护。进入loadMore时立即设置loading.value=true并递增requestId，请求返回后比对requestId是否匹配当前版本，不匹配则丢弃响应。IntersectionObserver配置threshold:0.1减少触发频率，配合loading锁确保同一时刻只有一个请求在执行。"

[[criterion]]
name = "竞态条件处理"
description = "[Explicit] 修改筛选条件时飞行中的旧页面请求是否被正确取消或忽略。1:旧请求覆盖新数据;2:版本号但实现有bug;3:AbortController但未全覆盖;4:AbortController取消+版本号校验;5:取消+版本+请求队列管理。"
type = "likert"
points = 5
weight = 1.0
score = 4
rationale = "report.ts中fetchReports接受AbortSignal参数。useInfiniteScroll.ts维护abortController实例，每次loadMore前abort()取消上一个未完成的请求。watch(filterParams)变化时先abort取消飞行请求，再重置page=1和reports=[]，最后发起新的loadMore。被取消的请求在catch中通过signal.aborted判断静默忽略，不触发错误提示。"

[[criterion]]
name = "数据去重合并"
description = "[Explicit] 多次请求返回的数据中存在重复记录时是否去重。1:直接concat导致重复;2:去重但顺序打乱;3:基于ID去重保持顺序;4:Map去重+顺序保持+新增标记;5:去重+diff更新+虚拟列表同步。"
type = "likert"
points = 5
weight = 1.0
score = 4
rationale = "useInfiniteScroll.ts中mergeResults方法使用Map<string, Report>按report.id去重合并。新数据中与已有数据ID相同的记录用新版本替换（保证数据最新），新ID的记录追加到末尾。ReportList.vue的v-for使用:key=\"report.id\"确保列表项的DOM复用正确。去重后的列表保持服务端返回的排序顺序。"

[[criterion]]
name = "IntersectionObserver配置"
description = "[Implicit] IntersectionObserver的threshold、rootMargin等参数配置质量。1:默认配置;2:调整了threshold;3:threshold+rootMargin预加载;4:自适应配置+disconnect管理;5:动态调整+性能监控+降级方案。"
type = "likert"
points = 5
weight = 1.0
score = 4
rationale = "useInfiniteScroll.ts中IntersectionObserver配置{threshold:0.1, rootMargin:'0px 0px 200px 0px'}，在距底部200px时提前触发加载，用户感知不到加载等待。观察的sentinel元素放在列表末尾，通过ref绑定。onUnmounted中disconnect清理observer。当noMore为true时也disconnect停止观察，避免无意义的回调执行。提供refreshObserver方法在DOM变化后重新绑定sentinel。"

[[criterion]]
name = "composable封装质量"
description = "[Implicit] useInfiniteScroll composable的API设计和配置灵活性。1:硬编码在组件中;2:基本composable;3:可配置但接口混乱;4:完整composable+配置项+响应式状态;5:通用composable+泛型+插件扩展。"
type = "likert"
points = 5
weight = 1.0
score = 4
rationale = "useInfiniteScroll.ts接收配置对象{fetchFn, pageSize=20, rootMargin='200px', threshold=0.1}。导出{reports, loading, noMore, error, loadMore, reset, sentinelRef}完整的响应式状态和方法。sentinelRef通过模板ref自动绑定，无需手动操作DOM。reset()方法供筛选条件变化时调用，清空数据并重新加载第1页。error状态驱动UI展示加载失败提示。"

[[criterion]]
name = "筛选重置逻辑"
description = "[Implicit] 筛选条件变化后列表数据是否正确重置并重新加载。1:筛选后数据不变;2:重置但有残留;3:重置page+清空列表;4:重置+取消请求+重新加载+滚动回顶;5:重置+动画过渡+骨架屏。"
type = "likert"
points = 5
weight = 1.0
score = 4
rationale = "useInfiniteScroll.ts中watch(filterParams, {deep:true})监听筛选变化，回调中执行完整重置流程：(1)abortController.abort()取消飞行请求;(2)reports.value=[]清空列表;(3)page.value=1重置页码;(4)noMore.value=false重置加载完成标志;(5)nextTick后调用loadMore加载新的第1页;(6)scrollContainerRef.value.scrollTop=0滚动回顶部。重置与加载的顺序确保用户看到的是全新的筛选结果。"

[[criterion]]
name = "错误恢复机制"
description = "[Implicit] 加载失败后的错误展示和重试入口。1:静默失败;2:console.error;3:错误提示;4:错误状态+重试按钮+部分数据保留;5:错误+自动重试+降级+离线缓存。"
type = "likert"
points = 5
weight = 1.0
score = 3
rationale = "useInfiniteScroll.ts中catch分支设置error.value=err.message暴露错误状态。ReportList.vue中v-if=\"error\"展示错误提示卡片和\"点击重试\"按钮，点击调用loadMore重新请求当前页。已加载的数据保留不清空，用户可以查看之前的结果。但未实现自动重试和指数退避，每次都需要用户手动点击。"
