type = "likert"
points = 5
weight = 1.0
score = 3
rationale = "将ExtractionTasksServiceImpl和TasksServiceImpl中的主要for循环save改为saveAll批量保存，但只直接修改了3个文件，CheckResultServiceImpl的循环save未直接处理。"

