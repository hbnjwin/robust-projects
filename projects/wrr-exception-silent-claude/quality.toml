type = "likert"
points = 5
weight = 1.0
score = 4
rationale = "修改了SysOperaLogAspect中三个空catch块，添加了log.error记录审计日志保存失败的异常信息，确保不影响业务主流程的执行。"

[[criterion]]
name = "自定义异常层次建立"
description = "[Explicit] 是否创建了至少3个自定义异常类来区分不同的业务错误场景（如EntityNotFoundException对应404、ServiceUnavailableException对应503、InvalidInputException对应400）。1: 未创建任何自定义异常；2: 只创建了1个通用异常；3: 创建了2个自定义异常；4: 创建了3-4个覆盖主要场景的自定义异常；5: 创建了完整的异常层次并包含基类BizException。"
type = "likert"
points = 5
weight = 1.0
score = 4
rationale = "创建了BizException（业务异常基类）、EntityNotFoundException（404）、ServiceUnavailableException（503）、InvalidInputException（400）四个自定义异常类。"

[[criterion]]
name = "GlobalExceptionHandler增强"
description = "[Explicit] 是否增强了全局异常处理器，为新的自定义异常类添加了对应的@ExceptionHandler方法并返回正确的HTTP状态码。1: 未修改GlobalExceptionHandler；2: 添加了1个handler；3: 添加了2个handler；4: 为所有新异常类都添加了handler并返回正确状态码（404/503/400）；5: handler使用ResponseEntity返回正确状态码且响应格式与已有handler一致。"
type = "likert"
points = 5
weight = 1.0
score = 4
rationale = "为GlobalExceptionHandler添加了三个@ExceptionHandler方法，分别处理EntityNotFoundException(404)、ServiceUnavailableException(503)、InvalidInputException(400)，使用ResponseEntity返回正确HTTP状态码。"

