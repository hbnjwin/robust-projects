[[criterion]]
name = "HTTP状态码语义区分"
description = "[Implicit] 是否在异常层次设计中考虑了HTTP状态码的语义区分，使全局异常处理器能将文档未找到映射到404、OCR服务不可用映射到503、输入格式错误映射到400。1: 所有异常返回同一状态码；2: 区分了500和其他；3: 区分了404和500；4: 区分了404、400、503三种状态码；5: 完整的状态码映射并在异常类中携带状态码信息。"
type = "likert"
points = 5
weight = 1.0
score = 4
rationale = "异常层次设计清晰对应HTTP语义：EntityNotFoundException对应404、ServiceUnavailableException对应503、InvalidInputException对应400，GlobalExceptionHandler中的handler使用ResponseEntity明确返回对应状态码。"

[[criterion]]
