[[criterion]]
name = "root_cause_identification"
description = "数据管道报错根因定位。1:未找到;2:方向错误;3:怀疑数据问题;4:定位到record.get硬编码假设;5:定位根因并分析上游变化影响"
type = "likert"
points = 5
weight = 1.0
score = 4
rationale = "找到amount字段硬编码类型假设的问题"

[[criterion]]
name = "defensive_coding"
description = "防御性编码质量。1:无防御;2:简单null检查;3:类型+null检查;4:多类型兼容+降级处理;5:完整防御含日志和监控"
type = "likert"
points = 5
weight = 1.0
score = 3
rationale = "三层防御(null/Number/String)但实现略显冗余"

[[criterion]]
name = "fix_correctness"
description = "修复正确性。1:错误;2:部分正确;3:基本正确;4:正确;5:正确且健壮"
type = "likert"
points = 5
weight = 1.0
score = 4
rationale = "防御逻辑正确，覆盖了主要异常场景"

[[criterion]]
name = "execution_efficiency"
description = "执行效率。1:大量浪费;2:效率低;3:一般;4:高效;5:最优"
type = "likert"
points = 5
weight = 1.0
score = 2
rationale = "18次工具调用含9次Bash和6次Read，大量冗余操作"

[[criterion]]
name = "error_handling_design"
description = "错误处理设计。1:无处理;2:简单catch;3:分类处理;4:含降级和跳过策略;5:完整含日志告警和指标"
type = "likert"
points = 5
weight = 1.0
score = 3
rationale = "跳过null记录但缺少日志记录"

[[criterion]]
name = "code_exploration"
description = "代码探索。1:未探索;2:表面;3:读了文件;4:理解管道结构;5:深度理解"
type = "likert"
points = 5
weight = 1.0
score = 3
rationale = "读了多个文件探索了项目结构"

[[criterion]]
name = "fix_explanation"
description = "修复说明。1:无;2:简略;3:基本;4:清晰;5:专业"
type = "likert"
points = 5
weight = 1.0
score = 3
rationale = "表格说明了修复策略但较简略"
