[[criterion]]
name = "升级条件评估逻辑"
description = "[Explicit] 是否解读了会员升级的金额+订单数组合判断规则。1: 未分析升级条件；2: 只描述了金额条件；3: 分析了金额和订单数但组合逻辑不清；4: 准确分析了AND组合条件（金额≥X且订单数≥Y）和各等级的具体阈值；5: 升级条件分析完整且考虑了降级保护期和升级通知"
type = "likert"
points = 5
weight = 1.0
score = 4
rationale = "分析了升级条件的AND逻辑和各等级阈值配置，指出了upgrade_rules以字典形式存储各等级条件方便后续调整"

[[criterion]]
name = "时间窗口计算方式"
description = "[Explicit] 是否分析了近12个月使用自然月而非滚动窗口导致权重偏差的问题。1: 未分析时间窗口；2: 提到了12个月但未区分计算方式；3: 区分了自然月和滚动月但影响分析不清楚；4: 准确分析了自然月计算导致月初消费权重被高估的问题；5: 时间窗口分析完整且用具体示例说明了自然月vs滚动月的差异"
type = "likert"
points = 5
weight = 1.0
score = 4
rationale = "用具体示例分析了自然月vs滚动窗口的差异——1月2日消费1万元，如果用自然月（2025年1月-12月），到2025年12月31日评估时这笔消费已经接近12个月仍计入；但如果12月15日评估用滚动12个月（2024年12月15日-2025年12月15日）则不计入。建议改用datetime.now()-timedelta(days=365)滚动窗口"

[[criterion]]
name = "退款等级回退缺失"
description = "[Explicit] 是否分析了购物退款后消费金额减少但等级未回退的漏洞。1: 未分析退款影响；2: 提到了退款但未分析等级回退；3: 分析了退款应扣减累计消费但回退逻辑缺失的原因不清楚；4: 准确定位了升级评估不扣除退款金额的代码位置；5: 漏洞分析完整且给出了退款触发重新评估等级的方案"
type = "likert"
points = 5
weight = 1.0
score = 5
rationale = "在evaluate_upgrade方法中定位了查询SQL——SUM(amount) FROM orders WHERE status='completed'，退款订单status变为refunded后不再被统计，但因为evaluate只在季度末定时执行而非退款时触发，所以退款后到下次评估前等级不会回退。建议在refund_callback中增加实时re-evaluate触发"

[[criterion]]
name = "降级评估机制"
description = "[Explicit] 是否分析了季度末降级评估的保级条件和批量处理逻辑。1: 未分析降级；2: 描述了降级概念但未分析实现；3: 分析了保级条件但批量处理的性能和边界不清楚；4: 分析了保级条件检查和每次降一级的规则；5: 降级评估分析完整含批量处理性能、降级通知和等级冻结保护期"
type = "likert"
points = 5
weight = 1.0
score = 3
rationale = "描述了降级评估的规则和每次降一级的设计，但对批量处理的分页执行和降级后权益立即失效还是有缓冲期的处理未分析"

[[criterion]]
name = "降级通知误发根因"
description = "[Explicit] 是否定位了保级成功用户也收到降级通知邮件的根因。1: 未分析通知误发；2: 提到了误发但未定位根因；3: 分析了通知逻辑但根因不精确；4: 准确定位到评估后通知发送条件判断的代码bug；5: 根因定位精确且给出了修复方案和测试验证"
type = "likert"
points = 5
weight = 1.0
score = 4
rationale = "定位了根因——evaluate_downgrade方法中通知逻辑放在了条件判断的外层（评估完所有会员后批量发通知），但通知列表包含了所有被评估的会员而非只有真正降级的会员。应改为只将downgraded=True的会员加入通知列表"
