[[criterion]]
name = "NProgress响应式更新"
description = "[Explicit] 是否修复onMessage回调中reactive数组push后NProgress组件未响应式更新导致进度条卡在80%的问题。1: 进度条仍卡在约80%不动; 2: 改用ref替代reactive但NProgress绑定方式不对; 3: 数据更新方式修正但NProgress的percentage属性绑定未用computed; 4: CapabilityAssessment.vue中NProgress的percentage绑定computed属性基于响应数组长度除以总设备数实时计算; 5: computed进度加100%时自动停止接收加完成状态视觉反馈"
type = "likert"
points = 5
weight = 1.0
score = 4
rationale = "CapabilityAssessment.vue中NProgress的percentage绑定computed属性，基于respondedDevices.value.length除以totalDevices.value动态计算，每条WebSocket消息到达后数组更新触发computed重新求值"

[[criterion]]
name = "报告数据响应性传递"
description = "[Explicit] 是否修复点击生成报告按钮后响应时间统计表格为空的问题，即toRaw()丢失响应性导致子组件收不到数据。1: 报告中响应时间表格仍为空; 2: 移除toRaw但传递方式仍有问题; 3: 直接传递ref给子组件但未处理深层响应性; 4: 移除toRaw()直接传递reactive/ref数据给报告子组件，子组件通过props正确接收响应式数据; 5: 响应式传递加子组件watch监听数据变化加报告内容动态更新"
type = "likert"
points = 5
weight = 1.0
score = 4
rationale = "CapabilityAssessment.vue中移除了传递给报告子组件时的toRaw()调用，直接将testResults ref传递给子组件的props，子组件通过defineProps接收后响应式数据正常渲染"

[[criterion]]
name = "连续测试结果隔离"
description = "[Explicit] 是否在发起新测试前清空上一次的testResults数组，防止两次测试结果混在一起。1: 连续测试结果仍然混合; 2: 清空了数组但时机不对在测试结束后才清; 3: 测试开始时清空testResults但未清空进度相关状态; 4: startTest函数入口同时清空testResults数组和进度计数器再发起新测试; 5: 完整重置含testResults清空加进度归零加UI状态复位加上一次WebSocket订阅取消"
type = "likert"
points = 5
weight = 1.0
score = 4
rationale = "CapabilityAssessment.vue的startTest方法开头执行testResults.value=[]和respondedCount.value=0，确保每次发起测试前完整清空上一次数据"

[[criterion]]
name = "WebSocket消息批量处理"
description = "[Implicit] 是否确保高频WebSocket消息到达时设备响应数据的完整性和界面更新一致性。1: 每条消息都触发独立渲染导致卡顿且丢数据; 2: 使用nextTick但时机不对; 3: 利用Vue3自动批量更新机制基本可用; 4: onMessage中解析设备响应消息后立即更新reactive数组，利用Vue3的批量更新保证UI一致性; 5: 消息处理加防抖加数据校验加断线重连后补发"
type = "likert"
points = 5
weight = 1.0
score = 4
rationale = "WebSocket onMessage回调中解析消息类型后将设备响应数据push到数组，Vue3的响应式系统自动批量合并同一tick内的多次更新，界面刷新一致"

[[criterion]]
name = "测试状态生命周期管理"
description = "[Implicit] 是否正确管理测试的开始、进行中、完成三个状态及其对应的UI反馈。1: 无状态管理测试过程中UI无变化; 2: 有isLoading但未区分测试阶段; 3: 区分开始和完成但进行中状态处理不完整; 4: testStatus枚举区分idle/testing/completed三种状态，界面按钮和进度条联动正确; 5: 状态管理加异常状态处理加超时自动结束加用户可手动终止"
type = "likert"
points = 5
weight = 1.0
score = 3
rationale = "CapabilityAssessment.vue中通过testStatus ref管理测试状态，测试开始时设为testing禁用按钮显示进度条，完成时设为completed恢复界面"
