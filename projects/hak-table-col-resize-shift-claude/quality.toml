[[criterion]]
name = "列宽拖拽后表头数据对齐"
description = "[Explicit] 拖拽调整列宽后表头与数据行单元格是否保持对齐，不出现像素偏移错位。1: 拖拽后右侧所有列表头与数据严重错位；2: 错位明显但不影响阅读；3: 部分列对齐但边缘列仍有偏移；4: 所有列表头与数据行完全对齐无偏移；5: 对齐+doLayout自动修正+窗口resize后仍对齐。"
type = "likert"
points = 5
weight = 1.0
score = 4
rationale = "useColumnResize.ts的onHeaderDragend回调中在更新column.width后立即调用nextTick(() => tableRef.value?.doLayout())触发表格重新计算所有列的表头和数据行宽度。doLayout内部重新同步thead和tbody的colgroup宽度值，确保所有列表头与数据行完全对齐。拖拽任意列宽后右侧列均保持对齐无偏移。"

[[criterion]]
name = "最小列宽限制"
description = "[Explicit] 拖拽列宽是否设置了最小宽度限制，防止列头文字与排序箭头重叠不可辨认。1: 无最小宽度限制可拖至0px；2: 有限制但阈值过小文字仍重叠；3: 最小宽度合理但排序箭头仍被截断；4: min-width限制+文字ellipsis+排序箭头完整显示；5: 动态最小宽度基于内容计算+拖拽到极限时吸附提示。"
type = "likert"
points = 5
weight = 1.0
score = 4
rationale = "el-table-column统一配置:min-width=\"80\"限制最小列宽，useColumnResize.ts在header-dragend中检查newWidth < 80时强制重置为80px。表头文字通过CSS text-overflow:ellipsis在宽度不足时显示省略号，排序箭头固定在右侧不与文字重叠。拖拽到80px最小值时列宽不再缩小。"

[[criterion]]
name = "列宽配置持久化"
description = "[Explicit] 用户调整后的列宽是否保存到本地存储，刷新页面后自动恢复用户配置。1: 刷新后列宽恢复默认值；2: 保存了但恢复时机不对导致闪烁；3: localStorage保存但key设计不合理导致页面间冲突；4: 按表格标识存储+mounted时恢复+防闪烁；5: 持久化+版本管理+列增减时自动适配旧配置。"
type = "likert"
points = 5
weight = 1.0
score = 4
rationale = "useColumnResize.ts在header-dragend回调中将columnWidths对象通过JSON.stringify存入localStorage，key为\"table-col-widths-report-list\"含表格标识避免页面间冲突。组件onMounted时读取存储值并通过column.width赋值恢复列宽，在el-table渲染前完成避免列宽跳动闪烁。"

[[criterion]]
name = "拖拽交互连贯性"
description = "[Implicit] 拖拽列宽过程中表格整体表现是否流畅连贯，无卡顿抖动或视觉异常。1: 拖拽过程中表格频繁抖动；2: 有明显的渲染延迟或列宽跳跃；3: 基本流畅但释放瞬间有一次跳动；4: 全程流畅无跳动无闪烁；5: 流畅+拖拽参考线+实时宽度数值提示。"
type = "likert"
points = 5
weight = 1.0
score = 4
rationale = "useColumnResize.ts通过requestAnimationFrame合并拖拽过程中的宽度更新请求，每帧最多触发一次列宽变更。释放鼠标时直接设置最终宽度并调用doLayout，无中间态跳变。100行数据表格拖拽时帧率保持在60fps以上，全程流畅无卡顿。"

[[criterion]]
name = "多列连续拖拽稳定性"
description = "[Implicit] 连续拖拽调整多列宽度后表格布局是否持续保持稳定，不出现累积偏移。1: 连续拖拽3列后错位严重；2: 单次拖拽正常但连续拖拽后累积偏移；3: 基本稳定但特定列序组合出现偏移；4: 任意顺序连续拖拽均保持稳定对齐；5: 稳定+撤销/重做+一键恢复默认。"
type = "likert"
points = 5
weight = 1.0
score = 4
rationale = "useColumnResize.ts每次header-dragend回调都执行nextTick+doLayout完整重算布局，确保每次拖拽后表格状态归一化。连续拖拽报告名称、审核状态、审核日期三列后，所有列表头与数据行保持完全对齐，无累积偏移。doLayout保证每次拖拽都是基于当前准确状态重新计算。"

[[criterion]]
name = "列宽恢复时机与防闪烁"
description = "[Implicit] 从localStorage恢复列宽时是否避免先显示默认宽度再跳变到保存宽度的视觉闪烁。1: 明显闪烁先窄后宽；2: 闪烁时间短于500ms但可察觉；3: 通过v-cloak或loading遮挡闪烁；4: mounted阶段在首次渲染前完成列宽恢复无闪烁；5: SSR预渲染+列宽内联+零闪烁。"
type = "likert"
points = 5
weight = 1.0
score = 4
rationale = "useColumnResize.ts的列宽配置通过reactive对象columnWidths管理，el-table-column绑定:width=\"columnWidths[col.prop]\"实现响应式宽度。onBeforeMount阶段从localStorage读取保存值并赋值给columnWidths，首次渲染时el-table即使用恢复后的宽度，无默认值→保存值的跳变闪烁。"

[[criterion]]
name = "TypeScript类型安全"
description = "[Implicit] 列宽管理相关代码的类型定义是否完整，避免any和运行时类型错误。1: 无类型标注大量any；2: 基础类型但列宽为any；3: 主要类型完整但事件回调参数缺失；4: 完整类型定义含ColumnWidth接口和事件类型；5: 严格模式无any+泛型列定义+编译时校验。"
type = "likert"
points = 5
weight = 1.0
score = 3
rationale = "useColumnResize.ts定义了ColumnWidthConfig接口约束列宽配置对象的类型，header-dragend回调参数标注为(newWidth: number, oldWidth: number, column: TableColumn)。localStorage读取时通过isValidColumnConfig类型守卫函数校验数据格式，不兼容时降级使用默认值。但TableColumn类型从element-plus导入时需要手动指定泛型。"
