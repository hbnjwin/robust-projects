[[criterion]]
name = "对账数据流梳理"
description = "[Explicit] 是否完整描述了对账脚本从账单解析到差异输出的完整数据流程。1: 未描述数据流；2: 只描述了部分流程；3: 覆盖了解析和匹配但缺少差异分类环节；4: 完整描述了解析→标准化→匹配→差异分类→输出的全流程；5: 数据流分析完整且包含多支付渠道的格式差异处理和容错机制"
type = "likert"
points = 5
weight = 1.0
score = 2
rationale = "描述了对账的基本流程但对多支付渠道的账单格式差异处理分析粗略，未区分支付宝CSV格式和微信XML格式的具体解析逻辑差异"

[[criterion]]
name = "匹配算法解读"
description = "[Explicit] 是否解释了交易记录匹配的主键选择和模糊匹配策略。1: 未分析匹配算法；2: 仅提到按交易号匹配；3: 分析了主键匹配但未考虑异常情况（如重复交易号）；4: 分析了主键匹配和金额容差匹配两种策略；5: 匹配算法分析完整且处理了时间偏移、金额四舍五入差异和退款匹配"
type = "likert"
points = 5
weight = 1.0
score = 2
rationale = "仅提到了按交易号做一对一匹配，对模糊匹配和金额容差策略几乎未涉及，退款记录的关联匹配也未分析"

[[criterion]]
name = "性能瓶颈分析"
description = "[Explicit] 是否定位了3000万条记录处理4小时的性能瓶颈原因。1: 未分析性能；2: 笼统说数据量大；3: 定位到某个环节但未量化分析；4: 定位到具体瓶颈（如全表扫描或内存加载）并给出优化方案；5: 多个瓶颈定位准确并给出分批处理、索引优化、流式读取等具体方案"
type = "likert"
points = 5
weight = 1.0
score = 3
rationale = "指出了全量加载到内存和逐条匹配是主要瓶颈，建议用数据库JOIN替代内存匹配，但未量化分析各环节耗时占比"

[[criterion]]
name = "重复推送事故根因"
description = "[Explicit] 是否分析了支付宝同一笔交易推送两条记录导致误报多账的根因。1: 未分析；2: 提到了重复但未分析原因；3: 分析了去重缺失但未说明支付宝重复推送的业务原因；4: 分析了去重逻辑缺失和支付宝通知重试机制的关联；5: 完整分析了重复场景的检测方案和对账脚本应有的幂等性处理"
type = "likert"
points = 5
weight = 1.0
score = 3
rationale = "指出对账脚本在解析账单时没有按交易号去重，导致同一笔交易的两条记录分别和订单表匹配，其中一条匹配成功另一条找不到对应订单被标为多账"

[[criterion]]
name = "跨日对不上根因"
description = "[Explicit] 是否分析了退款时间跨日导致对账不匹配的根因。1: 未分析；2: 提到了时间差但未分析根因；3: 识别了对账日期截止时间不一致的问题；4: 分析了退款发起时间和到账时间的差异导致跨日；5: 完整分析了跨日场景并提出了T+1对账窗口扩展和退款状态回溯方案"
type = "likert"
points = 5
weight = 1.0
score = 3
rationale = "识别了退款记录在我方系统记录的是发起时间（T日23时），但支付宝账单记录的是到账时间（T+1日），导致T日对账时我方有退款记录但支付宝账单中没有"
