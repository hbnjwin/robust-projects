type = "likert"
points = 5
weight = 1.0
score = 3
rationale = "将业务逻辑迁移到TasksServiceImpl和AiServiceImpl，理论上可独立测试，但TasksServiceImpl新增了5个依赖注入，方法间的职责划分可能不够细粒度。"
