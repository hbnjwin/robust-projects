type = "likert"
points = 5
weight = 1.0
score = 2
rationale = "Qwen共44次操作，其中Read 15次和Glob 8次用于分析源码提取表结构和依赖信息，Write 9次创建文件，虽然源码分析较彻底但操作次数偏多"
