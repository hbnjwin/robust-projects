[[criterion]]
name = "JSON日志格式"
description = "[Explicit] 是否增强utils/logger.py支持JSON格式输出且每条日志包含timestamp、level、module、message和extra字段。1:未修改logger.py;2:修改了但无JSON格式;3:JSON格式输出含timestamp和level;4:完整JSON格式含timestamp、level、module、message和extra五个字段;5:JSON日志含自定义字段扩展和schema验证"
type = "likert"
points = 5
weight = 1.0
score = 4
rationale = "logger.py中使用pythonjsonlogger.JsonFormatter配置JSON格式输出，每条日志自动包含timestamp、level、module、message字段，extra通过logger.info的extra参数传入"

[[criterion]]
name = "关联ID追踪"
