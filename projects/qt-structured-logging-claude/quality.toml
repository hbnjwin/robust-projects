type = "likert"
points = 5
weight = 1.0
score = 4
rationale = "logger.py中实现CorrelationFilter通过threading.local存储run_id，提供set_run_id上下文管理器在回测入口自动生成UUID作为关联ID"

[[criterion]]
name = "print替换覆盖"
description = "[Explicit] 是否将core/oms.py、live/replay_engine_v5.py、data/import_full_market_akshare.py三个关键模块的print替换为logger调用。1:未替换任何print;2:替换了1个文件;3:替换了2个文件的主要print;4:三个文件的print均替换为logger.info/warning/error;5:三个文件完整替换含日志级别正确分配"
type = "likert"
points = 5
weight = 1.0
score = 4
