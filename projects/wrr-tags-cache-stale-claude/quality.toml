[[criterion]]
name = "Keep-alive缓存与URL同步"
description = "[Explicit] keep-alive缓存的组件状态与URL query参数不同步的根因定位。1:未识别缓存与URL的不同步;2:知道筛选不一致但归因错误;3:定位到onActivated但未关联route.query;4:准确分析keep-alive恢复缓存状态但未从route.query重新同步queryParams;5:精准定位并提出了onActivated中从route.query恢复参数的方案"
type = "likert"
points = 5
weight = 1.0
score = 4
rationale = "准确分析UserList.vue中keep-alive缓存了旧的queryParams状态，而URL上的query参数已随标签页操作变化"

[[criterion]]
name = "Activated参数恢复"
description = "[Explicit] onActivated中是否从route.query恢复queryParams。1:未处理参数恢复;2:恢复了但覆盖不完整;3:恢复了主要参数但遗漏了分页;4:完整恢复queryParams后调用刷新列表;5:恢复参数并对比是否有变化，只在变化时刷新"
type = "likert"
points = 5
weight = 1.0
score = 4
rationale = "onActivated中从route.query恢复queryParams（筛选条件+分页），然后调用getList刷新表格数据"

[[criterion]]
name = "筛选表格一致性"
description = "[Explicit] 筛选表单与表格数据是否一致。1:筛选和表格完全不一致;2:首次加载一致但切换后不一致;3:标签页切换后基本一致但偶有不同步;4:标签页切换后筛选和表格完全同步;5:全场景一致含浏览器前进后退"
type = "likert"
points = 5
weight = 1.0
score = 4
rationale = "筛选表单从route.query恢复后立即刷新列表，确保表单显示和表格数据完全一致"

[[criterion]]
name = "路由参数双向同步"
description = "[Explicit] 路由query参数与组件状态的双向同步。1:未实现同步;2:只实现了组件→URL的单向;3:实现了双向但有竞态;4:正确实现双向同步：筛选变化→更新URL，标签切入→从URL恢复;5:完善的双向同步含debounce防抖"
type = "likert"
points = 5
weight = 1.0
score = 4
rationale = "实现了queryParams变化时router.push更新URL + onActivated时从route.query恢复的双向同步"

[[criterion]]
name = "重置筛选处理"
description = "[Explicit] 重置筛选按钮的行为是否正确。1:重置后筛选和数据仍不一致;2:重置了表单但URL未更新;3:重置了表单和URL但表格未刷新;4:重置表单→清空URL query→刷新列表三步完整;5:完整重置含分页重置回第1页"
type = "likert"
points = 5
weight = 1.0
score = 4
