description = "[Explicit] 修复TDesign t-dropdown的@click事件处理，正确接收dropdown value而非原始row对象。1: 未修复；2: 改了但事件仍不触发；3: 能触发但参数类型不对；4: 正确理解TDesign dropdown @click只传value并做相应处理；5: 修复并添加了类型校验"
type = "likert"
points = 5
weight = 1.0
score = 3
rationale = "修改expert-database/index.vue中t-dropdown的@click事件绑定，将clickHandler(data)改为通过闭包传入row，但过程中25次工具调用（含3次Agent委托和4次TaskUpdate）显示修复过程不够直接"

[[criterion]]
name = "行数据传递"
