[[criterion]]
name = "切换页面表单持久化"
description = "[Explicit] 是否修复v-if销毁组件后表单数据丢失的问题。1: 切换后数据仍丢失; 2: 用keep-alive但配置不当; 3: 暂存到store但恢复时机有误; 4: 表单数据保存到Pinia store组件重新mount时从store恢复; 5: 持久化方案支持sessionStorage防止意外刷新丢失"
type = "likert"
points = 5
weight = 1.0
score = 4
rationale = "securitySettings.ts store保存表单数据，SecuritySettings.vue onMounted时从store恢复状态"

[[criterion]]
name = "保存后表单刷新"
description = "[Explicit] 是否修复保存成功后页面表单值未更新为后端返回数据的问题。1: 保存后表单仍显示旧的用户输入; 2: 刷新了部分字段; 3: 用响应数据覆盖但存在字段遗漏; 4: 保存API返回后用响应数据覆盖表单reactive对象的所有字段; 5: 覆盖后同步更新store持久化层确保一致"
type = "likert"
points = 5
weight = 1.0
score = 4
rationale = "SecuritySettings.vue的save方法在API响应后用Object.assign将返回值写回formData确保表单显示最新状态"

[[criterion]]
name = "跨Tab恢复默认"
description = "[Explicit] 是否修复恢复默认按钮只作用于当前可见tab的问题。1: 恢复默认仍只影响当前tab; 2: 两个tab都重置但方式不正确; 3: 重置所有字段但未触发表单校验清除; 4: resetFields操作所有字段而非仅DOM可见字段或直接赋默认值对象覆盖整个formData; 5: 覆盖完整默认值后清除校验状态并同步store"
type = "likert"
points = 5
weight = 1.0
score = 4
rationale = "SecuritySettings.vue通过直接将默认值对象赋给formData而非依赖resetFields确保两个tab的字段都被恢复"

[[criterion]]
name = "多Tab表单结构"
description = "[Implicit] 是否正确处理NTabs下多tab表单的数据结构和校验。1: 表单数据结构混乱; 2: 分tab但数据未统一管理; 3: 统一reactive但tab切换时校验有问题; 4: 单个formData对象覆盖所有tab字段且校验规则对隐藏tab有效; 5: 表单结构清晰支持20多个字段且tab间数据无干扰"
type = "likert"
points = 5
weight = 1.0
score = 4
rationale = "SecuritySettings.vue使用统一的reactive formData覆盖两个tab的所有字段且校验规则全局生效"

