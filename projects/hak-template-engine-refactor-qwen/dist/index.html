<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>风电报告审核系统</title>

    <!--
      FOUC 防护 (Bug 4 修复)
      此同步阻塞脚本在任何 CSS 解析和 JS 模块加载之前执行。
      读取 localStorage 中保存的主题偏好，立即在 <html> 上设置 dark class，
      确保首帧绘制就是正确的主题，不会出现亮色闪烁。
      必须是 inline script（不能是 module，不能 defer，不能外部引用）。
    -->
    <script>
      ;(function () {
        var t = localStorage.getItem('app-theme')
        if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark')
        }
      })()
    </script>
    <script type="module" crossorigin src="/assets/index-BukMLwm6.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-DeQrpIs-.css">
  </head>
  <body>
    <div id="app"></div>
  </body>
</html>
