[[criterion]]
name = "断线自动重连"
description = "[Explicit] Speech SDK WebSocket断开后自动重连（指数退避，上限次数）。1:断线后完全不重连;2:重连但无退避策略;3:指数退避重连;4:退避+次数上限+UI提示;5:完整重连含session恢复"
type = "likert"
points = 5
weight = 1.0
score = 3
rationale = "useSpeechRecognition.ts实现了onCanceled事件检测ConnectionFailure后自动创建新SpeechRecognizer实例，但重连间隔固定3秒没有指数退避，也没有最大重试次数限制"

[[criterion]]
name = "中间结果保存"
description = "[Explicit] 断线时已识别的中间结果（interim results）不丢失。1:断线后全部丢失;2:最终结果保留但中间结果丢;3:中间结果缓存到内存;4:缓存到内存+sessionStorage;5:缓存+重连后无缝拼接"
type = "likert"
points = 5
weight = 1.0
score = 3
rationale = "useSpeechRecognition.ts中recognizing事件（中间结果）和recognized事件（最终结果）都写入transcriptBuffer ref数组，断线时buffer数据保留在内存中不丢失，但刷新页面后丢失"

[[criterion]]
name = "UI状态同步"
description = "[Explicit] 按钮状态正确反映当前识别/断线/重连状态，不出现'正在识别'但实际已断的情况。1:状态不同步;2:部分状态同步;3:基本同步但过渡状态缺失;4:完整状态同步;5:状态机驱动含动画过渡"
type = "likert"
points = 5
weight = 1.0
score = 3
rationale = "VoiceInputButton.vue通过isRecording/isReconnecting两个ref控制按钮文字和颜色，但从'识别中'切到'已断开'有约2秒延迟——因为canceled事件触发晚于实际断线"

[[criterion]]
name = "离线降级"
description = "[Implicit] 完全无网络时的友好降级处理。1:无限重试刷屏;2:停止重试但无提示;3:提示'网络不可用';4:提示+建议手动输入;5:完整离线方案含已识别内容保护"
type = "likert"
points = 5
weight = 1.0
score = 2
rationale = "useSpeechRecognition.ts重连失败5次后停止但UI上按钮变成disabled状态无任何文字提示，用户不知道发生了什么"

[[criterion]]
name = "多浏览器兼容"
description = "[Implicit] Speech SDK WebSocket在不同浏览器上的行为一致性。1:只在Chrome工作;2:Chrome+Edge;3:主流桌面浏览器;4:桌面+移动端Safari;5:全平台含降级方案"
type = "likert"
points = 5
weight = 1.0
score = 2
rationale = "VoiceInputButton.vue没有做浏览器兼容性检测，在Safari上WebSocket握手超时后没有触发canceled事件导致UI卡死"
