[[criterion]]
name = "升级条件评估逻辑"
description = "[Explicit] 是否解读了会员升级的金额+订单数组合判断规则。1: 未分析升级条件；2: 只描述了金额条件；3: 分析了金额和订单数但组合逻辑不清；4: 准确分析了AND组合条件（金额≥X且订单数≥Y）和各等级的具体阈值；5: 升级条件分析完整且考虑了降级保护期和升级通知"
type = "likert"
points = 5
weight = 1.0
score = 4
rationale = "在member_tier.py中分析了evaluate_upgrade方法的升级条件——银卡（消费≥1000且≥5单）、金卡（≥5000且≥20单）、钻石（≥20000且≥50单），两个条件必须同时满足（AND逻辑）"

[[criterion]]
name = "时间窗口计算方式"
description = "[Explicit] 是否分析了近12个月使用自然月而非滚动窗口导致权重偏差的问题。1: 未分析时间窗口；2: 提到了12个月但未区分计算方式；3: 区分了自然月和滚动月但影响分析不清楚；4: 准确分析了自然月计算导致月初消费权重被高估的问题；5: 时间窗口分析完整且用具体示例说明了自然月vs滚动月的差异"
type = "likert"
points = 5
weight = 1.0
score = 3
rationale = "分析了get_qualifying_period方法用calendar month起止日期计算近12个月的范围，指出了月初大量消费在下个月评估时仍在窗口内但实际已近13个月前的权重偏差问题"

[[criterion]]
name = "退款等级回退缺失"
description = "[Explicit] 是否分析了购物退款后消费金额减少但等级未回退的漏洞。1: 未分析退款影响；2: 提到了退款但未分析等级回退；3: 分析了退款应扣减累计消费但回退逻辑缺失的原因不清楚；4: 准确定位了升级评估不扣除退款金额的代码位置；5: 漏洞分析完整且给出了退款触发重新评估等级的方案"
type = "likert"
points = 5
weight = 1.0
score = 3
rationale = "分析了升级评估查询累计消费时直接SUM(order_amount)未排除已退款订单，导致退款后消费金额虚高但等级不回退"

[[criterion]]
name = "降级评估机制"
description = "[Explicit] 是否分析了季度末降级评估的保级条件和批量处理逻辑。1: 未分析降级；2: 描述了降级概念但未分析实现；3: 分析了保级条件但批量处理的性能和边界不清楚；4: 分析了保级条件检查和每次降一级的规则；5: 降级评估分析完整含批量处理性能、降级通知和等级冻结保护期"
type = "likert"
points = 5
weight = 1.0
score = 3
rationale = "分析了季度末定时任务evaluate_downgrade遍历所有非普通等级会员检查保级条件，不满足则降一级（钻石→金卡→银卡→普通），但对百万级会员的批量处理性能和降级通知机制未分析"

