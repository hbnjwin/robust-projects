[[criterion]]
name = "缓存Key生成策略"
description = "[Explicit] 缓存key生成逻辑是否正确修复,能否根据分支名+依赖哈希生成唯一key确保缓存精准命中。1:未修改key生成逻辑;2:key格式不合理或缺少关键因子;3:基本可用但缺少部分因子(如target);4:key包含分支+依赖哈希,逻辑完整;5:key设计精准,支持多种lock文件,命中率最优"
type = "likert"
points = 5
weight = 1.0
score = 4
rationale = "cache key用BRANCH_SAFE-deps-DEPS_HASH格式,基于package-lock.json哈希,逻辑正确"

[[criterion]]
name = "分支缓存隔离"
description = "[Explicit] 不同分支的缓存是否通过独立目录实现物理隔离——仅评估分支间隔离能力,不涉及同分支并行锁。1:所有分支共用一个缓存目录;2:仅靠key前缀区分,无目录隔离;3:有分支命名空间但未做目录级隔离;4:分支独立缓存目录,物理隔离完整;5:独立目录+缓存大小监控+自动清理过期分支缓存"
type = "likert"
points = 5
weight = 1.0
score = 5
rationale = "分支独立缓存目录,物理隔离完整,不同分支缓存互不干扰"

[[criterion]]
name = "并行构建保护"
description = "[Explicit] 同一分支并行构建时是否有锁机制防止缓存读写冲突——仅评估并行构建的互斥保护,不涉及分支间隔离。1:无任何锁或并行控制机制;2:仅文档或注释提及需注意并行但无实现;3:有基本锁但不完善(如仅锁写不锁读);4:flock文件锁或CI级disableConcurrentBuilds二选一;5:flock文件锁+CI disableConcurrentBuilds双重保护"
type = "likert"
points = 5
weight = 1.0
score = 5
rationale = "flock文件锁保护缓存读写+Jenkins disableConcurrentBuilds双重保护"

[[criterion]]
name = "镜像源配置"
description = "[Explicit] 是否在.npmrc或构建脚本中正确配置了国内镜像源地址替代默认npm源。1:未配置任何镜像源;2:配置了但地址或格式有误;3:配置正确的镜像地址但无备用源;4:.npmrc配置镜像且有主备源切换;5:镜像配置持久化且有可达性探测自动切换"
type = "likert"
points = 5
weight = 1.0
score = 5
rationale = ".npmrc持久化配置npmmirror镜像源+build.sh有curl可达性探测+主备源自动切换+配置持久化"

[[criterion]]
name = "重试容错"
description = "[Explicit] npm install命令失败后是否有自动重试和退避等待机制。1:失败后直接报错退出;2:简单循环重试无等待间隔;3:有固定间隔重试;4:指数退避重试如5秒10秒20秒;5:指数退避加最大重试次数加超时配置加失败日志"
type = "likert"
points = 5
weight = 1.0
score = 1
rationale = "npm install失败后直接报错退出,无重试退避机制"

[[criterion]]
name = "缓存命中率提升"
description = "[Explicit] 修复后缓存命中率能否从零有效提升——题目核心问题是缓存命中率为零,需要验证修复后的缓存存储恢复机制和生命周期管理是否能确保后续构建命中缓存。1:未解决命中率问题;2:key逻辑修复但缺少缓存生命周期管理;3:key正确+存储恢复机制但无过期策略;4:key正确+存储恢复+过期清理机制;5:完整的缓存命中保障含key+存储+恢复+过期清理+命中率校验"
type = "likert"
points = 5
weight = 1.0
score = 4
rationale = "key修复+缓存存储恢复机制完整,有CACHE_MAX_AGE_DAYS过期清理防止缓存膨胀"

[[criterion]]
name = "Jenkinsfile集成"
description = "[Explicit] Jenkinsfile流水线集成质量,构建脚本是否能在CI环境中实际可用且一次写出无返工。1:未修改Jenkinsfile;2:Jenkinsfile有语法错误或逻辑缺陷;3:可用但有返工或冗余;4:一次写出合理pipeline,有timeout等保护;5:pipeline结构清晰,缓存/构建/报告分阶段,有完善的异常处理"
type = "likert"
points = 5
weight = 1.0
score = 5
rationale = "pipeline结构清晰,分阶段组织Checkout/Build/Report,有timeout(30min)、disableConcurrentBuilds和完善的异常处理"
