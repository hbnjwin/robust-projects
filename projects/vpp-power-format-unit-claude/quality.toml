[[criterion]]
name = "Tooltip原始值格式化"
description = "[Explicit] 是否修复Dashboard总功率卡片的tooltip显示原始瓦特值而非格式化的MW值。1: tooltip仍显示原始850000 W; 2: 调用了格式化但单位转换系数错误; 3: 正确调用formatPowerMw但tooltip模板绑定位置不对; 4: tooltip的content绑定调用formatPowerMw()显示如0.85 MW; 5: tooltip格式化加悬停时显示完整精度如850.000 kW的补充信息"
type = "likert"
points = 5
weight = 1.0
score = 4
rationale = "Dashboard.vue中KPI卡片的tooltip内容绑定formatPowerMw()函数，原始值经过除以1000000转换后按MW单位格式化显示与卡片数值一致"

[[criterion]]
name = "资源列表单位归一化"
description = "[Explicit] 是否修复资源列表中额定功率列显示单位不统一的问题，有的显示kW有的显示MW。1: 仍然kW和MW混合显示; 2: 统一了单位但转换系数错误; 3: 统一为MW显示但小功率资源精度丢失如0.00 MW; 4: ResourceList.vue中功率列统一调用formatPower函数根据数值大小自动选择kW或MW单位; 5: 自动单位选择加保留有效数字加原始值tooltip提示"
type = "likert"
points = 5
weight = 1.0
score = 4
rationale = "ResourceList.vue中功率列统一通过formatPower函数处理，函数内部先将所有输入归一化为kW基准单位再根据数值大小选择显示为kW或MW"

[[criterion]]
name = "空值安全防护"
description = "[Explicit] 是否修复formatPowerMw传入null或undefined时返回NaN MW的问题。1: 仍返回NaN MW; 2: 判断null但遗漏undefined和NaN; 3: 入口判断null和undefined和NaN统一返回0.00 MW; 4: toSafeNumber工具函数处理所有非数值输入含Infinity; 5: 安全函数加TypeScript联合类型参数声明区分number和nullable输入"
type = "likert"
points = 5
weight = 1.0
score = 4
rationale = "formatPowerMw函数入口通过value == null或Number.isNaN(value)守卫判断，非法输入统一返回0.00 MW，参数类型声明为number或null或undefined联合类型"

[[criterion]]
name = "负零显示消除"
description = "[Explicit] 是否处理极小负数如-0.000001格式化后显示为-0.00 MW的问题。1: 仍显示-0.00 MW; 2: 用Math.abs但改变了正常负数的显示; 3: 格式化后字符串检查是否为-0.00并替换; 4: 格式化前对绝对值小于显示精度阈值的数做归零处理; 5: 阈值与toFixed精度联动加不影响正常负值显示加充放电场景正负号保留"
type = "likert"
points = 5
weight = 1.0
score = 4
rationale = "formatPowerMw中对转换后的MW值检查绝对值是否小于0.005即toFixed(2)的精度阈值，若是则置为0避免-0.00显示且不影响正常负值如-5.00的显示"

[[criterion]]
name = "格式化函数一致性"
description = "[Implicit] 是否确保所有页面调用power.ts时使用统一的格式化接口而非各自实现转换逻辑。1: 不同页面各自实现格式化逻辑存在不一致; 2: 部分页面调用power.ts部分内联转换; 3: 所有页面调用power.ts但传参方式不统一; 4: Dashboard和ResourceList统一从utils/power导入并调用formatPowerMw; 5: 统一接口加自动单位选择kW/MW/GW加国际化支持"
type = "likert"
points = 5
weight = 1.0
score = 4
rationale = "Dashboard.vue和ResourceList.vue统一从utils/power导入formatPowerMw和相关转换函数，调用方式一致确保所有页面单位显示统一"
