[[criterion]]
name = "删除撤销完整性"
description = "[Explicit] 撤销删除节点操作时是否同时恢复被级联删除的连线。1:仅恢复节点;2:恢复节点+部分连线;3:恢复全部但顺序错误;4:节点+全部关联边完整恢复;5:恢复+位置+选中态+动画。"
type = "likert"
points = 5
weight = 1.0
score = 3
rationale = "useUndoRedo.ts的RemoveNodeCommand在undo时恢复了节点数据，也尝试恢复关联连线，但连线的恢复逻辑在构造时仅通过getConnectedEdges获取直接连线，未考虑通过中间节点间接关联的边。对于链式流程A→B→C删除B时，A→B和B→C两条边恢复了但可能丢失额外的级联关系。"

[[criterion]]
name = "批量操作原子性"
description = "[Explicit] 框选多节点拖动后Ctrl+Z是否一次性撤销整个批量操作。1:每个节点独立撤销;2:部分合并但不完整;3:合并但触发时机不准;4:CompositeCommand完整原子操作;5:原子+动画过渡+批量redo。"
type = "likert"
points = 5
weight = 1.0
score = 2
rationale = "useUndoRedo.ts中onNodesChange监听nodeDragged事件，每个节点的位置变化独立创建MoveNodeCommand推入历史栈。框选5个节点拖动产生5条独立的历史记录，Ctrl+Z仅撤销最后一个节点的移动。WorkflowEditor.vue中未实现批量操作的事务合并机制。"

[[criterion]]
name = "历史栈边界保护"
description = "[Explicit] 连续undo到最开始后继续按Ctrl+Z是否安全不报错。1:直接崩溃;2:报错但不崩溃;3:静默忽略;4:边界检查+按钮禁用;5:禁用+提示+完整空栈保护。"
type = "likert"
points = 5
weight = 1.0
score = 3
rationale = "useUndoRedo.ts的undo方法添加了if(undoStack.length===0) return的长度检查，防止从空数组pop时产生undefined导致的Cannot read properties异常。但WorkflowEditor.vue的工具栏undo按钮未绑定disabled状态，用户可以点击无效的撤销按钮造成困惑。"

[[criterion]]
name = "redo栈管理"
description = "[Explicit] 执行新操作后redo栈是否正确清空，避免redo到不一致状态。1:redo栈从不清空;2:部分场景清空;3:push时清空但有遗漏;4:所有push操作统一清空redo栈;5:清空+确认提示+分支历史。"
type = "likert"
points = 5
weight = 1.0
score = 2
rationale = "useUndoRedo.ts中execute方法将新命令push到undoStack，但未在push前清空redoStack。用户执行undo后做了新操作，redo栈中仍保留旧的已撤销命令，按Ctrl+Y会恢复到与当前状态不一致的历史节点，导致流程图出现幽灵节点或丢失连线。"

[[criterion]]
name = "命令模式设计"
description = "[Implicit] Command设计模式的接口定义、具体命令类、调用者的架构质量。1:无命令模式;2:简单函数式;3:有Command但职责不清;4:清晰的Command接口+具体命令类;5:Command+Composite+Memento完整模式。"
type = "likert"
points = 5
weight = 1.0
score = 3
rationale = "useUndoRedo.ts中定义了Command接口包含execute/undo方法，实现了MoveNodeCommand和RemoveNodeCommand两个具体命令。但命令类内部直接引用vue-flow的useVueFlow返回值，与框架耦合较深。缺少CompositeCommand用于批量操作，命令的序列化和持久化也未考虑。"

[[criterion]]
name = "测试覆盖"
description = "[Implicit] undo/redo核心逻辑的单元测试或集成测试覆盖情况。1:无测试;2:手动验证;3:少量测试;4:核心路径覆盖;5:完整覆盖含边界case。"
type = "likert"
points = 5
weight = 1.0
score = 1
rationale = "项目中未创建任何vitest或jest测试文件。undo/redo的核心逻辑（命令执行、撤销、重做、栈管理、边界保护）完全依赖手动在浏览器中操作验证，无自动化回归保障。4个bug的修复均缺少对应的测试用例。"

[[criterion]]
name = "深拷贝处理"
description = "[Implicit] 命令记录的历史状态是否通过深拷贝避免引用篡改。1:直接引用;2:浅拷贝;3:JSON.parse(JSON.stringify);4:structuredClone;5:Immer或自定义clone+冻结。"
type = "likert"
points = 5
weight = 1.0
score = 2
rationale = "useUndoRedo.ts的MoveNodeCommand在构造时记录节点的oldPosition = node.position，但node.position是响应式对象的引用。如果后续拖动修改了同一节点的position，oldPosition也会被篡改，导致undo恢复到错误位置。RemoveNodeCommand中保存的节点数据同样存在引用风险。"

[[criterion]]
name = "vue-flow事件集成"
description = "[Implicit] 与vue-flow的事件系统（onNodesChange、onEdgesChange等）的集成质量。1:事件监听混乱;2:基本监听但遗漏事件;3:主要事件处理完整;4:完整的事件分类处理;5:事件+防抖+批处理+性能优化。"
type = "likert"
points = 5
weight = 1.0
score = 3
rationale = "WorkflowEditor.vue中通过onNodesChange监听节点变化，根据change.type分别处理position和remove类型。但未处理edge的change事件，连线删除操作不经过命令系统无法撤销。批量拖动时每个节点的position change独立触发，未做批处理合并。"
