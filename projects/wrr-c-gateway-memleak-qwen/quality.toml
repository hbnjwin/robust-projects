[[criterion]]
name = "memleak_root_cause"
description = "C网关程序内存泄漏根因的定位能力。1:未找到任何泄漏点;2:仅发现内存增长但未定位到具体函数;3:找到config_set中重复追加的问题但遗漏其他泄漏点;4:准确定位config_set无去重导致链表无限增长的根因;5:精准定位所有泄漏点并分析OOM触发机制"
type = "likert"
points = 5
weight = 1.0
score = 3
rationale = "在gateway.c的config_set函数中找到了总是append不去重的问题，但对config_list链表的内存增长分析不够完整"

[[criterion]]
name = "memory_ownership_fix"
description = "内存所有权管理的修复质量。1:未处理内存所有权;2:free了旧值但未strdup新值导致悬挂指针;3:strdup+free基本正确但顺序有隐患;4:正确的strdup新值→free旧值→赋值的安全顺序;5:完善的所有权管理含NULL检查和错误路径释放"
type = "likert"
points = 5
weight = 1.0
score = 3
rationale = "在config_set中使用strdup复制新值并free旧值，但strdup和free的顺序处理需要更谨慎"

[[criterion]]
name = "realloc_safety"
description = "realloc返回值的安全检查。1:直接用原指针接收realloc返回值;2:知道需要检查但实现错误;3:使用临时变量接收但失败路径未free原内存;4:正确使用临时变量检查NULL并在失败时保留原指针;5:完整的realloc安全模式含失败后的恢复和日志"
type = "likert"
points = 5
weight = 1.0
score = 3
rationale = "在buffer_append函数中使用tmp变量接收realloc返回值，避免了原指针丢失"

[[criterion]]
name = "cleanup_function"
description = "资源清理函数的设计质量。1:无清理函数程序退出即泄漏;2:有清理但仅释放部分结构;3:config_destroy释放了链表节点但遗漏key/value字符串;4:完整释放所有动态分配的内存含链表节点和字符串;5:完整清理含atexit注册确保异常退出也能释放"
type = "likert"
points = 5
weight = 1.0
score = 3
rationale = "添加了config_destroy函数遍历链表free每个节点，但对节点内key和value字符串的释放不够明确"

