[[criterion]]
name = "发票开具流程"
description = "[Explicit] 是否完整描述了电子发票从数据准备到生成的开具流程。1: 未描述开具流程；2: 只描述了部分步骤；3: 流程基本完整但未涉及金额校验和编号生成；4: 完整描述了含税价/不含税价/税额计算、编号生成和关联订单的流程；5: 开具流程分析完整且指出了金额校验的边界场景"
type = "likert"
points = 5
weight = 1.0
score = 2
rationale = "描述了发票开具的基本步骤但对含税价和不含税价的换算公式（不含税价=含税价/(1+税率)）和编号生成的唯一性保证（数据库序列+日期前缀）的分析缺乏代码级细节"

[[criterion]]
name = "作废冲红条件判断"
description = "[Explicit] 是否准确分析了作废和冲红的条件判断逻辑——当月作废vs跨月冲红、普通vs专用发票的差异。1: 未分析条件判断；2: 提到了作废和冲红但未区分条件；3: 区分了当月/跨月但未区分发票类型；4: 完整分析了当月/跨月×普通/专用的四种组合及其处理方式；5: 条件判断分析完整且指出了月末边界（如月末23时59分开的发票次日0时01分就变成跨月）的处理"
type = "likert"
points = 5
weight = 1.0
score = 4
rationale = "在invoice_service.py中分析了can_void方法的条件判断矩阵：普通发票当月可直接作废（DELETE+重开），跨月只能冲红（开负数金额红票）+重开蓝票；增值税专用发票不论当月跨月一律只能冲红。并用25个测试覆盖了这些场景"

[[criterion]]
name = "部分退款金额分摊"
description = "[Explicit] 是否分析了部分退款时红字发票金额的分摊计算方式。1: 未分析部分退款；2: 提到了部分退款但未分析分摊；3: 分析了按比例分摊但未考虑多商品场景；4: 分析了多商品场景的金额分摊和尾差处理；5: 分摊算法分析完整且指出了多次部分退款累计不能超过原发票金额的校验"
type = "likert"
points = 5
weight = 1.0
score = 2
rationale = "描述了按退款比例开红字发票的规则，但对多商品场景每个商品行的金额和税额如何分摊（按商品金额占比）以及尾差处理（最后一行兜底）的分析未涉及"

[[criterion]]
name = "税额舍入策略"
description = "[Explicit] 是否分析了税额计算中的舍入方式及其导致一分钱误差的原因。1: 未分析舍入；2: 提到了舍入误差但未分析策略；3: 分析了round函数但未对比银行家舍入和四舍五入的差异；4: 定位了税额计算的舍入策略并解释了误差来源；5: 舍入分析完整且给出了符合税务要求的精确计算方案"
type = "likert"
points = 5
weight = 1.0
score = 3
rationale = "指出了税额=含税价/(1+税率)*税率的计算中使用round(amount, 2)四舍五入导致分位误差，但未对比银行家舍入（round-half-even）在大量发票累计时的优势"

[[criterion]]
name = "红蓝关联关系"
description = "[Implicit] 是否分析了冲红发票与原蓝字发票的关联关系维护方式。1: 未分析关联；2: 提到了关联但未分析数据结构；3: 分析了外键关联但未考虑一对多场景；4: 完整分析了关联关系包含一次全额冲红和多次部分冲红的数据模型；5: 关联关系分析完整且指出了查询冲红历史的性能优化方案"
type = "likert"
points = 5
weight = 1.0
score = 3
rationale = "分析了红字发票通过original_invoice_id外键关联原蓝字发票，但对一张蓝字发票被多次部分冲红的场景下如何保证累计冲红金额不超过原发票金额的约束分析不够深入"
