[[criterion]]
name = "concurrent_refresh_guard"
description = "Token并发刷新的重入保护机制。1:未识别并发刷新问题;2:识别了但锁机制实现错误;3:实现了isRefreshing标志但存在竞态窗口;4:正确实现了基于Promise的单次刷新+排队机制;5:完善的重入保护含超时兜底"
type = "likert"
points = 5
weight = 1.0
score = 4
rationale = "准确分析了request.ts中isRefreshing=true和pendingRequests数组构成的排队机制，识别了三个并发bug"

[[criterion]]
name = "pending_request_traversal"
description = "pendingRequests数组遍历期间的修改安全性。1:未注意遍历问题;2:注意到但未修复;3:改用了安全遍历但逻辑有瑕疵;4:正确使用splice+while替代forEach避免遍历竞态;5:完美解决含并发安全性证明"
type = "likert"
points = 5
weight = 1.0
score = 4
rationale = "在request.ts中用while+splice(0,1)替代forEach，确保遍历期间新入队的请求不会被跳过"

[[criterion]]
name = "refresh_failure_propagation"
description = "刷新Token失败时排队请求的错误传播。1:刷新失败后排队请求永久挂起;2:刷新失败但只reject了部分请求;3:reject了所有排队请求但未清理状态;4:正确reject所有排队请求并重置isRefreshing;5:完善的错误传播含重试策略和用户提示"
type = "likert"
points = 5
weight = 1.0
score = 4
rationale = "catch块中先遍历pendingRequests逐一reject，再清空数组并重置isRefreshing，错误传播链完整"

[[criterion]]
name = "axios_interceptor_design"
description = "Axios响应拦截器中401处理的设计质量。1:拦截器逻辑混乱或死循环;2:基本能拦截401但多次触发刷新;3:正确拦截401并触发单次刷新;4:完整的拦截→刷新→重试流程;5:拦截器设计优雅含白名单和最大重试次数"
type = "likert"
points = 5
weight = 1.0
score = 4
rationale = "拦截器中正确区分了业务请求和refreshToken请求的401，避免了递归刷新"

