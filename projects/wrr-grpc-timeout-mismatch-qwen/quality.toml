description = "超时值设置的合理性。1:未设置超时或设置不合理;2:硬编码单一超时值;3:设置了6s但裕度较小仅覆盖服务端3-5s;4:基于服务端最大处理时间合理设置含充足裕度;5:可配置的超时策略含不同接口差异化超时"
type = "likert"
points = 5
weight = 1.0
score = 3
rationale = "设置了6s超时，刚好覆盖服务端最大处理时间5s，裕度仅1s略显保守"

