[[criterion]]
name = "请求方法修复"
description = "[Explicit] 将GET改为POST避免凭证出现在URL查询参数中。1:仍是GET;2:改了但参数仍在URL;3:POST但Content-Type不对;4:正确POST+参数在请求体;5:POST+HTTPS+CSRF防护"
type = "likert"
points = 5
weight = 1.0
score = 3
rationale = "auth-center.js的getVerifyUser方法中将appRequest.get()改为appRequest.post()，参数传递方式从params（URL查询参数）改为data（请求体），凭证不再出现在URL中，但POST请求未显式设置Content-Type头确保application/json格式"

[[criterion]]
name = "哈希算法升级"
description = "[Explicit] 密码哈希从MD5升级为更安全的算法。1:仍是MD5;2:升级但盐值不对;3:SHA-256但无盐;4:SHA-256正确替换;5:SHA-256+动态盐+PBKDF2"
type = "likert"
points = 5
weight = 1.0
score = 3
rationale = "login/index.vue中CryptoJS.MD5()改为CryptoJS.SHA256()，crypto-js库已支持无需额外依赖"

[[criterion]]
name = "凭证保护"
description = "[Explicit] 登录凭证在传输过程中的整体保护水平。1:明文URL;2:POST但明文body;3:POST+哈希但无HTTPS约束;4:POST+SHA-256+请求体传输;5:POST+SHA-256+TLS强制+token机制"
type = "likert"
points = 5
weight = 1.0
score = 3
rationale = "POST请求将userName和password从URL查询参数移至请求体，SHA-256替代MD5提升了哈希抗碰撞强度，两项修复形成基本的传输层凭证保护，但未添加HTTPS强制约束或CSRF token等额外防护措施"

[[criterion]]
name = "代码精准度"
description = "[Implicit] 修改是否精准聚焦于目标文件且无大量无关改动。1:大量无关修改;2:有明显冗余;3:基本精准但有少量无关改动;4:精准修改仅涉及目标文件;5:最小改动零冗余"
type = "likert"
points = 5
weight = 1.0
score = 3
rationale = "代码修改集中在auth-center.js的getVerifyUser方法（get改post、params改data）和login/index.vue的handleLogin方法（CryptoJS.MD5改CryptoJS.SHA256）两处核心位置，修改范围与安全修复目标基本吻合"

[[criterion]]
name = "安全意识"
description = "[Implicit] 对Web安全最佳实践的理解和应用。1:无安全意识;2:只做了表面修复;3:理解问题但修复不全面;4:GET改POST+哈希升级完整修复;5:完整修复+安全审计+CSP配置"
type = "likert"
points = 5
weight = 1.0
score = 3
rationale = "正确识别了GET请求凭证暴露（OWASP A02敏感数据暴露）和MD5弱哈希（彩虹表攻击风险）两个安全问题，分别采取POST请求体传输和SHA-256升级两种标准对策，但未深入分析盐值、PBKDF2等进阶哈希加固方案"
