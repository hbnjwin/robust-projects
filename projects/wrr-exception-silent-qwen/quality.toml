[[criterion]]
name = "SysUserUtils静默异常修复"
description = "[Explicit] 是否修复了SysUserUtils.currentUser()中catch块静默吞掉异常并返回空SysOperator的问题，使调用方能区分未登录和会话数据损坏。1: 未修改SysUserUtils；2: 添加了日志但仍返回空对象；3: 添加了日志并对部分异常抛出；4: 区分了未登录（返回空对象）和会话损坏（抛出BizException），添加了@Slf4j日志记录；5: 完整区分两种情况并在异常信息中包含诊断细节。"
type = "likert"
points = 5
weight = 1.0
score = 3
rationale = "修改了SysUserUtils.currentUser()，添加了@Slf4j注解并在catch块中记录异常日志，但在异常处理策略上的区分不够明确。"

[[criterion]]
name = "SysOperaLogAspect空catch修复"
description = "[Explicit] 是否修复了SysOperaLogAspect中三个完全空的catch块（62-65、96-98、125-128行），使审计日志保存失败时有日志记录。1: 未修改任何catch块；2: 只修改了1个catch块；3: 修改了2个；4: 三个catch块都添加了日志记录；5: 三个catch块都添加了log.error并传入异常对象，且不影响业务主流程。"
type = "likert"
points = 5
weight = 1.0
score = 3
rationale = "修改了SysOperaLogAspect的catch块添加了异常处理，但对三个catch块的修改完整性在总结中未逐一说明。"

[[criterion]]
name = "自定义异常层次建立"
description = "[Explicit] 是否创建了至少3个自定义异常类来区分不同的业务错误场景（如EntityNotFoundException对应404、ServiceUnavailableException对应503、InvalidInputException对应400）。1: 未创建任何自定义异常；2: 只创建了1个通用异常；3: 创建了2个自定义异常；4: 创建了3-4个覆盖主要场景的自定义异常；5: 创建了完整的异常层次并包含基类BizException。"
type = "likert"
points = 5
weight = 1.0
score = 4
rationale = "创建了BizException（业务异常基类含CodeMsg）、EntityNotFoundException、ServiceUnavailableException、InvalidInputException四个自定义异常类，还额外创建了CodeMsg和R类支持统一响应格式。"

[[criterion]]
name = "GlobalExceptionHandler增强"
description = "[Explicit] 是否增强了全局异常处理器，为新的自定义异常类添加了对应的@ExceptionHandler方法并返回正确的HTTP状态码。1: 未修改GlobalExceptionHandler；2: 添加了1个handler；3: 添加了2个handler；4: 为所有新异常类都添加了handler并返回正确状态码（404/503/400）；5: handler使用ResponseEntity返回正确状态码且响应格式与已有handler一致。"
type = "likert"
points = 5
weight = 1.0
score = 3
rationale = "修改了GlobalExceptionHandler添加了新的@ExceptionHandler方法，但对404、503、400三种状态码的区分处理在总结中未全部明确说明。"

[[criterion]]
name = "实体未找到异常替换"
description = "[Explicit] 是否将ExtractionTasksServiceImpl和CheckResultServiceImpl中实体未找到时返回null的逻辑改为抛出EntityNotFoundException。1: 未修改返回null的逻辑；2: 只修改了一个类；3: 两个类都修改但异常信息不够明确；4: 两个类都改为抛出EntityNotFoundException并包含实体ID信息；5: 所有服务类中返回null的逻辑都检查并替换为明确异常。"
type = "likert"
points = 5
weight = 1.0
score = 3
rationale = "修改了ExtractionTasksServiceImpl和CheckResultServiceImpl中实体未找到时的处理逻辑，但异常信息的具体内容在总结中未详细说明。"

[[criterion]]
name = "HTTP状态码语义区分"
description = "[Implicit] 是否在异常层次设计中考虑了HTTP状态码的语义区分，使全局异常处理器能将文档未找到映射到404、OCR服务不可用映射到503、输入格式错误映射到400。1: 所有异常返回同一状态码；2: 区分了500和其他；3: 区分了404和500；4: 区分了404、400、503三种状态码；5: 完整的状态码映射并在异常类中携带状态码信息。"
type = "likert"
points = 5
weight = 1.0
score = 3
rationale = "自定义异常类的设计覆盖了主要的HTTP状态码场景，但异常类本身是否携带HttpStatus信息在总结中未详细说明。"

[[criterion]]
name = "异常日志记录规范"
description = "[Implicit] 是否在修复静默异常的同时建立了一致的异常日志记录规范（使用log.error记录异常堆栈、包含上下文信息）。1: 仍然静默吞异常；2: 添加了日志但不一致；3: 主要位置添加了log.error；4: 所有修改点使用一致的log.error格式并传入异常对象；5: 一致的日志格式且包含业务上下文信息（如实体类型、实体ID）。"
type = "likert"
points = 5
weight = 1.0
score = 3
rationale = "在SysUserUtils和SysOperaLogAspect中添加了异常日志记录，但日志格式的一致性和上下文信息的丰富程度在各修改点可能不统一。"
