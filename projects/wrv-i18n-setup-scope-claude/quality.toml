[[criterion]]
name = "根因定位"
description = "[Explicit] 准确定位'Must be called at the top of a setup function'错误的根本原因：在非setup上下文中调用了useI18n()组合式API。1: 未定位；2: 知道报错但不知原因；3: 找到useI18n但未分析调用上下文；4: 准确定位lang/index.js中setLocaleOnClient和lang导出函数在模块顶层或非组件函数中调用useI18n()违反了Vue 3组合式API约束；5: 定位根因并解释了Vue 3 setup函数的调用时机限制"
type = "likert"
points = 5
weight = 1.0
score = 4
rationale = "通过Read读取lang/index.js第34-43行，分析setLocaleOnClient()和lang()两个导出函数在被其他模块调用时执行useI18n()，但此时不在任何Vue组件的setup()上下文中，违反了Vue 3组合式API的调用约束"

[[criterion]]
name = "API替换"
description = "[Explicit] 将useI18n()替换为i18n.global直接访问全局i18n实例。1: 仍使用useI18n；2: 替换了但访问方式不对；3: 用了i18n.global但属性名不正确；4: 正确用i18n.global.locale.value替代useI18n()的locale；5: 替换加TypeScript类型支持"
type = "likert"
points = 5
weight = 1.0
score = 4
rationale = "lang/index.js第35行将const {locale} = useI18n()改为直接使用i18n.global.locale.value赋值，第41行lang导出改为() => i18n.global.locale.value，绕过setup函数的调用限制"

[[criterion]]
name = "scope理解"
description = "[Implicit] 对Vue 3 useI18n与i18n.global两种API的使用场景理解。1: 混淆两种API；2: 知道区别但解释不准确；3: 理解但未说明适用场景；4: 准确区分useI18n(组件setup内)和i18n.global(模块/工具函数)的适用场景；5: 深入理解并说明了useScope选项的作用"
type = "likert"
points = 5
weight = 1.0
score = 4
rationale = "准确理解useI18n()是组合式API仅能在组件setup()函数同步执行栈中调用，而lang/index.js是独立模块非组件上下文，i18n.global作为全局单例可在任何JavaScript上下文中安全访问"

