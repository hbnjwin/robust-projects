type = "likert"
points = 5
weight = 1.0
score = 4
rationale = "nav-bar/index.vue第23行将userInfo.operatorName改为userInfo?.operatorName，使用可选链防止signOut过程中userInfo被清空后模板渲染崩溃"

[[criterion]]
