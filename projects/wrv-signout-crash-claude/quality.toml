[[criterion]]
name = "崩溃根因定位"
description = "[Explicit] 准确定位退出登录崩溃的根本原因：signOut方法中router.push未await导致路由过渡期间userInfo被清空，模板仍访问null.operatorName。1: 未定位；2: 只看到TypeError但不知原因；3: 知道userInfo为null但未分析时序；4: 完整分析router.push异步执行与clearUserInfo的时序竞争；5: 分析时序竞争并识别了所有可能的null引用路径"
type = "likert"
points = 5
weight = 1.0
score = 5
rationale = "5次工具调用快速定位根因：nav-bar/index.vue的signOut方法中router.push({name:'Login'})未await，紧接着store.clearUserInfo()将userInfo置为null，在0.3秒路由过渡动画期间模板仍尝试渲染{{userInfo.operatorName}}导致TypeError"

[[criterion]]
name = "空引用防护"
