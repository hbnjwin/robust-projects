[[criterion]]
name = "定时器清除与生命周期"
description = "[Explicit] 是否在组件卸载时正确清除setInterval定时器，防止切换页面后定时器泄漏。1: 未处理onUnmounted中的clearInterval; 2: 仅清除部分定时器或清除逻辑有条件遗漏; 3: onUnmounted中调用clearInterval但未处理多次挂载叠加; 4: 封装composable统一管理定时器创建与销毁; 5: composable含完整的挂载/卸载生命周期绑定且支持动态间隔切换"
type = "likert"
points = 5
weight = 1.0
score = 3
rationale = "Dashboard.vue的onUnmounted中调用了clearInterval，创建了useInterval.ts composable封装定时器逻辑，但项目中创建了13个文件，部分文件如env.d.ts、vite.config.ts与定时器修复无直接关系，composable实现基本可用但整体改动范围过大"

[[criterion]]
name = "重新挂载数据恢复"
description = "[Explicit] 是否在v-if切换回Dashboard时重新启动数据轮询，确保KPI卡片立即获取最新数据。1: 切回后KPI数据保持销毁前的旧值不更新; 2: 切回后需手动刷新才能恢复更新; 3: 切回后自动恢复轮询但首次显示有明显延迟; 4: onMounted中立即执行一次数据拉取再启动定时轮询; 5: 立即拉取+轮询恢复且显示loading骨架屏过渡"
type = "likert"
points = 5
weight = 1.0
score = 3
rationale = "useInterval composable在onMounted中重新创建setInterval，切回Dashboard时可恢复轮询，但未明确处理首次立即执行的逻辑，需等待一个interval周期才显示新数据"

[[criterion]]
name = "多定时器叠加防护"
description = "[Implicit] 是否防止反复切换页面导致多个setInterval叠加运行，造成请求频率倍增。1: 每次onMounted新建定时器但从未清除旧的; 2: 清除逻辑存在但有竞态条件可能遗漏; 3: onUnmounted清除但未处理快速切换场景; 4: 创建新定时器前先清除已有定时器; 5: composable内部维护单一timerId引用，创建前必清除旧引用"
type = "likert"
points = 5
weight = 1.0
score = 3
rationale = "useInterval.ts中维护了timerId变量，但在快速切换场景下未看到显式的创建前清除旧定时器的逻辑，依赖onUnmounted的时序正确性"

[[criterion]]
name = "加载状态与骨架屏"
description = "[Explicit] 是否在KPI数据获取期间显示loading骨架屏，避免用户看到空白或旧数据。1: 无任何加载状态提示; 2: 仅有简单的loading文字; 3: 有loading状态但切换回来时不显示; 4: 首次加载和切换回来都显示骨架屏; 5: 骨架屏样式与KPI卡片一致且有平滑过渡动画"
type = "likert"
points = 5
weight = 1.0
score = 2
rationale = "KpiCard.vue组件中有基本的条件渲染但未实现NaiveUI的NSkeleton骨架屏组件，仅通过v-if判断数据是否存在来切换显示"

[[criterion]]
name = "轮询间隔与性能"
description = "[Implicit] 是否合理管理3秒轮询间隔，避免组件不可见时浪费网络请求。1: 硬编码setInterval无任何优化; 2: 间隔可配置但不可见时仍轮询; 3: 组件卸载时停止轮询但无页面可见性检测; 4: 结合document.visibilitychange暂停/恢复轮询; 5: 可见性检测+恢复时立即刷新数据+间隔动态可调"
type = "likert"
points = 5
weight = 1.0
score = 2
rationale = "在Dashboard.vue中使用固定3秒setInterval，虽然useInterval封装了创建销毁逻辑但未结合页面可见性API优化后台轮询"

[[criterion]]
name = "代码组织与改动范围"
description = "[Implicit] 是否将修复控制在合理的文件范围内，避免不必要的重构扩散。1: 改动超过10个文件且包含大量与bug无关的变更; 2: 改动8-10个文件部分无关; 3: 改动5-7个文件基本围绕修复; 4: 改动3-4个文件精准定位; 5: 仅改动必要的1-2个核心文件加上composable提取"
type = "likert"
points = 5
weight = 1.0
score = 2
rationale = "共编辑13个文件包括env.d.ts、vite.config.ts、index.html、package.json等与定时器bug修复无关的配置文件，改动范围过大"
