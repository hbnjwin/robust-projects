type = "likert"
points = 5
weight = 1.0
score = 5
rationale = "按P0到P2优先级归纳了五个设计风险并给出了完整的改进路线图：P0金额精度迁移方案（float→Decimal分三步走）、P1互斥规则引擎（独立配置表+规则冲突检测）、P1计算顺序可配置（Pipeline模式+A/B测试）、P2并发安全、P2审计日志"
