[[criterion]]
name = "RFC5987文件名解析"
description = "[Explicit] Content-Disposition中filename*=UTF-8''编码格式的正确解析。1:直接显示乱码;2:识别了编码但解码错误;3:UTF-8解码正确但传统格式兼容有问题;4:双格式兼容(filename*优先);5:完整解析含特殊字符和空格处理"
type = "likert"
points = 5
weight = 1.0
score = 5
rationale = "filename_encoding.py在服务端同时生成filename（ASCII fallback）和filename*（UTF-8编码）两个字段，前端download.py的parse_content_disposition完整处理了两种格式，31个测试覆盖了各种特殊字符组合"

