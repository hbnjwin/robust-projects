[[criterion]]
name = "参数对齐与差异高亮"
description = "[Explicit] 是否实现产品参数自动对齐和差异高亮——选中产品后对比页自动合并相同参数横向对齐且数值不同的参数高亮标记。1:未实现对齐或高亮;2:仅简单列表无对齐;3:有对齐但高亮缺失或不准确;4:对齐加高亮功能完整;5:对齐算法加差异检测有独立模块和测试验证"
type = "likert"
points = 5
weight = 1.0
score = 4
rationale = "实现了参数横向对齐加橙色边线差异高亮，功能描述完整，但单文件无法充分验证"

[[criterion]]
name = "折叠搜索筛选"
description = "[Explicit] 参数过多时是否支持折叠分组和搜索过滤——几十项参数需要按类别折叠支持关键词搜索快速定位。1:无折叠无搜索;2:有折叠但无搜索;3:折叠加搜索基本可用;4:折叠加搜索加仅差异模式功能全面;5:独立模块实现有测试覆盖工程质量高"
type = "likert"
points = 5
weight = 1.0
score = 4
rationale = "7个参数组折叠加实时搜索加高亮加仅差异模式，功能全面"

[[criterion]]
name = "移动端响应式设计"
description = "[Explicit] 移动端是否可用——对比表格在小屏幕上需要横向滚动或其他适配方案且参数列需要固定可见。1:无移动端适配;2:有viewport但布局错乱;3:基本可用但CSS内嵌难维护;4:独立样式文件响应式布局加sticky列;5:完整移动端适配经过多尺寸测试验证"
type = "likert"
points = 5
weight = 1.0
score = 3
rationale = "声称有sticky参数列加横向滚动，但单文件CSS内嵌难以维护和验证"

[[criterion]]
name = "多品类产品支持"
description = "[Explicit] 是否支持不同产品类别的不同参数——题目要求不同类别参数不一样需要类别筛选和参数动态适配。1:无类别区分;2:仅一个类别的产品数据;3:多类别但参数未区分;4:多类别加不同参数加类别筛选;5:多类别多产品每类30项以上参数完整类别筛选"
type = "likert"
points = 5
weight = 1.0
score = 2
rationale = "仅手机一个类别4款产品，题目要求不同产品类别参数不同未充分满足"

[[criterion]]
name = "项目文件组织"
description = "[Implicit] 代码是否写入正确的项目目录且采用合理的文件组织结构。1:写入错误路径如桌面;2:正确目录但单文件全部内嵌;3:正确目录但文件分离不充分;4:模块化HTML和CSS和JS分离;5:完整工程化结构含package.json等配置"
type = "likert"
points = 5
weight = 1.0
score = 1
rationale = "全部写在单个HTML文件中且写到桌面而非项目目录，无工程化结构"

[[criterion]]
name = "测试验证"
description = "[Implicit] 是否有测试验证功能正确性——对齐算法和差异检测和搜索过滤等核心逻辑是否有自动化测试。1:无任何测试;2:有手动验证但无自动测试;3:少量测试覆盖主干;4:测试覆盖核心逻辑;5:完整单元测试覆盖所有核心模块"
type = "likert"
points = 5
weight = 1.0
score = 1
rationale = "无任何测试，未运行验证，功能正确性无法保证"

[[criterion]]
name = "开发过程质量"
description = "[Implicit] 是否有清晰的开发规划且按计划有序执行而非随意操作。1:无规划直接输出单文件;2:极少操作草率完成;3:有基本开发流程但不完整;4:使用任务管理工具系统拆分任务并有序执行;5:精细规划含优先级且执行高效无冗余"
type = "likert"
