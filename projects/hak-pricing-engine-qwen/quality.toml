[[criterion]]
name = "优惠规则排序机制"
description = "[Explicit] 是否解读了优惠规则的加载流程和优先级排序算法。1: 未分析排序；2: 只列出了优惠类型；3: 解读了排序字段但未分析排序对计算结果的影响；4: 完整解读了DiscountRuleLoader的排序逻辑和优先级决定机制；5: 排序逻辑分析完整且通过示例说明了不同排序对最终金额的影响"
type = "likert"
points = 5
weight = 1.0
score = 3
rationale = "在pricing_engine.py中分析了规则按priority字段排序的逻辑，但对排序算法的稳定性和同优先级规则的处理顺序分析不够深入，未用具体示例说明排序对最终金额的影响"

[[criterion]]
name = "互斥规则实现"
description = "[Explicit] 是否分析了不同优惠之间的互斥关系实现方式。1: 未提及互斥；2: 提到互斥但未分析实现；3: 分析了部分互斥规则但遗漏了秒杀和满减的互斥；4: 完整分析了互斥矩阵的实现（位图或标签）；5: 互斥实现分析完整且识别出了互斥规则缺失导致优惠叠加的漏洞"
type = "likert"
points = 5
weight = 1.0
score = 2
rationale = "提到了秒杀价和满减不能叠加的业务规则，但对互斥关系在代码中的具体实现方式（标签组还是冲突矩阵）完全基于推测，未在pricing_engine.py中找到互斥相关的代码逻辑"

[[criterion]]
name = "金额精度处理"
description = "[Explicit] 是否识别了金额计算中浮点数精度可能导致的误差及其处理方式。1: 未提及精度；2: 提到精度但未分析代码中的处理方式；3: 识别了float精度问题但未确认代码用的是float还是Decimal；4: 确认了代码中的精度处理方式并指出了具体的精度丢失位置；5: 精度分析完整含舍入策略和分/元转换的边界处理"
type = "likert"
points = 5
weight = 1.0
score = 3
rationale = "在pricing_engine.py中确认了金额计算使用了float类型，指出了折扣率乘以价格时的浮点误差问题，但对具体精度丢失的代码位置定位不够精确，建议改用Decimal的方案未给出迁移步骤"

[[criterion]]
name = "计算顺序影响"
description = "[Explicit] 是否分析了优惠计算顺序（折扣在满减前还是后）对最终金额的影响。1: 未分析计算顺序；2: 提到了顺序但未举例；3: 用示例说明了不同顺序的金额差异但未定位代码中的实际顺序；4: 定位了代码中的计算顺序并用具体金额说明了差异；5: 计算顺序分析完整且指出了当前实现与业务预期不一致的具体场景"
type = "likert"
points = 5
weight = 1.0
score = 3
rationale = "讨论了折扣在满减前后计算对金额的影响并给出了数值示例，但在apply_discounts方法中对实际执行顺序的确认不够确定，部分结论存在推测"

[[criterion]]
name = "设计风险评估"
description = "[Implicit] 是否归纳了价格计算引擎的主要设计风险并给出改进建议。1: 未评估风险；2: 列出了一两个风险但不全面；3: 归纳了主要风险但改进建议不具体；4: 风险评估全面且每项附带具体改进方案；5: 风险按优先级排序并给出了短期修复和长期架构改进的路线图"
type = "likert"
points = 5
weight = 1.0
score = 3
rationale = "归纳了浮点精度、互斥规则不完善、计算顺序可配置性差三个风险，但改进建议较笼统（如建议使用Decimal但未说明迁移方案）"
